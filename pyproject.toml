[build-system]
# >=77 for PEP 639 license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpuzzle-solver"
version = "0.1.0"
description = "Constraint-propagation solver for Sudoku, Killer Sudoku, Futoshiki, KenKen, Latin squares, Hidato, Numbrix, Kakuro, Slitherlink, and Str8ts, with a browser scanner app"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "senegrom" }]
dependencies = [
    "colorama>=0.4.6",
    "rich>=13.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.scripts]
gridpuzzle = "run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.setuptools]
py-modules = ["run", "examples2"]

[tool.setuptools.packages.find]
# Examples ships only its .py example modules (gridpuzzle -e s/f/m imports
# them); the .clp/.pzl corpus files in its subdirectories stay repo-only.
include = ["gridsolver*", "Examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
    "slow: very long-running tests (deselect with -m 'not slow')",
]

[tool.ruff.lint]
# Pinned so results do not drift with ruff's own default set. Everything here
# is clean today; widen deliberately, with the fixes in the same commit.
select = [
    "E4", "E7", "E9", "F",  # pyflakes and the classic pycodestyle errors
    "W",                    # pycodestyle warnings
    "C4",                   # comprehension and literal simplifications
    "SIM",                  # flake8-simplify
    "RET",                  # return-statement hygiene
    "A",                    # builtin shadowing
    "DTZ",                  # naive datetimes
    "G", "LOG",             # logging call hygiene
    "ICN", "TID",           # import conventions and tidy imports
    "PGH",                  # blanket noqa / type-ignore
    "T10",                  # leftover debugger calls
    "YTT",                  # sys.version misuse
]

[tool.ruff.lint.per-file-ignores]
# These harnesses put the repository root on sys.path before importing it.
"tests/fish_rewrite_harness.py" = ["E402"]
"tests/technique_stats_harness.py" = ["E402"]
