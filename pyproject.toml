[build-system]
# >=77 for PEP 639 license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpuzzle-solver"
version = "0.1.0"
description = "Constraint-propagation solver for Sudoku, Killer Sudoku, Futoshiki, KenKen, Latin squares, Hidato, Numbrix, Kakuro, and Slitherlink"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "senegrom" }]
dependencies = [
    "colorama>=0.4.6",
    "rich>=13.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.scripts]
gridpuzzle = "run:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.setuptools]
py-modules = ["run", "examples2"]

[tool.setuptools.packages.find]
# Examples ships only its .py example modules (gridpuzzle -e s/f/m imports
# them); the .clp/.pzl corpus files in its subdirectories stay repo-only.
include = ["gridsolver*", "Examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
    "slow: very long-running tests (deselect with -m 'not slow')",
]

[tool.ruff.lint]
# The repository is not undertaking a wholesale style migration in PR 11.
# Keep this one-time gate to syntax- and runtime-critical diagnostics.
select = ["E9", "F63", "F7", "F82"]
