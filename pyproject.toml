[build-system]
# >=77 for PEP 639 license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpuzzle-solver"
version = "0.1.0"
description = "Constraint-propagation solver for Sudoku, Killer Sudoku, Futoshiki, KenKen, Latin squares, Hidato, Numbrix, Kakuro, Slitherlink, and Str8ts, with a browser scanner app"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "senegrom" }]
dependencies = [
    "colorama>=0.4.6",
    "rich>=13.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.scripts]
gridpuzzle = "gridsolver.cli:main"

[project.optional-dependencies]
# The oldest releases with Python 3.14 wheels; the lowest-dependencies CI job
# installs exactly these.
corpus = [
    "Pillow>=11.3",
    "numpy>=2.3.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]

[tool.setuptools.packages.find]
# Only the gridsolver package installs: the CLI is gridsolver.cli and the
# --example puzzles are gridsolver.examples. Top-level modules such as the
# checkout's run.py shim would collide with other distributions' run.py.
include = ["gridsolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
# pytest attaches its capture handler to the root logger for every test,
# at level NOTSET unless this sets one. The solver logs its steps at INFO and
# DEBUG under the "gridsolver" logger and renders a step only when some
# handler would accept it, so at WARNING the capture handler admits no solver
# output and a deep search formats nothing that nobody reads. (Before solver
# logging used standard levels, a NOTSET handler slowed the 1024-decision
# chain from 0.85 s to 27 s, measured 2026-09-21.) Tests that read the log set
# the level they need with caplog.set_level.
log_level = "WARNING"
xfail_strict = true
markers = [
    "slow: very long-running tests (deselect with -m 'not slow')",
    "gate: tests of the jobs that decide whether CI jobs run; an ungated job runs them on every pull request",
]

[tool.ruff.lint]
# Pinned so results do not drift with ruff's own default set. Everything here
# is clean today; widen deliberately, with the fixes in the same commit.
select = [
    "E4", "E7", "E9", "F",  # pyflakes and the classic pycodestyle errors
    "W",                    # pycodestyle warnings
    "C4",                   # comprehension and literal simplifications
    "SIM",                  # flake8-simplify
    "RET",                  # return-statement hygiene
    "A",                    # builtin shadowing
    "DTZ",                  # naive datetimes
    "G", "LOG",             # logging call hygiene
    "ICN", "TID",           # import conventions and tidy imports
    "PGH",                  # blanket noqa / type-ignore
    "T10",                  # leftover debugger calls
    "YTT",                  # sys.version misuse
]

[tool.ruff.lint.per-file-ignores]
# This harness puts the repository root on sys.path before importing it.
"tests/technique_stats_harness.py" = ["E402"]
