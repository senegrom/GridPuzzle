name: Temporary combined hot-path candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/hotpath-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotpath-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply combined semantics-preserving speedups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          # AIC: remove millions of temporary singleton/default sets.
          path = Path("gridsolver/solver/solve_aic.py")
          text = path.read_text(encoding="utf-8")
          replacement = dedent('''
              def _get_cells(node: Node) -> FrozenSet[int] | tuple[int]:
                  """Return an existing group or a compact singleton view."""
                  cells, _ = node
                  if isinstance(cells, frozenset):
                      return cells
                  return (cells,)

              def _cells_see_all(target_cell: int, node: Node) -> bool:
                  """Whether target_cell sees every cell in node, allocation-free."""
                  cells, _ = node
                  peers = cell_peers[target_cell]
                  if isinstance(cells, frozenset):
                      return cells <= peers
                  return cells in peers

          ''')
          replacement = "".join(
              f"    {line}\n" if line else "\n"
              for line in replacement.splitlines()
          )
          text = replace_between(
              text,
              "    def _get_cells(node: Node) -> Set[int]:\n",
              "    # --- BFS for AICs ---\n",
              replacement,
          )
          path.write_text(text, encoding="utf-8")

          # Rule helper: directly materialise one final relation per origin.
          path = Path("gridsolver/solver/rulehelpers.py")
          text = path.read_text(encoding="utf-8")
          replacement = dedent('''
              def rulehelper_atmostonce(grid: Grid) -> None:
                  """Materialise the union of all active inequalities per origin cell."""
                  desired: list[set[int]] = [set() for _ in range(grid.len)]
                  for cells in grid.unique_rule_cells:
                      if len(cells) <= 1:
                          continue
                      for cell in cells:
                          desired[cell].update(cells)
                          desired[cell].discard(cell)

                  existing_by_origin: dict[int, list[uneq.UneqRule]] = {}
                  for rule in grid.get_rules_of_type(uneq.UneqRule):
                      existing_by_origin.setdefault(rule.origin_cell, []).append(rule)

                  additions: list[uneq.UneqRule] = []
                  to_deactivate: list[uneq.UneqRule] = []
                  for origin, required in enumerate(desired):
                      existing = existing_by_origin.get(origin, [])
                      merged = set(required)
                      for rule in existing:
                          merged.update(rule.rel_cells)
                      if not merged:
                          continue

                      target = frozenset(merged)
                      keeper = next(
                          (rule for rule in existing if rule.rel_cells == target),
                          None,
                      )
                      to_deactivate.extend(
                          rule for rule in existing if rule is not keeper
                      )
                      if keeper is None:
                          additions.append(uneq.UneqRule(grid, origin, target))

                  for rule in to_deactivate:
                      grid.deactivate_rule(rule)
                  grid.add_rules_checked(additions)

          ''').lstrip()
          text = replace_between(
              text,
              "def rulehelper_atmostonce(grid: Grid) -> None:\n",
              "def rulehelper_house_sums(grid: Grid) -> None:\n",
              replacement,
          )
          path.write_text(text, encoding="utf-8")

          # Guarantee: use NamedTuple's C-level tuple hash.
          path = Path("gridsolver/rules/rules.py")
          text = path.read_text(encoding="utf-8")
          old = dedent('''
              class Guarantee(NamedTuple):
                  val: int
                  cells: frozenset[int]
                  rows: int
                  cols: int

                  def __hash__(self) -> int:
                      return hash((type(self), hash(self.cells), self.val, self.rows, self.cols))

                  def __eq__(self, other: object) -> bool:
                      # The hash mixes in the type, so equality must be type-strict as well.
                      return type(other) is Guarantee and tuple.__eq__(self, other)

                  def __ne__(self, other: object) -> bool:
                      return not self.__eq__(other)
          ''').lstrip()
          new = dedent('''
              class Guarantee(NamedTuple):
                  val: int
                  cells: frozenset[int]
                  rows: int
                  cols: int

                  # Equality remains type-strict; unequal types may legally share a hash.
                  __hash__ = tuple.__hash__

                  def __eq__(self, other: object) -> bool:
                      return type(other) is Guarantee and tuple.__eq__(self, other)

                  def __ne__(self, other: object) -> bool:
                      return not self.__eq__(other)
          ''').lstrip()
          if text.count(old) != 1:
              raise SystemExit(f"Guarantee marker count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Guarantee relevance: cache immutable tuples for the current guarantee
          # generation instead of rebuilding a list for every rule application.
          path = Path("gridsolver/solver/propagation.py")
          text = path.read_text(encoding="utf-8")
          replacement = dedent('''
              def relevant_guarantees(grid: Grid, rule: Rule) -> Iterable[Guarantee]:
                  """Return the cached guarantee superset that may affect ``rule``.

                  Relevance depends only on the rule cells and live guarantee set;
                  the guarantee-only cache already has exactly that lifecycle.
                  """
                  if not rule.uses_guarantees:
                      return _NO_GUARANTEES
                  index = grid.cached_guarantee_struct(
                      "gts_by_min_cell",
                      lambda: _build_guarantee_index(grid),
                  )
                  return grid.cached_guarantee_struct(
                      ("relevant_guarantees", rule.cells),
                      lambda: tuple(
                          guarantee
                          for cell in rule.cells
                          for guarantee in index.get(cell, ())
                      ),
                  )

          ''').lstrip()
          text = replace_between(
              text,
              "def relevant_guarantees(grid: Grid, rule: Rule) -> Iterable[Guarantee]:\n",
              "def update_known_from_candidates(\n",
              replacement,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("gridsolver/abstract_grids/grid.py")
          text = path.read_text(encoding="utf-8")
          old = "    def cached_guarantee_struct(self, key: str, factory: Callable[[], Any]) -> Any:\n"
          new = "    def cached_guarantee_struct(self, key: Any, factory: Callable[[], Any]) -> Any:\n"
          if text.count(old) != 1:
              raise SystemExit("cached_guarantee_struct marker changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("tests/test_hotpath_regressions.py").write_text(
              dedent('''
                  from gridsolver.abstract_grids.grid import Grid
                  from gridsolver.grid_classes.sudoku import Sudoku
                  from gridsolver.rules.rules import Guarantee
                  from gridsolver.rules.uneq import UneqRule
                  from gridsolver.rules.unique import ElementsAtMostOnce
                  from gridsolver.solver.propagation import relevant_guarantees
                  from gridsolver.solver.rulehelpers import rulehelper_atmostonce


                  def test_relevant_guarantees_are_cached_until_guarantees_change():
                      grid = Grid(2)
                      rule = ElementsAtMostOnce(grid, cells=[0, 1])
                      grid.add_rule_checked(rule)
                      grid.add_gtee_checked(
                          Guarantee(1, frozenset({0, 1}), 2, 2)
                      )

                      first = relevant_guarantees(grid, rule)
                      assert relevant_guarantees(grid, rule) is first

                      grid.add_gtee_checked(
                          Guarantee(2, frozenset({0, 1}), 2, 2)
                      )
                      refreshed = relevant_guarantees(grid, rule)
                      assert refreshed is not first
                      assert {guarantee.val for guarantee in refreshed} == {1, 2}


                  def test_rulehelper_atmostonce_reaches_a_stable_merged_structure():
                      grid = Sudoku(2, 2, 2, 2)
                      grid.add_rule_checked(UneqRule(grid, 0, [15]))

                      rulehelper_atmostonce(grid)
                      origin_zero = [
                          rule
                          for rule in grid.get_rules_of_type(UneqRule)
                          if rule.origin_cell == 0
                      ]
                      assert len(origin_zero) == 1
                      assert 15 in origin_zero[0].rel_cells

                      sentinel = grid.cached_struct("sentinel", object)
                      cache = grid._struct_cache
                      rules = grid.rules.copy()
                      rulehelper_atmostonce(grid)

                      assert grid.rules == rules
                      assert grid._struct_cache is cache
                      assert grid._struct_cache["sentinel"] is sentinel
              ''').lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Install and test combined candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_hotpath_regressions.py \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_basic.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Compare baseline and combined candidate without depth gating
        shell: bash
        run: |
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/hot_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import logging
          import statistics
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          logging.disable(10_000)

          def factory(case):
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load("123456654321........................", row_wise=False)
                  return grid, 20, 20
              raise SystemExit(case)

          case = sys.argv[1]
          durations = []
          digest = None
          for _ in range(2):
              gc.collect()
              grid, max_sols, expected = factory(case)
              start = time.perf_counter()
              solutions = solver.solve(
                  grid,
                  log_level=0,
                  max_sols=max_sols,
                  depth_gate=None,
              )
              durations.append(time.perf_counter() - start)
              if len(solutions) != expected:
                  raise SystemExit(f"{case}: expected {expected}, got {len(solutions)}")
              payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
              current = hashlib.sha256(payload).hexdigest()
              if digest is None:
                  digest = current
              elif current != digest:
                  raise SystemExit(f"{case}: nondeterministic solution set")
          print(json.dumps({
              "case": case,
              "seconds": durations,
              "median": statistics.median(durations),
              "digest": digest,
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/hot_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
