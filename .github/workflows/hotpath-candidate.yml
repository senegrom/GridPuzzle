name: Temporary hot-path candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/hotpath-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotpath-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply semantics-preserving hot-path candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_between(text: str, start_marker: str, end_marker: str, replacement: str) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          # C-level Guarantee hashing and one cached immutable base hash per Rule.
          path = Path("gridsolver/rules/rules.py")
          text = path.read_text(encoding="utf-8")
          guarantee = dedent('''
              class Guarantee(NamedTuple):
                  val: int
                  cells: frozenset[int]
                  rows: int
                  cols: int

                  # Equality remains type-strict. Unequal types may legally share a
                  # hash, so use NamedTuple's C-level tuple hash instead of rebuilding
                  # and hashing another tuple in Python millions of times.
                  __hash__ = tuple.__hash__

                  def __eq__(self, other: object) -> bool:
                      return type(other) is Guarantee and tuple.__eq__(self, other)

                  def __ne__(self, other: object) -> bool:
                      return not self.__eq__(other)

          ''').lstrip()
          text = replace_between(
              text,
              "class Guarantee(NamedTuple):\n",
              "type TApplyResult = tuple[\n",
              guarantee,
          )
          old_slots = '    __slots__ = ("cells", "_rows", "_cols", "_max_elem", "len_cells", "_frozen")\n'
          new_slots = '    __slots__ = ("cells", "_rows", "_cols", "_max_elem", "len_cells", "_frozen", "_base_hash")\n'
          if text.count(old_slots) != 1:
              raise SystemExit("Rule slot marker changed")
          text = text.replace(old_slots, new_slots, 1)
          old_init = '        object.__setattr__(self, "_frozen", False)\n        self._rows = gsz.rows\n'
          new_init = '        object.__setattr__(self, "_frozen", False)\n        object.__setattr__(self, "_base_hash", None)\n        self._rows = gsz.rows\n'
          if text.count(old_init) != 1:
              raise SystemExit("Rule initializer marker changed")
          text = text.replace(old_init, new_init, 1)
          rule_class = text.index("class Rule(ABC):\n")
          hash_start = text.index("    def __hash__(self) -> int:\n", rule_class)
          hash_end = text.index("\n    def __ne__(self, other: object) -> bool:\n", hash_start)
          cached_hash = dedent('''
                  def __hash__(self) -> int:
                      cached = self._base_hash
                      if cached is None:
                          cached = hash(
                              (
                                  type(self),
                                  self.cells,
                                  self._rows,
                                  self._cols,
                                  self._max_elem,
                                  self.len_cells,
                              )
                          )
                          object.__setattr__(self, "_base_hash", cached)
                      self.freeze()
                      return cached
          ''')
          text = text[:hash_start] + cached_hash + text[hash_end:]
          path.write_text(text, encoding="utf-8")

          # Guarantee relevance depends only on rule cells and the live guarantee
          # generation. The existing guarantee-only cache already has exactly that
          # lifecycle, so retain immutable tuples instead of rebuilding lists.
          path = Path("gridsolver/solver/propagation.py")
          text = path.read_text(encoding="utf-8")
          relevant = dedent('''
              def relevant_guarantees(grid: Grid, rule: Rule) -> Iterable[Guarantee]:
                  """Return the cached guarantee superset that may affect ``rule``."""
                  if not rule.uses_guarantees:
                      return _NO_GUARANTEES
                  index = grid.cached_guarantee_struct(
                      "gts_by_min_cell",
                      lambda: _build_guarantee_index(grid),
                  )
                  return grid.cached_guarantee_struct(
                      ("relevant_guarantees", rule.cells),
                      lambda: tuple(
                          guarantee
                          for cell in rule.cells
                          for guarantee in index.get(cell, ())
                      ),
                  )

          ''').lstrip()
          text = replace_between(
              text,
              "def relevant_guarantees(grid: Grid, rule: Rule) -> Iterable[Guarantee]:\n",
              "def update_known_from_candidates(\n",
              relevant,
          )
          path.write_text(text, encoding="utf-8")

          # Build the final merged Uneq relation once per origin rather than
          # constructing and then deactivating one temporary rule per house.
          path = Path("gridsolver/solver/rulehelpers.py")
          text = path.read_text(encoding="utf-8")
          helper = dedent('''
              def rulehelper_atmostonce(grid: Grid) -> None:
                  """Materialise one merged inequality relation per origin cell."""
                  desired: list[set[int]] = [set() for _ in range(grid.len)]
                  for cells in grid.unique_rule_cells:
                      if len(cells) <= 1:
                          continue
                      for cell in cells:
                          desired[cell].update(cells)
                          desired[cell].discard(cell)

                  existing_by_origin: dict[int, list[uneq.UneqRule]] = {}
                  for rule in grid.get_rules_of_type(uneq.UneqRule):
                      existing_by_origin.setdefault(rule.origin_cell, []).append(rule)

                  additions: list[uneq.UneqRule] = []
                  for origin, required in enumerate(desired):
                      existing = existing_by_origin.get(origin, [])
                      merged = set(required)
                      for rule in existing:
                          merged.update(rule.rel_cells)
                      if not merged:
                          continue

                      target = frozenset(merged)
                      keeper = next(
                          (rule for rule in existing if rule.rel_cells == target),
                          None,
                      )
                      for rule in existing:
                          if rule is not keeper:
                              grid.deactivate_rule(rule)
                      if keeper is None:
                          additions.append(uneq.UneqRule(grid, origin, target))

                  grid.add_rules_checked(additions)

          ''').lstrip()
          text = replace_between(
              text,
              "def rulehelper_atmostonce(grid: Grid) -> None:\n",
              "def rulehelper_house_sums(grid: Grid) -> None:\n",
              helper,
          )
          path.write_text(text, encoding="utf-8")

          # Avoid millions of singleton-set allocations and default set()
          # constructions in the AIC endpoint visibility test.
          path = Path("gridsolver/solver/solve_aic.py")
          text = path.read_text(encoding="utf-8")
          helpers = dedent('''
                  def _get_cells(node: Node) -> FrozenSet[int] | tuple[int]:
                      """Return an allocation-free group or a compact singleton tuple."""
                      cells, _ = node
                      if isinstance(cells, frozenset):
                          return cells
                      return (cells,)

                  def _cells_see_all(target_cell: int, node: Node) -> bool:
                      """Check whether ``target_cell`` sees every cell in ``node``."""
                      cells, _ = node
                      peers = cell_peers[target_cell]
                      if isinstance(cells, frozenset):
                          return cells <= peers
                      return cells in peers

          ''')
          text = replace_between(
              text,
              "    def _get_cells(node: Node) -> Set[int]:\n",
              "    # --- BFS for AICs ---\n",
              helpers,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Install and test candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_basic.py \
            tests/test_examples_2.py \
            -m "not slow" --durations=10

      - name: Compare baseline and candidate without depth gating
        shell: bash
        run: |
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/hot_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import logging
          import statistics
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          logging.disable(10_000)

          def factory(case):
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load("123456654321........................", row_wise=False)
                  return grid, 20, 20
              raise SystemExit(case)

          case = sys.argv[1]
          durations = []
          digest = None
          for _ in range(2):
              gc.collect()
              grid, max_sols, expected = factory(case)
              start = time.perf_counter()
              solutions = solver.solve(
                  grid,
                  log_level=0,
                  max_sols=max_sols,
                  depth_gate=None,
              )
              durations.append(time.perf_counter() - start)
              if len(solutions) != expected:
                  raise SystemExit(f"{case}: expected {expected}, got {len(solutions)}")
              payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
              current = hashlib.sha256(payload).hexdigest()
              if digest is None:
                  digest = current
              elif current != digest:
                  raise SystemExit(f"{case}: nondeterministic solution set")
          print(json.dumps({
              "case": case,
              "seconds": durations,
              "median": statistics.median(durations),
              "digest": digest,
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/hot_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
