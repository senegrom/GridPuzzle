name: Export PR source

on:
  push:
    branches:
      - agent/further-solver-improvements
    paths:
      - .github/workflows/export-pr5-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: gridpuzzle-pr5-source
          path: .
          include-hidden-files: true
          retention-days: 1
