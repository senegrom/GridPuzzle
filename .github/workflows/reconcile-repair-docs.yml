name: Reconcile reviewed harness repair documentation
on:
  push:
    branches: [fix/suite-context-failure]
    paths: [.github/workflows/reconcile-repair-docs.yml]
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'senegrom/GridPuzzle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Merge the reviewed repair and preserve both documentation changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          target='e9a9c208e7152ec822cce1a88cc8f7f89b63b26c'
          git merge --no-commit --no-ff "$target" || {
            test "$(git diff --name-only --diff-filter=U)" = 'web/TESTING.md' || exit 1
          }
          python - <<'PY'
          from pathlib import Path
          import subprocess
          target = 'e9a9c208e7152ec822cce1a88cc8f7f89b63b26c'
          ours = subprocess.check_output(['git', 'show', 'HEAD:web/TESTING.md'], text=True)
          theirs = subprocess.check_output(['git', 'show', target + ':web/TESTING.md'], text=True)
          def once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit('Documentation anchor changed; manual review required: ' + old)
              return text.replace(old, new, 1)
          ours = once(ours,
              '`harness_regressions.cjs` checks all this in real browsers, and\n',
              '`harness_regressions.cjs` checks all this in real browsers, except a call\ninterrupted by a lost browser (see its "lost" case below), and\n')
          ours = once(ours,
              'the close comes, as in the "lost" case. WebKit\'s child processes inherit the\n',
              'the close comes. WebKit\'s child processes inherit the\n')
          start = theirs.index('The "lost" case of `harness_regressions` found this hang,')
          end = theirs.index('The offline smoke suite asks `serve()`', start)
          block = theirs[start:end]
          ours = once(ours, 'A browser that is up but refuses a suite its context or page fails that engine\n',
              block + 'A browser that is up but refuses a suite its context or page fails that engine\n')
          Path('web/TESTING.md').write_text(ours)
          PY
          git add web/TESTING.md
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'Merge reviewed lost-browser repair and reconcile testing documentation'
      - name: Exercise the context-failure regressions
        run: node --test --test-timeout=60000 web/tests/harness-close.test.js web/tests/harness-watch.test.js
      - name: Publish only the reconciled repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='fix/suite-context-failure'
          test "$GITHUB_REPOSITORY" = 'senegrom/GridPuzzle'
          test "$GITHUB_REF_NAME" = "$branch"
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          test "$current" = "$EXPECTED_HEAD" || { echo 'Repair branch changed; refusing to publish.'; exit 1; }
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
