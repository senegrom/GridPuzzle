name: Temporary diagnostic hot-path candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnostic-hotpath-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-hotpath-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Make diagnostics opt-in
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          logger = Path("gridsolver/solver/logger.py")
          text = logger.read_text(encoding="utf-8")
          old = "from contextlib import contextmanager\n"
          new = "from contextlib import contextmanager\nfrom contextvars import ContextVar\n"
          if text.count(old) != 1:
              raise SystemExit("logger import marker changed")
          text = text.replace(old, new, 1)
          old = '''    def __init__(self, logger: logging.Logger, level: int) -> None:
        self.lg = logger
        self.set_lvl(level)
        self.grid_buf: str | None = None
        self.time_stats: dict[str, float] = {}
'''
          new = '''    def __init__(self, logger: logging.Logger, level: int) -> None:
        self.lg = logger
        self._timing_enabled: ContextVar[bool] = ContextVar(
            f"gridpuzzle_timing_{logger.name}",
            default=False,
        )
        self.set_lvl(level)
        self.grid_buf: str | None = None
        self.time_stats: dict[str, float] = {}

    def set_timing_enabled(self, enabled: bool) -> None:
        self._timing_enabled.set(bool(enabled))
'''
          if text.count(old) != 1:
              raise SystemExit("GridLogger initializer marker changed")
          text = text.replace(old, new, 1)
          old = '''    @contextmanager
    def time_ctxt(self, label: str):
        start = time.perf_counter()
        try:
            yield
        finally:
            delta = time.perf_counter() - start
            self.time_stats[label] = self.time_stats.get(label, 0.0) + delta
            if delta > TIME_DELTA_LOG_MIN:
                self.logd(f"{label} took {delta}s.")
'''
          new = '''    @contextmanager
    def time_ctxt(self, label: str):
        if not self._timing_enabled.get() and not self.on:
            yield
            return

        start = time.perf_counter()
        try:
            yield
        finally:
            delta = time.perf_counter() - start
            self.time_stats[label] = self.time_stats.get(label, 0.0) + delta
            if delta > TIME_DELTA_LOG_MIN:
                self.logd(f"{label} took {delta}s.")
'''
          if text.count(old) != 1:
              raise SystemExit("time_ctxt marker changed")
          logger.write_text(text.replace(old, new, 1), encoding="utf-8")

          atomic = Path("gridsolver/solver/atomic_solver.py")
          text = atomic.read_text(encoding="utf-8")
          old = "from collections.abc import Callable, Iterator\n"
          new = "from collections.abc import Callable, Iterator\nfrom contextvars import ContextVar\n"
          if text.count(old) != 1:
              raise SystemExit("atomic import marker changed")
          text = text.replace(old, new, 1)
          old = '''POWER_RULE_CHANGES: Counter[str] = Counter()



def reset_power_stats() -> None:
    POWER_TRIES.clear()
    POWER_HITS.clear()
    POWER_ELIMS.clear()
    POWER_RULE_CHANGES.clear()
    _lg.time_stats.clear()
'''
          new = '''POWER_RULE_CHANGES: Counter[str] = Counter()
_POWER_STATS_ENABLED: ContextVar[bool] = ContextVar(
    "gridpuzzle_power_stats_enabled",
    default=False,
)


def power_stats_enabled() -> bool:
    return _POWER_STATS_ENABLED.get()


def reset_power_stats() -> None:
    POWER_TRIES.clear()
    POWER_HITS.clear()
    POWER_ELIMS.clear()
    POWER_RULE_CHANGES.clear()
    _lg.time_stats.clear()
    _POWER_STATS_ENABLED.set(True)
    _lg.set_timing_enabled(True)


def disable_power_stats() -> None:
    _POWER_STATS_ENABLED.set(False)
    _lg.set_timing_enabled(False)
'''
          if text.count(old) != 1:
              raise SystemExit("stats block marker changed")
          text = text.replace(old, new, 1)
          old = '''        self.hidden_pair_checked_gts = hidden_pair_checked_gts
        self.depth_gate = depth_gate
'''
          new = '''        self.hidden_pair_checked_gts = hidden_pair_checked_gts
        self.depth_gate = depth_gate
        self.collect_stats = power_stats_enabled()
'''
          if text.count(old) != 1:
              raise SystemExit("AtomicSolver initializer marker changed")
          text = text.replace(old, new, 1)
          old = '''                for step_type in self._solve_power_actions():
                    POWER_TRIES[step_type] += 1
                    after_action = self._state_snapshot()
                    if after_action == after_basic:
                        continue

                    POWER_HITS[step_type] += 1
                    POWER_ELIMS[step_type] += max(0, after_basic[1] - after_action[1])
                    if after_basic[2:] != after_action[2:]:
                        POWER_RULE_CHANGES[step_type] += 1
'''
          new = '''                for step_type in self._solve_power_actions():
                    if self.collect_stats:
                        POWER_TRIES[step_type] += 1
                    after_action = self._state_snapshot()
                    if after_action == after_basic:
                        continue

                    if self.collect_stats:
                        POWER_HITS[step_type] += 1
                        POWER_ELIMS[step_type] += max(
                            0,
                            after_basic[1] - after_action[1],
                        )
                        if after_basic[2:] != after_action[2:]:
                            POWER_RULE_CHANGES[step_type] += 1
'''
          if text.count(old) != 1:
              raise SystemExit("power counter marker changed")
          text = text.replace(old, new, 1)
          old = '''                # The generator raises before the consumer sees a label, so a
                # contradiction must be counted here.
                POWER_TRIES[label] += 1
                POWER_HITS[label] += 1
                raise
'''
          new = '''                # The generator raises before the consumer sees a label, so a
                # contradiction must be counted here when diagnostics are active.
                if self.collect_stats:
                    POWER_TRIES[label] += 1
                    POWER_HITS[label] += 1
                raise
'''
          if text.count(old) != 1:
              raise SystemExit("contradiction counter marker changed")
          atomic.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install and test diagnostic behavior
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_regressions.py \
            tests/test_trail.py \
            tests/test_solver_api.py \
            tests/test_examples_2.py \
            -m "not slow" --durations=10
          python - <<'PY'
          from contextvars import Context

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import atomic_solver, solver
          from gridsolver.solver.solver_log import lg

          assert not atomic_solver.power_stats_enabled()
          assert Context().run(atomic_solver.power_stats_enabled) is False

          atomic_solver.reset_power_stats()
          solver.solve(Sudoku(2, 2, 2, 2), log_level=0, max_sols=1)
          assert atomic_solver.POWER_TRIES
          assert lg.time_stats
          tries = atomic_solver.POWER_TRIES.copy()
          timings = lg.time_stats.copy()

          atomic_solver.disable_power_stats()
          solver.solve(Sudoku(2, 2, 2, 2), log_level=0, max_sols=1)
          assert atomic_solver.POWER_TRIES == tries
          assert lg.time_stats == timings
          PY

      - name: Compare baseline and opt-in diagnostics candidate
        shell: bash
        run: |
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/hot_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import logging
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          logging.disable(10_000)

          case = sys.argv[1]
          if case == "blank4_all":
              grid = Sudoku(2, 2, 2, 2)
              max_sols, expected = -1, 288
          elif case == "nonsquare6_cap20":
              grid = Sudoku(3, 2, 2, 3)
              grid.load("123456654321........................", row_wise=False)
              max_sols, expected = 20, 20
          else:
              raise SystemExit(case)

          gc.collect()
          started = time.perf_counter()
          solutions = solver.solve(
              grid,
              log_level=0,
              max_sols=max_sols,
              depth_gate=None,
          )
          seconds = time.perf_counter() - started
          if len(solutions) != expected:
              raise SystemExit(f"{case}: expected {expected}, got {len(solutions)}")
          payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
          print(json.dumps({
              "case": case,
              "seconds": seconds,
              "digest": hashlib.sha256(payload).hexdigest(),
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/hot_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
