name: Apply verified review repairs
on:
  push:
    branches: [fix/review-and-live-acquisition-20260922]
    paths: [.github/workflows/apply-review-repairs.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/review-and-live-acquisition-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Verify and apply exact local source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          cat scripts/review-repair.patch.gz.b64.part1 scripts/review-repair.patch.gz.b64.part2 | base64 --decode | gzip -dc > "$RUNNER_TEMP/repairs.patch"
          echo 'ad3529604ccd0fed61973e9374fe5b57b9a38ef35fa68835a49906d912f2b2ef  '"$RUNNER_TEMP/repairs.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/repairs.patch"
          git apply "$RUNNER_TEMP/repairs.patch"
      - name: Unit tests, syntax and whitespace
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 web/tests/*.test.js | tee repair-evidence/unit-tests.log
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --check scripts/live_noise_regressions.cjs
          node --check scripts/editor_reread_regressions.cjs
          git diff --check
      - name: Remove transport and push only the verified branch tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/review-and-live-acquisition-20260922
          git rm .github/workflows/apply-review-repairs.yml scripts/review-repair.patch.gz.b64.part1 scripts/review-repair.patch.gz.b64.part2
          git add web scripts/editor_reread_regressions.cjs scripts/live_noise_regressions.cjs .github/workflows/browser-pages.yml .github/workflows/scan-input.yml .github/workflows/review-source-snapshot.yml
          git write-tree | tee repair-evidence/tree.txt
          test "$(cat repair-evidence/tree.txt)" = 10f0ea2c67a6cc92aff9a2784c154873220c11f6
          git config user.name senegrom
          git config user.email '6349874+senegrom@users.noreply.github.com'
          git commit -m 'Fix review-state round trips, sequential clue review, capture diagnostics and noisy live acquisition' -m 'Keep warning notes consistent across scan acceptance, autosave and backups. Keep Save & next in one native modal; retire only the right OCR proposal. Clear past worker failures at the supported successful delayed-frame cadence. Hand diagnostic source ownership to the captured photo with fresh image consent. Scale the raw noise floor with contrast-normalized content samples, add bounded alignment rejection reasons, and keep all changed-digit/structure/occlusion guards. Add 31 regressions plus native editor and genuine noisy-video acceptance. Exact local and hosted unit-validated tree: 10f0ea2c67a6cc92aff9a2784c154873220c11f6. No user image or diagnostic is published; no master update or deployment.'
          git rev-parse HEAD > repair-evidence/commit.txt
          git push origin HEAD:refs/heads/fix/review-and-live-acquisition-20260922
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: review-repair-apply-evidence
          path: repair-evidence
          retention-days: 2
