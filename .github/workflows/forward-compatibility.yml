name: Forward compatibility

on:
  # Every pull request, so that "Forward compatibility result" always
  # reports; the changes job decides whether the suites run.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: forward-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: "error::DeprecationWarning,error::PendingDeprecationWarning,error::ResourceWarning,error::SyntaxWarning"

jobs:
  changes:
    name: Changes that need forward compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # The weekly and manual runs always run the suites.
      relevant: ${{ github.event_name != 'pull_request' || steps.diff.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            .github/workflows/forward-compatibility.yml
            gridsolver/**
            tests/**
            pyproject.toml
            run.py
            examples2.py

  compatibility:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Python 3.14 free-threaded
            python-version: "3.14"
            freethreaded: true
            allow-prereleases: false
          - label: Python 3.15 prerelease
            python-version: "3.15"
            freethreaded: false
            allow-prereleases: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded }}
          allow-prereleases: ${{ matrix.allow-prereleases }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and validate the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help

      - name: Compile Python sources with warnings as errors
        run: python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Run the portable compatibility surface
        run: >-
          python -X dev -m pytest -q
          tests/test_cli_and_loading.py
          tests/test_thread_executor.py
          tests/test_parser_fuzzing.py
          tests/test_candidate_domain.py
          tests/test_candidate_view.py
          tests/test_compact_api_hardening.py
          tests/test_partition_cache.py
          tests/test_rule_inputs.py
          tests/test_solution_validation.py
          tests/test_path_guarantees.py
          tests/test_new_puzzle_families.py
          tests/test_trail.py
          tests/test_differential.py
          tests/test_handler_aware_logging.py
          -m "not slow"
          --durations=10

  # The check to require. A matrix job skipped before it expands never
  # reports its entries' names, and a failed changes job would skip it. This
  # job always runs and accounts for both.
  result:
    name: Forward compatibility result
    if: always()
    needs: [changes, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job the changes call for
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULTS: ${{ needs.compatibility.result }}
        run: |
          echo "changes: $CHANGES, relevant: $RELEVANT, jobs: $RESULTS"
          [ "$CHANGES" = success ]
          expected=skipped; if [ "$RELEVANT" = true ]; then expected=success; fi
          for result in $RESULTS; do [ "$result" = "$expected" ]; done
