name: Forward compatibility

on:
  # Every pull request, so that "Forward compatibility result" always
  # reports; the changes job decides whether the suites run.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: forward-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"
  # Warnings are errors. Two filters come after the categories: an import
  # that re-enables the GIL on the free-threaded build fails too, where
  # Python only warns; and Python 3.15's linecache warning that module
  # globals lack __spec__.loader is ignored. Python itself creates such
  # globals for the __mp_main__ module of a spawned worker, so formatting a
  # traceback through a worker function defined in a script's __main__
  # killed the worker and turned the two process-failure probes'
  # deliberate errors into BrokenProcessPool.
  PYTHONWARNINGS: "error::DeprecationWarning,error::PendingDeprecationWarning,error::ResourceWarning,error::SyntaxWarning,error:The global interpreter lock (GIL) has been enabled:RuntimeWarning,ignore:Module globals is missing a __spec__.loader:DeprecationWarning"

jobs:
  changes:
    name: Changes that need forward compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # The weekly and manual runs always run the suites.
      relevant: ${{ github.event_name != 'pull_request' || steps.diff.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/changed-paths
        with:
          # the Python the bounded suite runs, with the data it reads
          paths: |
            **/*.py
            gridsolver/**
            tests/**
            Examples/**
            pyproject.toml
            .github/workflows/forward-compatibility.yml

  compatibility:
    name: ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Python 3.14 free-threaded
            python-version: "3.14"
            freethreaded: true
            allow-prereleases: false
          - label: Python 3.15 prerelease
            python-version: "3.15"
            freethreaded: false
            allow-prereleases: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded }}
          allow-prereleases: ${{ matrix.allow-prereleases }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and validate the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help

      # setup-python's freethreaded input must really have produced a build
      # without the GIL, and importing the package and what the tests use
      # must not have turned it back on.
      - name: Require the GIL to be disabled
        if: matrix.freethreaded
        run: >-
          python -c "import sys, sysconfig, colorama, gridsolver.solver.solver, pytest, rich;
          sys.exit(0 if sysconfig.get_config_var('Py_GIL_DISABLED') and not sys._is_gil_enabled()
          else f'the GIL is enabled: {sys.version}')"

      - name: Compile Python sources with warnings as errors
        run: python -m compileall -q gridsolver tests scripts Examples run.py

      - name: Discover and run every bounded test
        run: >-
          python -X dev -m pytest -q
          tests
          -m "not slow"
          --durations=10

  # The check to require. A matrix job skipped before it expands never
  # reports its entries' names, and a failed changes job would skip it. This
  # job always runs and accounts for both.
  result:
    name: Forward compatibility result
    if: always()
    needs: [changes, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job the changes call for
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULTS: ${{ needs.compatibility.result }}
        run: |
          echo "changes: $CHANGES, relevant: $RELEVANT, jobs: $RESULTS"
          [ "$CHANGES" = success ]
          expected=skipped; if [ "$RELEVANT" = true ]; then expected=success; fi
          for result in $RESULTS; do [ "$result" = "$expected" ]; done
