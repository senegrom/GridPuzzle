name: Temporary bounded parallel submission candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/bounded-submission-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounded-submission-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply bounded outstanding-future candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("gridsolver/solver/solve_parallel.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import concurrent.futures\n",
              "import concurrent.futures\nfrom collections import deque\n",
              1,
          )
          start_marker = (
              "    with concurrent.futures.ProcessPoolExecutor("
              "max_workers=processes) as pool:\n"
          )
          end_marker = "\n    return _cap_solutions(solutions, max_sols)\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = dedent('''
              with concurrent.futures.ProcessPoolExecutor(max_workers=processes) as pool:
                  initial_count = min(processes, len(ordered_branches))
                  futures = deque(
                      pool.submit(
                          worker,
                          (grid, cell, value, max_sols, depth_gate),
                      )
                      for cell, value in ordered_branches[:initial_count]
                  )
                  next_branch_index = initial_count

                  while futures:
                      future = futures.popleft()
                      result = future.result()
                      if stats is None:
                          branch_solutions = result
                      else:
                          branch_solutions, branch_stats = result
                          stats.merge(branch_stats)
                      solutions.update(branch_solutions)

                      if 0 < max_sols <= len(solutions):
                          for pending in futures:
                              pending.cancel()
                          if futures:
                              pool.terminate_workers()
                          break

                      if next_branch_index < len(ordered_branches):
                          cell, value = ordered_branches[next_branch_index]
                          next_branch_index += 1
                          futures.append(
                              pool.submit(
                                  worker,
                                  (grid, cell, value, max_sols, depth_gate),
                              )
                          )
          ''').lstrip()
          replacement = "".join(
              f"    {line}\n" if line else "\n"
              for line in replacement.splitlines()
          ).rstrip() + "\n"
          path.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
          )
          PY

      - name: Install and run focused correctness checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests .github/scripts
          python .github/scripts/bounded_submission_harness.py --unit
          python -X dev -m pytest -q \
            tests/test_solver_api.py \
            tests/test_hardening.py::test_capped_solution_subset_is_deterministic_across_process_modes \
            tests/test_regressions.py::test_parallel_trials_work_with_python_314_start_methods \
            tests/test_runtime_overhead.py::test_parallel_workers_return_and_merge_power_statistics \
            --durations=10

      - name: Compare bounded submission timings
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^

          run_case() {
            local directory="$1"
            local case="$2"
            local repeats="$3"
            (cd "$directory" && PYTHONPATH="$directory" python \
              "$GITHUB_WORKSPACE/.github/scripts/bounded_submission_harness.py" \
              --case "$case" --repeats "$repeats")
          }

          for specification in fanout100:5 fanout1000:3 blank4_cap1:2; do
            case="${specification%%:*}"
            repeats="${specification##*:}"
            baseline="$(run_case /tmp/baseline "$case" "$repeats")"
            candidate="$(run_case "$GITHUB_WORKSPACE" "$case" "$repeats")"
            echo "BASELINE ${baseline}"
            echo "CANDIDATE ${candidate}"
            BASELINE="$baseline" CANDIDATE="$candidate" python - <<'PY'
          import json
          import os

          baseline = json.loads(os.environ["BASELINE"])
          candidate = json.loads(os.environ["CANDIDATE"])
          if baseline["digest"] != candidate["digest"]:
              raise SystemExit("baseline and candidate solution hashes differ")
          change = 100 * (candidate["median"] / baseline["median"] - 1)
          print(f"CHANGE {baseline['case']}: {change:+.2f}%")
          PY
          done
