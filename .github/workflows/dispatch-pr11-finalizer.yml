name: Dispatch corrected PR 11 finalizer

on:
  push:
    branches:
      - agent/correctness-debloat-review-2026-08-12
    paths:
      - .github/workflows/dispatch-pr11-finalizer.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start the full Python 3.14 finalization gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/finalize-pr11.yml/dispatches" \
            --data '{"ref":"agent/correctness-debloat-review-2026-08-12"}'
