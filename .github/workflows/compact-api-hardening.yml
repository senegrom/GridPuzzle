name: Compact-grid API hardening

on:
  push:
    branches:
      - agent/further-solver-improvements
    paths:
      - .github/scripts/apply_compact_api_hardening.py
      - .github/workflows/compact-api-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compact-api-hardening
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply compact-grid API hardening
        run: python .github/scripts/apply_compact_api_hardening.py

      - name: Install and run bounded CI-equivalent suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_candidate_domain.py \
            tests/test_compact_api_hardening.py \
            tests/test_candidate_mask_index.py \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_iterable_loading.py \
            tests/test_parser_fuzzing.py \
            tests/test_new_puzzle_families.py \
            tests/test_new_family_corpus_runner.py \
            tests/test_depth_gate.py \
            tests/test_action_dispatch.py \
            tests/test_rule_hash_cache.py \
            tests/test_rule_only_cache.py \
            tests/test_topology_cache_lifecycle.py \
            tests/test_atmostonce_memo.py \
            tests/test_aic_extra_visibility.py \
            tests/test_extension_validation.py \
            tests/test_hotpath_regressions.py \
            tests/test_runtime_overhead.py \
            tests/test_handler_aware_logging.py \
            tests/test_guarantee_filter_cache.py \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_basic.py \
            tests/test_scale.py \
            tests/test_examples_2.py \
            -m "not slow" \
            --durations=20
          python -X dev -m pytest -q tests/test_rule_metadata.py

      - name: Commit tested source and remove promotion scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/apply_compact_api_hardening.py \
            .github/workflows/compact-api-hardening.yml
          git add -A -- \
            .github/scripts/apply_compact_api_hardening.py \
            .github/workflows/compact-api-hardening.yml \
            .github/workflows/ci.yml \
            gridsolver/abstract_grids/grid_loading.py \
            gridsolver/grid_classes/compact_grid.py \
            gridsolver/grid_classes/path_puzzles.py \
            gridsolver/grid_classes/slitherlink.py \
            tests/test_compact_api_hardening.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden compact-grid input boundaries"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
