name: Benchmark main correctness audit

on:
  push:
    branches:
      - agent/main-bug-debloat-audit-2026-08-14
    paths:
      - .github/workflows/benchmark-main-audit.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compare candidate with master
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/gridpuzzle-master origin/master
          cat > /tmp/measure_case.py <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import sys
          import time
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          case = sys.argv[2]
          sys.path.insert(0, str(root))

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          solver.set_loglevel(-1)
          if case == "blank4_cap1":
              grid = Sudoku(4)
              cap = 1
          elif case == "blank4_all":
              grid = Sudoku(4)
              cap = -1
          elif case == "example9_first":
              from Examples.exampleSudoku import g
              grid = g
              cap = 1
          else:
              raise SystemExit(f"unknown case {case}")

          started = time.perf_counter()
          solutions = solver.solve(grid, max_sols=cap, log_level=-1)
          elapsed = time.perf_counter() - started
          payload = sorted(tuple(solution) for solution in solutions)
          digest = hashlib.sha256(repr(payload).encode()).hexdigest()
          print(json.dumps({"seconds": elapsed, "count": len(payload), "digest": digest}))
          PY

          cat > /tmp/compare_perf.py <<'PY'
          from __future__ import annotations
          import json
          import math
          import statistics
          import subprocess
          from pathlib import Path

          candidate = Path.cwd()
          baseline = Path("/tmp/gridpuzzle-master")
          cases = {
              "example9_first": 5,
              "blank4_cap1": 3,
              "blank4_all": 2,
          }
          records = {}
          for case, repeats in cases.items():
              values = {"master": [], "candidate": []}
              fingerprints = set()
              for repeat in range(repeats):
                  order = (("master", baseline), ("candidate", candidate))
                  if repeat % 2:
                      order = tuple(reversed(order))
                  for label, root in order:
                      completed = subprocess.run(
                          ["python", "/tmp/measure_case.py", str(root), case],
                          cwd=root,
                          check=True,
                          text=True,
                          capture_output=True,
                      )
                      result = json.loads(completed.stdout.strip().splitlines()[-1])
                      values[label].append(result["seconds"])
                      fingerprints.add((result["count"], result["digest"]))
              if len(fingerprints) != 1:
                  raise SystemExit(f"solution mismatch for {case}: {fingerprints}")
              master = statistics.median(values["master"])
              candidate_time = statistics.median(values["candidate"])
              records[case] = {
                  "master_seconds": values["master"],
                  "candidate_seconds": values["candidate"],
                  "master_median": master,
                  "candidate_median": candidate_time,
                  "ratio": candidate_time / master,
                  "fingerprint": next(iter(fingerprints)),
              }
          ratios = [record["ratio"] for record in records.values()]
          geomean = math.exp(sum(math.log(ratio) for ratio in ratios) / len(ratios))
          worst = max(ratios)
          output = {
              "cases": records,
              "gates": {
                  "geomean_ratio": geomean,
                  "geomean_max": 1.02,
                  "worst_ratio": worst,
                  "worst_max": 1.05,
                  "passed": geomean <= 1.02 and worst <= 1.05,
              },
          }
          Path("audit-performance.json").write_text(json.dumps(output, indent=2))
          print(json.dumps(output, indent=2))
          if not output["gates"]["passed"]:
              raise SystemExit("performance gate failed")
          PY
          python /tmp/compare_perf.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: main-audit-performance
          path: audit-performance.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/benchmark-main-audit.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-use audit performance workflow"
          git push origin "HEAD:$GITHUB_REF_NAME"
