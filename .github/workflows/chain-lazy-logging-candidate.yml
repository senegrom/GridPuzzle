name: Temporary lazy chain logging candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/chain-lazy-logging-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chain-lazy-logging-candidate
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-benchmark-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply lazy logging candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('gridsolver/solver/solve_chain.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected one marker, got {count}: {old[:100]!r}'
                  )
              text = text.replace(old, new, 1)

          replace_once(
              '    cs = CoordToString(grid.rows)\n\n'
              '    c2_dic: Dict[FrozenSet[int], Set[int]]',
              '    log_enabled = _lg.on\n'
              '    cs = CoordToString(grid.rows) if log_enabled else None\n\n'
              '    c2_dic: Dict[FrozenSet[int], Set[int]]',
          )
          replace_once(
              '''                    if le == cell and val in cands[cell]:
                          chain = _compute_chain(le, weak_dic, strg_dic, True)
                          _lg.on and _lg.logr(f"LoopW",
                                   f"{val} removed from {set(key)} w/ loop {cs(chain)} ", cs(cell))
                          cands[cell].discard(val)
                      joint_nb = wl[cell] & wl[le]
                      for nb in joint_nb:
                          if other_val in cands[nb]:
                              chain = _compute_chain(le, weak_dic, strg_dic, True)
                              _lg.on and _lg.logr(f"WingW",
                                       f"{other_val} removed from {set(key)} w/ wing {cs(chain)}", cs(nb))
                              cands[nb].remove(other_val)
              ''',
              '''                    if le == cell and val in cands[cell]:
                          if log_enabled:
                              chain = _compute_chain(le, weak_dic, strg_dic, True)
                              _lg.logr(
                                  "LoopW",
                                  f"{val} removed from {set(key)} "
                                  f"w/ loop {cs(chain)} ",
                                  cs(cell),
                              )
                          cands[cell].discard(val)
                      joint_nb = wl[cell] & wl[le]
                      for nb in joint_nb:
                          if other_val in cands[nb]:
                              if log_enabled:
                                  chain = _compute_chain(
                                      le, weak_dic, strg_dic, True
                                  )
                                  _lg.logr(
                                      "WingW",
                                      f"{other_val} removed from {set(key)} "
                                      f"w/ wing {cs(chain)}",
                                      cs(nb),
                                  )
                              cands[nb].remove(other_val)
              ''',
          )
          replace_once(
              '    cs = CoordToString(grid.rows)\n\n'
              '    sl = grid.semi_strong_links\n',
              '    log_enabled = _lg.on\n'
              '    cs = CoordToString(grid.rows) if log_enabled else None\n\n'
              '    sl = grid.semi_strong_links\n',
          )
          replace_once(
              '''                if le == cell:
                      chain = _compute_chain(le, weak_dic, strg_dic, False)
                      _lg.on and _lg.logr(f"LoopX",
                               f"all but {val} removed from {set(cd)} w/ loop {cs(chain)}", cs(cell))
                      cd.intersection_update((val,))
                  joint_nb = wl[cell] & wl[le]
                  for nb in joint_nb:
                      if val in cands[nb]:
                          chain = _compute_chain(le, weak_dic, strg_dic, False)
                          _lg.on and _lg.logr(f"ChainX",
                                   f"{val} removed from {set(cands[nb])} w/ chain {cs(chain)}", cs(nb))
                          cands[nb].remove(val)
              ''',
              '''                if le == cell:
                      if log_enabled:
                          chain = _compute_chain(le, weak_dic, strg_dic, False)
                          _lg.logr(
                              "LoopX",
                              f"all but {val} removed from {set(cd)} "
                              f"w/ loop {cs(chain)}",
                              cs(cell),
                          )
                      cd.intersection_update((val,))
                  joint_nb = wl[cell] & wl[le]
                  for nb in joint_nb:
                      if val in cands[nb]:
                          if log_enabled:
                              chain = _compute_chain(
                                  le, weak_dic, strg_dic, False
                              )
                              _lg.logr(
                                  "ChainX",
                                  f"{val} removed from {set(cands[nb])} "
                                  f"w/ chain {cs(chain)}",
                                  cs(nb),
                              )
                          cands[nb].remove(val)
              ''',
          )
          replace_once(
              '    cs = CoordToString(grid.rows)\n\n'
              '    sl = grid.semi_strong_links_all\n',
              '    log_enabled = _lg.on\n'
              '    cs = CoordToString(grid.rows) if log_enabled else None\n\n'
              '    sl = grid.semi_strong_links_all\n',
          )
          replace_once(
              '''                if le == start_cell:
                      _lg.on and _lg.logr(f"LoopXY",
                               f"all but {val} removed from {set(cd)} w/ loop {cs(start_cell)}", cs(start_cell))
                      cd.intersection_update((val,))
                  joint_nb = wl[start_cell] & wl[le]
                  for nb in joint_nb:
                      if val in cands[nb]:
                          _lg.on and _lg.logr(f"ChainXY",
                                   f"{val} removed from {cands[nb]} w/ chain {cs(start_cell)}..{cs(le)}", cs(nb))
                          cands[nb].remove(val)
              ''',
              '''                if le == start_cell:
                      if log_enabled:
                          _lg.logr(
                              "LoopXY",
                              f"all but {val} removed from {set(cd)} "
                              f"w/ loop {cs(start_cell)}",
                              cs(start_cell),
                          )
                      cd.intersection_update((val,))
                  joint_nb = wl[start_cell] & wl[le]
                  for nb in joint_nb:
                      if val in cands[nb]:
                          if log_enabled:
                              _lg.logr(
                                  "ChainXY",
                                  f"{val} removed from {cands[nb]} "
                                  f"w/ chain {cs(start_cell)}..{cs(le)}",
                                  cs(nb),
                              )
                          cands[nb].remove(val)
              ''',
          )
          path.write_text(text, encoding='utf-8')

          Path('tests/test_chain_logging_overhead.py').write_text(
              '''import ast
from pathlib import Path


def test_chain_reconstruction_is_guarded_by_visible_logging():
    path = (
        Path(__file__).resolve().parents[1]
        / "gridsolver/solver/solve_chain.py"
    )
    tree = ast.parse(path.read_text(encoding="utf-8"))
    parents: dict[ast.AST, ast.AST] = {}
    for parent in ast.walk(tree):
        for child in ast.iter_child_nodes(parent):
            parents[child] = parent

    calls = [
        node
        for node in ast.walk(tree)
        if isinstance(node, ast.Call)
        and isinstance(node.func, ast.Name)
        and node.func.id == "_compute_chain"
    ]
    assert calls
    for call in calls:
        node: ast.AST | None = call
        guarded = False
        while node is not None and not isinstance(node, ast.FunctionDef):
            node = parents.get(node)
            if (
                isinstance(node, ast.If)
                and isinstance(node.test, ast.Name)
                and node.test.id == "log_enabled"
            ):
                guarded = True
                break
        assert guarded, f"unguarded chain reconstruction at line {call.lineno}"
''',
              encoding='utf-8',
          )
          PY

      - name: Install and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_chain_logging_overhead.py \
            tests/test_differential.py \
            tests/test_technique_soundness.py \
            tests/test_hotpath_regressions.py \
            tests/test_regressions.py \
            tests/test_hardening.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=15

      - name: Benchmark current master against candidate
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/chain-baseline HEAD^
          cat > /tmp/chain-benchmark.py <<'PY'
          import json
          import math
          import os
          import statistics
          import subprocess
          import sys
          import time
          from pathlib import Path

          cases = {
              "sudo1": ("tests/test_basic.py::test_sudo1", 2),
              "nonsquare": ("tests/test_basic.py::test_sudo_nonsq", 2),
              "sudo2": ("tests/test_basic.py::test_sudo2", 4),
          }
          roots = {
              "baseline": Path("/tmp/chain-baseline"),
              "candidate": Path(os.environ["GITHUB_WORKSPACE"]),
          }
          results = {label: {case: [] for case in cases} for label in roots}

          for case, (node, repeats) in cases.items():
              for repeat in range(repeats):
                  order = (
                      ("baseline", "candidate")
                      if repeat % 2 == 0
                      else ("candidate", "baseline")
                  )
                  for label in order:
                      root = roots[label]
                      env = os.environ.copy()
                      env["PYTHONPATH"] = str(root)
                      env["PYTHONHASHSEED"] = "0"
                      started = time.perf_counter()
                      completed = subprocess.run(
                          [
                              sys.executable,
                              "-m",
                              "pytest",
                              "-q",
                              node,
                              "--disable-warnings",
                          ],
                          cwd=root,
                          env=env,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          text=True,
                          timeout=300,
                      )
                      elapsed = time.perf_counter() - started
                      if completed.returncode:
                          print(completed.stdout)
                          raise SystemExit(f"{label} {case} failed")
                      results[label][case].append(elapsed)

          summary = {}
          ratios = []
          for case in cases:
              baseline = statistics.median(results["baseline"][case])
              candidate = statistics.median(results["candidate"][case])
              ratio = candidate / baseline
              ratios.append(ratio)
              summary[case] = {
                  "baseline_seconds": results["baseline"][case],
                  "candidate_seconds": results["candidate"][case],
                  "baseline_median": baseline,
                  "candidate_median": candidate,
                  "change_percent": 100 * (ratio - 1),
              }

          geomean = math.prod(ratios) ** (1 / len(ratios))
          promote = (
              geomean <= 0.9975
              and max(ratios) <= 1.03
              and min(ratios) <= 0.99
          )
          payload = {
              "summary": summary,
              "geomean_change_percent": 100 * (geomean - 1),
              "promote": promote,
          }
          Path("/tmp/chain-result.json").write_text(
              json.dumps(payload, indent=2), encoding="utf-8"
          )
          if promote:
              Path("/tmp/chain-promote").touch()
          print(json.dumps(payload, indent=2))
          PY
          python /tmp/chain-benchmark.py

      - name: Promote or reject and remove experiment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/chain-promote ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/chain-result.json').read_text())
          lines = [
              '# Lazy chain logging benchmark — 2026-08-09',
              '',
              'The full ungated solver was compared with identical pytest '
              'correctness checks and alternating baseline/candidate runs.',
              '',
              f"Geometric-mean change: {result['geomean_change_percent']:.2f}%.",
              '',
              '| Case | Baseline median | Candidate median | Change |',
              '|---|---:|---:|---:|',
          ]
          for name, values in result['summary'].items():
              lines.append(
                  f"| {name} | {values['baseline_median']:.3f}s | "
                  f"{values['candidate_median']:.3f}s | "
                  f"{values['change_percent']:+.2f}% |"
              )
          lines.extend([
              '',
              'The change only defers diagnostic chain reconstruction and '
              'coordinate formatting when no logger can emit those details. '
              'Deduction order and candidate operations are unchanged.',
          ])
          Path('benchmarks/chain_lazy_logging_2026-08-09.md').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY
            git add \
              gridsolver/solver/solve_chain.py \
              tests/test_chain_logging_overhead.py \
              benchmarks/chain_lazy_logging_2026-08-09.md
            message="Avoid silent chain diagnostic work"
          else
            git checkout -- gridsolver/solver/solve_chain.py
            rm -f tests/test_chain_logging_overhead.py
            message="Reject lazy chain logging benchmark"
          fi

          rm -f .github/workflows/chain-lazy-logging-candidate.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git pull --rebase origin master
          git push origin HEAD:master
