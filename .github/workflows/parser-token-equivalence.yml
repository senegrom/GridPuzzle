name: Temporary parser token equivalence

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/apply_parser_token_equivalence.py
      - .github/workflows/parser-token-equivalence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parser-token-equivalence
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply token-equivalence fix
        run: python .github/scripts/apply_parser_token_equivalence.py

      - name: Install and validate parser routes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_iterable_loading.py \
            tests/test_cli_and_loading.py \
            tests/test_regressions.py \
            tests/test_basic.py \
            -m "not slow" \
            --durations=10

      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm \
            .github/scripts/apply_parser_token_equivalence.py \
            .github/workflows/parser-token-equivalence.yml
          git add \
            gridsolver/abstract_grids/grid.py \
            tests/test_iterable_loading.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unify blank tokens across parser routes"
          git push origin HEAD:master
