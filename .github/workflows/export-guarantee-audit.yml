name: Export latest guarantee audit source

on:
  push:
    branches:
      - agent/further-solver-improvements
    paths:
      - .github/workflows/export-guarantee-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gridpuzzle-guarantee-audit-source
          path: .
          include-hidden-files: true
          retention-days: 1
