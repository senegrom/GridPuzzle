name: Reuse sibling guarantee snapshot

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/resume-trail-migration.yml

permissions:
  contents: write

concurrency:
  group: sibling-guarantee-snapshot
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Hoist immutable parent guarantee snapshot out of sibling loop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("gridsolver/solver/solver.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        trials = sorted(guarantee.cells) if use_guarantee else values\n"
              "        solutions: set[ImmutableGrid] = set()\n\n"
              "        for trial in trials:\n"
          )
          new = (
              "        trials = sorted(guarantee.cells) if use_guarantee else values\n"
              "        solutions: set[ImmutableGrid] = set()\n"
              "        # AtomicSolver only reads the incoming snapshot and replaces its\n"
              "        # own reference after a full hidden-tuple pass. All sibling branches\n"
              "        # therefore share this one immutable-by-convention parent snapshot.\n"
              "        checked_guarantees = set(grid.guarantees)\n\n"
              "        for trial in trials:\n"
          )
          if old not in text:
              raise SystemExit("Recursive branch-loop marker was not found")
          text = text.replace(old, new, 1)

          old = (
              "            mark = grid.trail_mark()\n"
              "            checked_guarantees = set(grid.guarantees)\n"
              "            try:\n"
          )
          new = (
              "            mark = grid.trail_mark()\n"
              "            try:\n"
          )
          if old not in text:
              raise SystemExit("Per-branch guarantee snapshot marker was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install and validate sibling snapshot reuse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential"

      - name: Commit sibling snapshot reuse to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add gridsolver/solver/solver.py
          git diff --cached --check
          git commit -m "Reuse guarantee snapshot across sibling branches"
          git push origin HEAD:master
