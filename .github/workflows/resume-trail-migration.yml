name: Benchmark trail engine

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/resume-trail-migration.yml

permissions:
  contents: read

concurrency:
  group: trail-engine-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compare pre-trail baseline with current engine
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/pre-trail 01aac27c2b3648c8455f6351eed9176436521e54

          cat > /tmp/trail_benchmark.py <<'PY'
          import gc
          import json
          import logging
          import resource
          import statistics
          import sys
          import time

          from gridsolver.abstract_grids.grid_loading import create_from_str_and_class
          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver


          logging.disable(10_000)


          def make_blank4():
              return Sudoku(2, 2, 2, 2), -1, 288


          def make_nonsquare6():
              grid = Sudoku(3, 2, 2, 3)
              grid.load(
                  "123456654321........................",
                  row_wise=False,
              )
              return grid, 20, 20


          def make_hard9():
              grid = create_from_str_and_class(
                  "...13.....1...45....2....6.1..3...7.2...5...8.4...6..9.5....7....67...9.....89...",
                  Sudoku,
              )
              return grid, -1, 1


          CASES = {
              "blank4_all": (make_blank4, 1),
              "nonsquare6_cap20": (make_nonsquare6, 1),
              "hard9_single": (make_hard9, 5),
          }


          def main() -> None:
              case = sys.argv[1]
              factory, repetitions = CASES[case]
              durations = []
              counts = []
              for _ in range(repetitions):
                  grid, max_sols, expected = factory()
                  gc.collect()
                  started = time.perf_counter()
                  solutions = solver.solve(
                      grid,
                      max_sols=max_sols,
                      processes=0,
                  )
                  durations.append(time.perf_counter() - started)
                  counts.append(len(solutions))
                  if len(solutions) != expected:
                      raise SystemExit(
                          f"{case}: expected {expected} solutions, got {len(solutions)}"
                      )

              print(
                  json.dumps(
                      {
                          "case": case,
                          "repetitions": repetitions,
                          "seconds": durations,
                          "median_seconds": statistics.median(durations),
                          "solution_counts": counts,
                          "max_rss_kib": resource.getrusage(
                              resource.RUSAGE_SELF
                          ).ru_maxrss,
                      },
                      sort_keys=True,
                  )
              )


          if __name__ == "__main__":
              main()
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCHMARK ${label} ${case}"
            (
              cd "${directory}"
              PYTHONHASHSEED=0 PYTHONPATH="${directory}" \
                python /tmp/trail_benchmark.py "${case}"
            )
          }

          for case in hard9_single blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/pre-trail "${case}"
            run_case current "$GITHUB_WORKSPACE" "${case}"
          done
