name: Resume trail rollback migration

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/resume-trail-migration.yml

permissions:
  contents: write

concurrency:
  group: resume-trail-rollback-migration
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the validated source migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/trail-phase1.yml").read_text(
              encoding="utf-8"
          ).splitlines()
          start_marker = "          python - <<'PY'"
          end_marker = "          PY"
          start = workflow.index(start_marker) + 1
          end = workflow.index(end_marker, start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          Path("/tmp/apply_trail_phase1.py").write_text(script, encoding="utf-8")
          PY
          python /tmp/apply_trail_phase1.py

          # Workflow files must be updated through the connector, because the
          # Actions token is deliberately denied workflow-write permission.
          git checkout -- .github/workflows/ci.yml

          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_solution_validation.py")
          text = test_path.read_text(encoding="utf-8")
          old = '''    sudoku = Sudoku(2, 2, 2, 2)
              duplicate_rows = ImmutableGrid([1] * 16, rows=4, cols=4, max_elem=4)
              with pytest.raises(InvalidSolutionError, match="ElementsAtMostOnce"):
                  validate_solution(sudoku, duplicate_rows)
          '''.replace("\n          ", "\n")
          new = '''    unique = Grid(1, 2, max_elem=2)
              unique.add_rule_checked(ElementsAtMostOnce(unique, cells=[0, 1]))
              duplicate_values = ImmutableGrid([1, 1], rows=1, cols=2, max_elem=2)
              with pytest.raises(InvalidSolutionError, match="ElementsAtMostOnce"):
                  validate_solution(unique, duplicate_values)
          '''.replace("\n          ", "\n")
          if old not in text:
              raise SystemExit("Expected validation test block was not found")
          test_path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install and validate migration
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential"

      - name: Commit source migration to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add \
            pyproject.toml README.md DEVELOPMENT.md TODO.md \
            gridsolver/abstract_grids/grid.py \
            gridsolver/abstract_grids/trail.py \
            gridsolver/solver/solve_nishio.py \
            tests/test_solution_validation.py \
            tests/test_trail.py
          git diff --cached --check
          git commit -m "Add reversible trail propagation for Nishio"
          git push origin HEAD:master
