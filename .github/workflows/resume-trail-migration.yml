name: Extend trail rollback into recursive search

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/resume-trail-migration.yml

permissions:
  contents: write

concurrency:
  group: recursive-search-trail-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Replace branch deep copies with trail scopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:160]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "gridsolver/solver/solver.py",
              '''            clone = grid.deepcopy()
                  if use_guarantee:
                      clone[trial] = guarantee.val
                  else:
                      clone[test_cell] = trial

                  remaining = -1 if max_sols == -1 else max_sols - len(solutions)
                  branch_solutions = _solve_full(clone, steps, remaining, grid.guarantees)
                  steps[depth - 1] += 1
                  solutions.update(branch_solutions)
          '''.replace("\n          ", "\n"),
              '''            # Reuse the current grid for every branch. The journal restores
                  # candidates, known values, rules, guarantees and branch-local memos.
                  mark = grid.trail_mark()
                  checked_guarantees = set(grid.guarantees)
                  try:
                      if use_guarantee:
                          grid[trial] = guarantee.val
                      else:
                          grid[test_cell] = trial

                      remaining = -1 if max_sols == -1 else max_sols - len(solutions)
                      branch_solutions = _solve_full(
                          grid,
                          steps,
                          remaining,
                          checked_guarantees,
                      )
                  finally:
                      grid.trail_undo(mark)

                  steps[depth - 1] += 1
                  solutions.update(branch_solutions)
          '''.replace("\n          ", "\n"),
          )

          replace_once(
              "tests/test_trail.py",
              "from gridsolver.rules.unique import ElementsAtMostOnce\n"
              "from gridsolver.solver.propagation import propagate_basic\n",
              "from gridsolver.rules.unique import ElementsAtMostOnce\n"
              "from gridsolver.solver import solver\n"
              "from gridsolver.solver.atomic_solver import AtomicSolver\n"
              "from gridsolver.solver.propagation import propagate_basic\n",
          )

          test_path = Path("tests/test_trail.py")
          text = test_path.read_text(encoding="utf-8")
          addition = '''

              def test_recursive_search_uses_trail_instead_of_deepcopy(monkeypatch):
                  grid = Grid(1, 2, max_elem=2)
                  before = _state(grid)
                  steps: list[int] = []

                  def fail_deepcopy(self):
                      raise AssertionError("recursive search must not deepcopy branch grids")

                  monkeypatch.setattr(Grid, "deepcopy", fail_deepcopy)
                  monkeypatch.setattr(
                      AtomicSolver,
                      "_solve_power_actions",
                      lambda self: iter(()),
                  )

                  solutions = solver._solve_full(grid, steps, 3, set())

                  assert len(solutions) == 3
                  assert _state(grid) == before
                  assert steps == []
                  assert grid._trail_state.entries == []
                  assert not grid._trail_state.marks
          '''.replace("\n          ", "\n")
          if "def test_recursive_search_uses_trail_instead_of_deepcopy" in text:
              raise SystemExit("Recursive trail regression already exists")
          test_path.write_text(text.rstrip() + addition, encoding="utf-8")
          PY

      - name: Install and validate recursive trail search
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential"

      - name: Commit recursive trail search to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add gridsolver/solver/solver.py tests/test_trail.py
          git diff --cached --check
          git commit -m "Reuse trail state across recursive search branches"
          git push origin HEAD:master
