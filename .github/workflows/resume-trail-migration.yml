name: Extend trail rollback into recursive search

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/resume-trail-migration.yml

permissions:
  contents: write

concurrency:
  group: recursive-search-trail-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Replace branch deep copies with trail scopes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          solver_path = Path("gridsolver/solver/solver.py")
          text = solver_path.read_text(encoding="utf-8")
          start_marker = "            clone = grid.deepcopy()\n"
          end_marker = "            solutions.update(branch_solutions)\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("Recursive branch deepcopy marker was not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("Recursive branch end marker was not found")
          end += len(end_marker)

          replacement = (
              "            # Reuse the current grid for every branch. The journal restores\n"
              "            # candidates, known values, rules, guarantees and branch-local memos.\n"
              "            mark = grid.trail_mark()\n"
              "            checked_guarantees = set(grid.guarantees)\n"
              "            try:\n"
              "                if use_guarantee:\n"
              "                    grid[trial] = guarantee.val\n"
              "                else:\n"
              "                    grid[test_cell] = trial\n\n"
              "                remaining = -1 if max_sols == -1 else max_sols - len(solutions)\n"
              "                branch_solutions = _solve_full(\n"
              "                    grid,\n"
              "                    steps,\n"
              "                    remaining,\n"
              "                    checked_guarantees,\n"
              "                )\n"
              "            finally:\n"
              "                grid.trail_undo(mark)\n\n"
              "            steps[depth - 1] += 1\n"
              "            solutions.update(branch_solutions)\n"
          )
          solver_path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          test_path = Path("tests/test_trail.py")
          text = test_path.read_text(encoding="utf-8")
          import_marker = (
              "from gridsolver.rules.unique import ElementsAtMostOnce\n"
              "from gridsolver.solver.propagation import propagate_basic\n"
          )
          import_replacement = (
              "from gridsolver.rules.unique import ElementsAtMostOnce\n"
              "from gridsolver.solver import solver\n"
              "from gridsolver.solver.atomic_solver import AtomicSolver\n"
              "from gridsolver.solver.propagation import propagate_basic\n"
          )
          if import_marker not in text:
              raise SystemExit("Trail-test import marker was not found")
          text = text.replace(import_marker, import_replacement, 1)

          if "def test_recursive_search_uses_trail_instead_of_deepcopy" in text:
              raise SystemExit("Recursive trail regression already exists")
          addition = dedent('''


              def test_recursive_search_uses_trail_instead_of_deepcopy(monkeypatch):
                  grid = Grid(1, 2, max_elem=2)
                  before = _state(grid)
                  steps: list[int] = []

                  def fail_deepcopy(self):
                      raise AssertionError("recursive search must not deepcopy branch grids")

                  monkeypatch.setattr(Grid, "deepcopy", fail_deepcopy)
                  monkeypatch.setattr(
                      AtomicSolver,
                      "_solve_power_actions",
                      lambda self: iter(()),
                  )

                  solutions = solver._solve_full(grid, steps, 3, set())

                  assert len(solutions) == 3
                  assert _state(grid) == before
                  assert steps == []
                  assert grid._trail_state.entries == []
                  assert not grid._trail_state.marks
          ''')
          test_path.write_text(text.rstrip() + addition, encoding="utf-8")
          PY

      - name: Install and validate recursive trail search
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential"

      - name: Commit recursive trail search to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add gridsolver/solver/solver.py tests/test_trail.py
          git diff --cached --check
          git commit -m "Reuse trail state across recursive search branches"
          git push origin HEAD:master
