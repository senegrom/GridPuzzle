name: Deliver verified scanner feature branch
on:
  push:
    branches: ['improve/live-worker-recovery-diagnostics-20260919']
    paths: ['.github/workflows/feature-delivery.yml']
permissions:
  contents: write
jobs:
  deliver:
    if: github.ref == 'refs/heads/improve/live-worker-recovery-diagnostics-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify transport and exact final source tree
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          names=subprocess.check_output(['git','diff','--name-only','08516c0499ff96a75543eb810723631e4702df59','HEAD'],text=True).splitlines()
          allowed={'.github/workflows/feature-delivery.yml',*[f'scripts/.feature-delivery-{i}' for i in range(1,5)]}
          assert set(names)<=allowed, 'Branch changed during transfer; do not overwrite it'
          parts=[pathlib.Path(f'scripts/.feature-delivery-{i}') for i in range(1,5)]
          text=''.join(p.read_text().strip() for p in parts)
          text=text.replace('/3jSJ4x7/','/3j3jSJ4x7/').replace('wdHuxYYrq','wdHuxYrq')
          patch=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='af2fb3f80e2fbdf12d7061615a3d764469d89584f64f8795d4d725b8d33c2d20', 'Transfer checksum mismatch'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for p in parts:p.unlink()
          pathlib.Path('.github/workflows/feature-delivery.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='194b372b51727fcc6c3bf8c9a013775368cfeb99',tree
          PY
      - name: Run full browser unit suite before branch update
        run: |
          mkdir -p delivery-results
          node --test --test-concurrency=1 web/tests/*.test.js > delivery-results/unit-tests.log
          git diff --cached --check
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --check scripts/live_features_regressions.cjs
      - name: Commit application files within this token's scope
        run: |
          # Workflow edits require the authorized connector, not this job token.
          # Leave every workflow byte unchanged in this content-only push.
          git restore --source=HEAD --staged --worktree .github
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move live registration off-thread, add targeted clue recovery and private diagnostic export'
          git rev-parse HEAD > delivery-results/commit.txt
          git rev-parse HEAD^{tree} > delivery-results/tree.txt
          git push origin HEAD:refs/heads/improve/live-worker-recovery-diagnostics-20260919
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: feature-delivery-result
          path: delivery-results
          retention-days: 3
