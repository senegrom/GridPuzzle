name: Temporary corrected handler-aware logging candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/silent-logging-candidate-fix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silent-logging-candidate-fix
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply corrected handler-aware silent logging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path(".github/workflows/silent-logging-candidate.yml").read_text(
              encoding="utf-8"
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])

          patch_start = script.index(
              "replace_between(\n    logger,\n"
              '    "    def is_enabled(self, level: int) -> bool:\\n",'
          )
          next_patch = (
              "replace_once(\n"
              "    logger,\n"
              "    lines(\n"
              '        "        buffer_token = self._grid_buf.set(None)",'
          )
          patch_end = script.index(next_patch, patch_start)

          method_lines = [
              "    def _configured_output_threshold(self) -> int:",
              "        \"\"\"Lowest handler level reachable from this logger, or -1.\"\"\"",
              "        current: logging.Logger | None = self.lg",
              "        threshold: int | None = None",
              "        while current is not None:",
              "            for handler in current.handlers:",
              "                if isinstance(handler, logging.NullHandler):",
              "                    continue",
              "                if threshold is None or handler.level < threshold:",
              "                    threshold = handler.level",
              "            if not current.propagate:",
              "                break",
              "            current = current.parent",
              "        return -1 if threshold is None else threshold",
              "",
              "    def is_enabled(self, level: int) -> bool:",
              "        log_level = _lvl(level)",
              "        if level > self.detail_level or not self.lg.isEnabledFor(log_level):",
              "            return False",
              "        threshold = self._output_threshold.get()",
              "        if threshold is None:",
              "            threshold = self._configured_output_threshold()",
              "        return threshold >= 0 and log_level >= threshold",
              "",
          ]
          corrected_lines = [
              "replace_between(",
              "    logger,",
              repr("    def is_enabled(self, level: int) -> bool:\n") + ",",
              repr("    @contextmanager\n    def solve_context") + ",",
              "    lines(",
              *["        " + repr(line) + "," for line in method_lines],
              "    ),",
              ")",
              "",
          ]
          corrected = "\n".join(corrected_lines)
          script = script[:patch_start] + corrected + script[patch_end:]
          exec(compile(script, "silent-logging-candidate", "exec"), {})
          PY

      - name: Install and test candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_handler_aware_logging.py \
            tests/test_runtime_overhead.py \
            tests/test_hotpath_regressions.py \
            tests/test_trail.py \
            tests/test_regressions.py \
            tests/test_solver_api.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Compare ordinary silent API use without depth gating
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/silent_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import statistics
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          def factory(case):
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load("123456654321........................", row_wise=False)
                  return grid, 20, 20
              raise SystemExit(case)

          case = sys.argv[1]
          durations = []
          digest = None
          for _ in range(2):
              gc.collect()
              grid, max_sols, expected = factory(case)
              started = time.perf_counter()
              solutions = solver.solve(
                  grid,
                  log_level=0,
                  max_sols=max_sols,
                  depth_gate=None,
              )
              durations.append(time.perf_counter() - started)
              if len(solutions) != expected:
                  raise SystemExit(
                      f"{case}: expected {expected}, got {len(solutions)}"
                  )
              payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
              current = hashlib.sha256(payload).hexdigest()
              if digest is None:
                  digest = current
              elif current != digest:
                  raise SystemExit(f"{case}: nondeterministic solution set")
          print(json.dumps({
              "case": case,
              "seconds": durations,
              "median": statistics.median(durations),
              "digest": digest,
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/silent_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
