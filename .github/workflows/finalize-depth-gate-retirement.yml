name: Finalize depth gate retirement
# retry after tightening duplicate-block handling

on:
  push:
    branches:
      - agent/parallel-contract-and-optional-rich
    paths:
      - .github/workflows/finalize-depth-gate-retirement.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the exact cleanup branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the reviewed cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/parallel-contract-and-optional-rich"
          git checkout 0888df6983d48a37a2515a75153461a22ac190c0 -- \
            pyproject.toml \
            gridsolver/solver/logger.py \
            tests/test_cli_and_loading.py
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = Path(".github/retire_depth_gate_cleanup.py.gz.b64")
          script = gzip.decompress(base64.b64decode(payload.read_text().strip()))
          target = Path("${{ runner.temp }}") / "retire_depth_gate_cleanup.py"
          target.write_bytes(script)
          PY
          python "${{ runner.temp }}/retire_depth_gate_cleanup.py"
          rm -f \
            .github/retire_depth_gate_cleanup.py.gz.b64 \
            .github/workflows/finalize-depth-gate-retirement.yml
          git diff --check

      - name: Verify the retired surface is absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIniE \
            --exclude-dir=.git \
            --exclude='*.pyc' \
            'depth[_ -]?gate' .; then
            echo "retired depth-gate surface remains" >&2
            exit 1
          fi
          if grep -RIniE \
            --include='*.md' \
            --exclude-dir=.git \
            '\b(rejected|reverted|rejection)\b' .; then
            echo "rejected experiment history remains in Markdown" >&2
            exit 1
          fi
          for path in \
            FISH_REWRITE.md \
            tests/fish_rewrite_harness.py \
            tests/test_depth_gate.py \
            benchmarks/aic_peer_edges_2026-08-09.md \
            benchmarks/chain_lazy_logging_2026-08-09.md \
            benchmarks/free_threaded_threads_rejected_2026-08-09.md \
            benchmarks/worker_trail_reuse_rejected_2026-08-09.md; do
            test ! -e "$path"
          done
          python - <<'PY'
          import inspect
          import json
          import tomllib
          from pathlib import Path

          for path in Path("benchmarks").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))

          with Path("pyproject.toml").open("rb") as handle:
              project = tomllib.load(handle)["project"]
          assert "rich>=13.0" in project["dependencies"]
          assert "rich" not in project.get("optional-dependencies", {})

          from gridsolver.solver.atomic_solver import AtomicSolver
          from gridsolver.solver.solve_parallel import solve_parallel_trials
          from gridsolver.solver.solver import solve
          from run import build_parser

          assert "depth" not in inspect.signature(solve).parameters
          assert "depth" not in inspect.signature(AtomicSolver).parameters
          assert "depth" not in inspect.signature(solve_parallel_trials).parameters
          assert "--depth-gate" not in build_parser().format_help()
          PY

      - name: Install, package, and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python - <<'PY'
          import colorama
          import rich
          PY
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help >/dev/null
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Run every bounded test
        run: python -X dev -m pytest -q tests -m "not slow" --durations=15

      - name: Publish the tested source
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retire depth gate and remove rejected experiment records"
          git push origin "HEAD:$GITHUB_REF_NAME"
