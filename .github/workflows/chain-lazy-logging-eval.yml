name: Evaluate lazy chain diagnostics

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/chain-lazy-logging-eval.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chain-lazy-logging-eval
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply isolated candidate
        run: python .github/scripts/apply_chain_lazy_logging.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_chain_logging_overhead.py \
            tests/test_differential.py \
            tests/test_action_dispatch.py \
            tests/test_hotpath_regressions.py \
            tests/test_regressions.py \
            tests/test_hardening.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=15

      - name: Benchmark full default solver
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/chain-baseline HEAD^
          python .github/scripts/benchmark_chain_lazy_logging.py \
            --baseline /tmp/chain-baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --json /tmp/chain-lazy-result.json \
            --report benchmarks/chain_lazy_logging_2026-08-09.md \
            --marker /tmp/chain-lazy-promote

      - name: Promote or reject and remove experiment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/chain-lazy-promote ]]; then
            message="Avoid silent chain diagnostic work"
          else
            git checkout HEAD^ -- gridsolver/solver/solve_chain.py
            rm -f tests/test_chain_logging_overhead.py
            message="Record rejected lazy chain diagnostics benchmark"
          fi

          rm -f \
            .github/scripts/apply_chain_lazy_logging.py \
            .github/scripts/benchmark_chain_lazy_logging.py \
            .github/workflows/chain-lazy-logging-eval.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git pull --rebase origin master
          git push origin HEAD:master
