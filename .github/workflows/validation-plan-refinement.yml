name: Temporary validation-plan refinement

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/apply_validation_plan_refinement.py
      - .github/workflows/validation-plan-refinement.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-plan-refinement
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: Validate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply candidate
        run: python .github/scripts/apply_validation_plan_refinement.py

      - name: Install, compile, and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests run.py examples2.py
          python -X dev -m pytest -q tests/test_extension_validation.py tests/test_solution_validation.py tests/test_rule_inputs.py tests/test_rule_hash_cache.py tests/test_solver_api.py tests/test_regressions.py tests/test_differential.py tests/test_examples_2.py -m "not slow" --durations=10
