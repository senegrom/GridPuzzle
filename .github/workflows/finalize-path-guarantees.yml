name: Finalize path guarantee documentation and oracle

on:
  push:
    branches:
      - agent/further-solver-improvements
    paths:
      - .github/workflows/finalize-path-guarantees.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-path-guarantees
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Add public documentation and exhaustive 2x3 oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = """#### `ConsecutiveAdjacencyRule`
          Every consecutive value pair must occupy adjacent cells in a supplied symmetric topology. Hidato and Numbrix share this rule and differ only in the topology supplied by their grid class.
          """
          new = """#### `ConsecutiveAdjacencyRule`
          The rule models a complete permutation of `1..N` across `N` path cells and requires every consecutive value pair to occupy adjacent cells in a supplied symmetric topology. Hidato and Numbrix install the corresponding value-presence guarantees immediately, then share this one all-different/path rule; they differ only in the topology supplied by their grid class.
          """
          if text.count(old) != 1:
              raise SystemExit("README path-rule marker changed")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("tests/test_new_puzzle_families.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_hidato_uses_diagonal_adjacency_but_numbrix_does_not():\n"
          insert = '''def test_blank_2x3_numbrix_matches_complete_independent_oracle():
              grid = Numbrix(2, 3)

              expected = _path_oracle(
                  2,
                  3,
                  diagonal=False,
                  givens={},
              )
              actual = {
                  tuple(solution)
                  for solution in solver.solve(
                      grid,
                      max_sols=-1,
                      log_level=-1,
                      depth_gate=None,
                  )
              }

              assert len(expected) == 16
              assert actual == expected


          '''
          if insert not in text:
              if text.count(marker) != 1:
                  raise SystemExit("Numbrix oracle insertion marker changed")
              tests.write_text(text.replace(marker, insert + marker, 1), encoding="utf-8")
          PY

      - name: Validate focused correctness set
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_new_puzzle_families.py \
            tests/test_solution_validation.py \
            tests/test_rule_metadata.py \
            -m "not slow"

      - name: Commit and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-path-guarantees.yml
          git add -A -- \
            .github/workflows/finalize-path-guarantees.yml \
            README.md \
            tests/test_new_puzzle_families.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Document and exhaustively test path guarantees"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
