name: Temporary production assertion hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/assertion-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assertion-hardening
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply assertion hardening
        run: python .github/scripts/apply_assertion_hardening.py

      - name: Install and validate normal and optimized modes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q -o 0 -o 1 gridsolver tests
          python -O - <<'PY'
          from gridsolver.abstract_grids.grid import Grid
          from gridsolver.solver.solve_fish import finned_fish, fish

          for action in (fish, finned_fish):
              for bad in (True, 2.5, 1):
                  try:
                      action(Grid(1), bad)
                  except (TypeError, ValueError):
                      pass
                  else:
                      raise SystemExit(
                          f"{action.__name__} accepted {bad!r} under python -O"
                      )
          PY
          python -X dev -m pytest -q \
            tests/test_hardening.py \
            tests/test_hotpath_regressions.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Commit validated source and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            gridsolver/solver/solve_fish.py \
            gridsolver/solver/solve_chain.py \
            gridsolver/rules/sumrules.py \
            tests/test_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace production assertions with explicit checks"
          git push origin HEAD:master
