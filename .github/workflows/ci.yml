name: CI

on:
  push:
    branches: [master]
    # Documents and benchmark records do not change the code under test.
    paths-ignore: ["**/*.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  core:
    name: Python 3.14 / ${{ matrix.platform }} bounded suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14 and install the project with its corpus tooling
        uses: ./.github/actions/setup-project
        with:
          extras: dev,corpus

      - name: Validate the wheel outside the source checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python scripts/smoke_wheel.py --wheel-dir dist

      - name: Lint with the pinned ruff rule set
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Discover and run every bounded test
        run: >-
          python -X dev -m pytest -q
          tests
          -m "not slow"
          --durations=10
