name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  core:
    name: Python 3.14 / Linux bounded suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Validate package and console script
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Discover and run every bounded test
        run: >-
          python -X dev -m pytest -q
          tests
          -m "not slow"
          --durations=10

  windows:
    name: Python 3.14 / Windows bounded suite
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Smoke installed console script
        run: gridpuzzle --help

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Discover and run every bounded test
        run: >-
          python -X dev -m pytest -q
          tests
          -m "not slow"
          --durations=10
