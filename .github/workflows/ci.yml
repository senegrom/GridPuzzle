name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python 3.14 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests run.py examples2.py

      - name: Run core and regression tests
        run: >-
          python -X dev -m pytest -q
          tests/test_hardening.py
          tests/test_regressions.py
          tests/test_basic.py
          tests/test_scale.py
          -m "not slow"

      - name: Run guarantee-consumer metadata guard
        run: >-
          python -X dev -m pytest -q
          tests/test_basic.py::test_uses_guarantees_flag_matches_apply_bodies

      - name: Run representative end-to-end examples
        run: python -X dev -m pytest -q tests/test_examples_2.py

  windows-smoke:
    name: Python 3.14 / Windows smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests run.py examples2.py

      - name: Run portable regression tests
        run: >-
          python -X dev -m pytest -q
          tests/test_hardening.py
          tests/test_regressions.py
