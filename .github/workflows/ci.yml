name: CI

on:
  push:
    branches: [master]
    # Documents and benchmark records do not change the code under test.
    paths-ignore: ["**/*.md", "LICENSE"]
  # Every pull request, so that "CI result" always reports; the changes job
  # applies the push trigger's filter.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  changes:
    name: Changes that need CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Pushes were filtered by their trigger; a manual run runs everything.
      relevant: ${{ github.event_name != 'pull_request' || steps.diff.outputs.relevant == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/changed-paths
        with:
          # the push trigger's paths-ignore
          paths: |
            **
            !**/*.md
            !LICENSE

  core:
    name: Python 3.14 / ${{ matrix.platform }} bounded suite
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14 and install the project with its corpus tooling
        uses: ./.github/actions/setup-project
        with:
          extras: dev,corpus

      - name: Validate the wheel outside the source checkout
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python scripts/smoke_wheel.py --wheel-dir dist

      - name: Lint with the pinned ruff rule set
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests scripts Examples run.py

      - name: Discover and run every bounded test
        run: >-
          python -X dev -m pytest -q
          tests
          -m "not slow"
          --durations=10

  # pyproject.toml promises that the oldest versions it allows still work;
  # the core job tests the pinned current ones.
  lower-bounds:
    name: Python 3.14 / lowest allowed dependencies
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the lowest versions the dependencies and the dev extra allow
        uses: ./.github/actions/setup-project
        with:
          lower-bounds: "true"
      - name: Lint with the oldest ruff allowed
        run: python -m ruff check .
      - name: Discover and run every bounded test
        run: python -X dev -m pytest -q tests -m "not slow"

  # The check to require. A job skipped by `if:` reports success, but a
  # matrix job skipped before it expands never reports its entries' names,
  # and a failed changes job would skip everything after it. This job always
  # runs and accounts for both.
  result:
    name: CI result
    if: always()
    needs: [changes, core, lower-bounds]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job the changes call for
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          RESULTS: ${{ needs.core.result }} ${{ needs.lower-bounds.result }}
        run: |
          echo "changes: $CHANGES, relevant: $RELEVANT, jobs: $RESULTS"
          [ "$CHANGES" = success ]
          expected=skipped; if [ "$RELEVANT" = true ]; then expected=success; fi
          for result in $RESULTS; do [ "$result" = "$expected" ]; done
