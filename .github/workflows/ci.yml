name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q gridsolver tests run.py examples2.py

      - name: Run core and regression tests
        run: >-
          python -m pytest -q
          tests/test_regressions.py
          tests/test_basic.py
          tests/test_scale.py
          -m "not slow"

      - name: Run guarantee-consumer metadata guard
        run: >-
          python -m pytest -q
          tests/test_basic.py::test_uses_guarantees_flag_matches_apply_bodies

      - name: Run representative end-to-end examples
        if: matrix.python-version == '3.14'
        run: python -m pytest -q tests/test_examples_2.py
