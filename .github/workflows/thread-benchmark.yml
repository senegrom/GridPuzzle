name: Thread executor benchmark

# Measures the opt-in thread executor against the process executor on the
# free-threaded build and uploads the JSON that FREE_THREADED.md's numbers
# come from. Manual only: the numbers go into the documentation by hand.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Timed solves per backend and workload
        default: "5"
      workers:
        description: Processes or threads per solve
        default: "2"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  benchmark:
    name: Thread and process executors on Python 3.14 free-threaded
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          freethreaded: true
      - name: Install the project at the versions CI tests
        run: python -m pip install -e . -c .github/actions/setup-project/constraints.txt
      - name: Compare the executors
        env:
          ROUNDS: ${{ inputs.rounds }}
          WORKERS: ${{ inputs.workers }}
        run: >-
          python scripts/benchmark_thread_executor.py
          --rounds "$ROUNDS" --workers "$WORKERS"
          --output thread-executor.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thread-executor-benchmark
          path: thread-executor.json
          if-no-files-found: error
