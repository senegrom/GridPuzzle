name: Temporary pretty-print hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pretty-print-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pretty-print-hardening
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply pretty-print hardening
        run: python .github/scripts/apply_pretty_print_hardening.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_hardening.py \
            tests/test_basic.py \
            tests/test_cli_and_loading.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Commit validated source and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            gridsolver/abstract_grids/pretty_print.py \
            tests/test_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden pretty-print input handling"
          git push origin HEAD:master
