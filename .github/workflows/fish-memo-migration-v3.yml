name: Position-based transactional fish memo migration

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fish-memo-migration-v3.yml

permissions:
  contents: write

concurrency:
  group: transactional-fish-memo-v3
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply migration using source positions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/fish-memo-migration-v2.yml").read_text(
              encoding="utf-8"
          )
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )

          old_start = script.index(
              'grid_path = Path("gridsolver/abstract_grids/grid.py")'
          )
          old_end = script.index(
              'stale = "        # Candidate fingerprints computed in an abandoned branch are stale."',
              old_start,
          )
          replacement = '''grid_path = Path("gridsolver/abstract_grids/grid.py")
          grid = grid_path.read_text(encoding="utf-8")
          cand_pos = grid.find('            if tag == "cand":\\n')
          known_pos = grid.find('            elif tag == "known":\\n', cand_pos)
          if cand_pos < 0 or known_pos < 0:
              raise SystemExit("Candidate rollback insertion point not found")
          map_clause = (
              '            elif tag == "map":\\n'
              '                _, mapping, original, previous_token = entry\\n'
              '                dict.clear(mapping)\\n'
              '                dict.update(mapping, original)\\n'
              '                mapping._snapshot_token = previous_token\\n'
          )
          grid = grid[:known_pos] + map_clause + grid[known_pos:]

          '''
          script = script[:old_start] + replacement + script[old_end:]
          exec(compile(script, "fish-memo-migration", "exec"), {})
          PY

      - name: Install and validate transactional memo rollback
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_trail.py \
            tests/test_basic.py::test_fish_value_memo_invalidation \
            tests/test_differential.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential"

      - name: Commit transactional memo support to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git add \
            gridsolver/abstract_grids/trail.py \
            gridsolver/abstract_grids/grid.py \
            gridsolver/solver/solve_fish.py \
            tests/test_trail.py
          git diff --cached --check
          git commit -m "Make fish memo rollback transactional"
          git push origin HEAD:master
