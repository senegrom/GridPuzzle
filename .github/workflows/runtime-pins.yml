name: Runtime pins

# Pins that Dependabot does not track, compared with their releases by
# scripts/check_runtime_pins.py, one job per source. The npm job fails when
# one of the npm packages scripts/build_web.py pins for the self-hosted
# browser runtime (Pyodide, tesseract.js, its core and English data), or the
# Playwright version in .github/actions/setup-scanner, trails npm's latest
# release and no entry in scripts/runtime_pin_deferrals.toml acknowledges
# that release. The python job reads actions/python-versions' manifest, the
# CPython builds setup-python installs, and fails when a forward-
# compatibility leg that allows prereleases has a final release, when a
# CPython is newer than every leg, or when the script's FINAL_RELEASES
# disagrees with the manifest. A source that cannot be read fails its job.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Browser runtime pins against npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Compare each pin with the registry's latest release
        run: python scripts/check_runtime_pins.py npm

  python:
    name: Forward-compatibility legs against actions/python-versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Compare the legs and FINAL_RELEASES with the CPython releases
        run: python scripts/check_runtime_pins.py python
