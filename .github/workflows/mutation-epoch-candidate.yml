name: Temporary mutation-epoch candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/mutation-epoch-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-epoch-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply trail-aware mutation epoch candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def lines(*parts: str) -> str:
              return "".join(part + "\n" for part in parts)

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one marker, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          trail = Path("gridsolver/abstract_grids/trail.py")
          text = trail.read_text(encoding="utf-8")
          text = text.replace(
              "from collections.abc import Iterable\n",
              "from collections.abc import Iterable, Set\n",
              1,
          )
          text = text.replace(
              "    guarantee_cache: dict[str, Any]\n",
              "    guarantee_cache: dict[str, Any]\n    version: int\n",
              1,
          )
          text = text.replace(
              "    next_token: int = 0\n",
              "    next_token: int = 0\n    version: int = 0\n",
              1,
          )
          start = text.index("class TrailedSet(set[int]):\n")
          end = text.index("_MISSING = object()\n", start)
          replacement = dedent('''
              class TrailedSet(set[int]):
                  """A set that snapshots once per trail frame and tracks real mutations."""

                  __slots__ = ("_trail_state", "_snapshot_token")

                  def __init__(
                      self,
                      values: Iterable[int] = (),
                      trail_state: TrailState | None = None,
                      snapshot_token: int = 0,
                  ) -> None:
                      super().__init__(values)
                      self._trail_state = (
                          TrailState() if trail_state is None else trail_state
                      )
                      self._snapshot_token = snapshot_token

                  def __reduce__(self):
                      return type(self), (
                          tuple(self),
                          self._trail_state,
                          self._snapshot_token,
                      )

                  def __repr__(self) -> str:
                      return repr(set(self))

                  def copy(self) -> set[int]:
                      return set(self)

                  def _journal_snapshot(self) -> int | None:
                      state = self._trail_state
                      frame = state.marks[-1]
                      if self._snapshot_token == frame.token:
                          return None
                      previous_token = self._snapshot_token
                      state.entries.append(
                          ("cand", self, tuple(self), previous_token)
                      )
                      self._snapshot_token = frame.token
                      return previous_token

                  def _discard_noop_snapshot(self, previous_token: int | None) -> None:
                      if previous_token is None:
                          return
                      state = self._trail_state
                      tag, possible, *_ = state.entries[-1]
                      if tag != "cand" or possible is not self:
                          raise RuntimeError("Candidate trail snapshot order was corrupted")
                      state.entries.pop()
                      self._snapshot_token = previous_token

                  def _changed(self) -> None:
                      self._trail_state.version += 1

                  def add(self, element: int) -> None:
                      if element in self:
                          return
                      state = self._trail_state
                      if state.marks:
                          self._journal_snapshot()
                      set.add(self, element)
                      self._changed()

                  def clear(self) -> None:
                      if not self:
                          return
                      state = self._trail_state
                      if state.marks:
                          self._journal_snapshot()
                      set.clear(self)
                      self._changed()

                  def difference_update(self, *others: Iterable[int]) -> None:
                      if not others:
                          return
                      if (
                          len(others) == 1
                          and isinstance(others[0], Set)
                          and self.isdisjoint(others[0])
                      ):
                          return
                      state = self._trail_state
                      previous_token = (
                          self._journal_snapshot() if state.marks else None
                      )
                      before = len(self)
                      set.difference_update(self, *others)
                      if len(self) != before:
                          self._changed()
                      else:
                          self._discard_noop_snapshot(previous_token)

                  def discard(self, element: int) -> None:
                      if element not in self:
                          return
                      state = self._trail_state
                      if state.marks:
                          self._journal_snapshot()
                      set.discard(self, element)
                      self._changed()

                  def intersection_update(self, *others: Iterable[int]) -> None:
                      if not others:
                          return
                      if (
                          len(others) == 1
                          and isinstance(others[0], Set)
                          and self.issubset(others[0])
                      ):
                          return
                      state = self._trail_state
                      previous_token = (
                          self._journal_snapshot() if state.marks else None
                      )
                      before = len(self)
                      set.intersection_update(self, *others)
                      if len(self) != before:
                          self._changed()
                      else:
                          self._discard_noop_snapshot(previous_token)

                  def pop(self) -> int:
                      if not self:
                          return set.pop(self)
                      state = self._trail_state
                      if state.marks:
                          self._journal_snapshot()
                      result = set.pop(self)
                      self._changed()
                      return result

                  def remove(self, element: int) -> None:
                      if element not in self:
                          set.remove(self, element)
                      state = self._trail_state
                      if state.marks:
                          self._journal_snapshot()
                      set.remove(self, element)
                      self._changed()

                  def symmetric_difference_update(self, other: Iterable[int]) -> None:
                      if isinstance(other, Set) and not other:
                          return
                      before = set(self)
                      state = self._trail_state
                      previous_token = (
                          self._journal_snapshot() if state.marks else None
                      )
                      set.symmetric_difference_update(self, other)
                      if self != before:
                          self._changed()
                      else:
                          self._discard_noop_snapshot(previous_token)

                  def update(self, *others: Iterable[int]) -> None:
                      if not others:
                          return
                      if (
                          len(others) == 1
                          and isinstance(others[0], Set)
                          and others[0].issubset(self)
                      ):
                          return
                      state = self._trail_state
                      previous_token = (
                          self._journal_snapshot() if state.marks else None
                      )
                      before = len(self)
                      set.update(self, *others)
                      if len(self) != before:
                          self._changed()
                      else:
                          self._discard_noop_snapshot(previous_token)

                  def __iand__(self, other: Iterable[int]):
                      self.intersection_update(other)
                      return self

                  def __ior__(self, other: Iterable[int]):
                      self.update(other)
                      return self

                  def __isub__(self, other: Iterable[int]):
                      self.difference_update(other)
                      return self

                  def __ixor__(self, other: Iterable[int]):
                      self.symmetric_difference_update(other)
                      return self


          ''').lstrip()
          trail.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          grid = Path("gridsolver/abstract_grids/grid.py")
          replace_once(
              grid,
              lines(
                  "        if current != value and self._trail_state.active:",
                  "            self._trail_state.entries.append((\"known\", index, current))",
                  "        self._known[index] = value",
              ),
              lines(
                  "        if current != value:",
                  "            if self._trail_state.active:",
                  "                self._trail_state.entries.append((\"known\", index, current))",
                  "            self._known[index] = value",
                  "            self._trail_state.version += 1",
              ),
          )
          replace_once(
              grid,
              lines(
                  "                guarantee_cache=self._guarantee_cache,",
                  "            )",
              ),
              lines(
                  "                guarantee_cache=self._guarantee_cache,",
                  "                version=state.version,",
                  "            )",
              ),
          )
          replace_once(
              grid,
              lines(
                  "        self._struct_cache = frame.struct_cache",
                  "        self._guarantee_cache = frame.guarantee_cache",
              ),
              lines(
                  "        self._struct_cache = frame.struct_cache",
                  "        self._guarantee_cache = frame.guarantee_cache",
                  "        state.version = frame.version",
              ),
          )
          replace_once(
              grid,
              lines(
                  "        self.rules.update(additions)",
                  "        if self._trail_state.active:",
              ),
              lines(
                  "        self.rules.update(additions)",
                  "        self._trail_state.version += 1",
                  "        if self._trail_state.active:",
              ),
          )
          replace_once(
              grid,
              lines(
                  "        self.rules.remove(rule)",
                  "        self.rules_ia.add(rule)",
                  "        if self._trail_state.active:",
              ),
              lines(
                  "        self.rules.remove(rule)",
                  "        self.rules_ia.add(rule)",
                  "        self._trail_state.version += 1",
                  "        if self._trail_state.active:",
              ),
          )
          replace_once(
              grid,
              lines(
                  "        self.guarantees.update(additions)",
                  "        if self._trail_state.active:",
              ),
              lines(
                  "        self.guarantees.update(additions)",
                  "        self._trail_state.version += 1",
                  "        if self._trail_state.active:",
              ),
          )
          replace_once(
              grid,
              lines(
                  "        self.guarantees.remove(guarantee)",
                  "        self.guarantees_ia.add(guarantee)",
                  "        if self._trail_state.active:",
              ),
              lines(
                  "        self.guarantees.remove(guarantee)",
                  "        self.guarantees_ia.add(guarantee)",
                  "        self._trail_state.version += 1",
                  "        if self._trail_state.active:",
              ),
          )

          propagation = Path("gridsolver/solver/propagation.py")
          text = propagation.read_text(encoding="utf-8")
          old = dedent('''
              type PropagationSnapshot = tuple[bytes, int, int, int]
          ''').lstrip()
          new = dedent('''
              type PropagationSnapshot = int | tuple[int, int, int, int]
          ''').lstrip()
          if text.count(old) != 1:
              raise SystemExit("propagation snapshot type marker changed")
          text = text.replace(old, new, 1)
          old = dedent('''
              def propagation_snapshot(grid: Grid) -> PropagationSnapshot:
                  """Return the complete monotone state used for fixpoint detection."""
                  return (
                      bytes(grid._known),
                      sum(len(candidates) for candidates in grid._candidates),
                      len(grid.rules) + len(grid.guarantees),
                      len(grid.rules_ia) + len(grid.guarantees_ia),
                  )
          ''').lstrip()
          new = dedent('''
              def propagation_snapshot(
                  grid: Grid,
                  *,
                  detailed: bool = False,
              ) -> PropagationSnapshot:
                  """Return an O(1) mutation epoch, with optional diagnostics."""
                  version = grid._trail_state.version
                  if not detailed:
                      return version
                  return (
                      version,
                      sum(len(candidates) for candidates in grid._candidates),
                      len(grid.rules) + len(grid.guarantees),
                      len(grid.rules_ia) + len(grid.guarantees_ia),
                  )
          ''').lstrip()
          if text.count(old) != 1:
              raise SystemExit("propagation snapshot function marker changed")
          propagation.write_text(text.replace(old, new, 1), encoding="utf-8")

          atomic = Path("gridsolver/solver/atomic_solver.py")
          replace_once(
              atomic,
              lines(
                  "    def _state_snapshot(self) -> PropagationSnapshot:",
                  "        return propagation_snapshot(self.grid)",
              ),
              lines(
                  "    def _state_snapshot(self) -> PropagationSnapshot:",
                  "        return propagation_snapshot(",
                  "            self.grid,",
                  "            detailed=self.stats is not None,",
                  "        )",
              ),
          )

          Path("tests/test_mutation_epoch.py").write_text(
              dedent('''
                  from gridsolver.abstract_grids.grid import Grid
                  from gridsolver.rules.rules import Guarantee
                  from gridsolver.rules.unique import ElementsAtMostOnce
                  from gridsolver.solver.propagation import propagation_snapshot


                  def test_candidate_noops_do_not_advance_epoch_or_journal():
                      grid = Grid(1, 1, max_elem=3)
                      possible = grid.get_candidates(0)
                      mark = grid.trail_mark()
                      before = propagation_snapshot(grid)

                      possible.difference_update({9})
                      possible.intersection_update({1, 2, 3, 4})
                      possible.update({1, 2})

                      assert propagation_snapshot(grid) == before
                      assert grid._trail_state.entries == []
                      grid.trail_undo(mark)


                  def test_epoch_tracks_all_propagation_state_and_rolls_back():
                      grid = Grid(2)
                      base = propagation_snapshot(grid)
                      mark = grid.trail_mark()

                      grid.get_candidates(0).discard(2)
                      after_candidate = propagation_snapshot(grid)
                      assert after_candidate != base

                      grid[0] = 1
                      after_known = propagation_snapshot(grid)
                      assert after_known != after_candidate

                      rule = ElementsAtMostOnce(grid, cells=[0, 1])
                      grid.add_rule_checked(rule)
                      after_rule = propagation_snapshot(grid)
                      assert after_rule != after_known

                      guarantee = Guarantee(1, frozenset({0, 1}), 2, 2)
                      grid.add_gtee_checked(guarantee)
                      assert propagation_snapshot(grid) != after_rule

                      grid.trail_undo(mark)
                      assert propagation_snapshot(grid) == base
                      assert grid.get_candidates(0) == {1, 2}
                      assert grid[0] == 0
                      assert not grid.rules
                      assert not grid.guarantees


                  def test_nested_epochs_restore_the_parent_value():
                      grid = Grid(1, 1, max_elem=3)
                      outer = grid.trail_mark()
                      grid.get_candidates(0).discard(3)
                      parent = propagation_snapshot(grid)

                      inner = grid.trail_mark()
                      grid.get_candidates(0).discard(2)
                      assert propagation_snapshot(grid) != parent
                      grid.trail_undo(inner)
                      assert propagation_snapshot(grid) == parent

                      grid.trail_undo(outer)
                      assert propagation_snapshot(grid) == 0
              ''').lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Install and test candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_mutation_epoch.py \
            tests/test_trail.py \
            tests/test_regressions.py \
            tests/test_hardening.py \
            tests/test_solver_api.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            tests/test_runtime_overhead.py \
            tests/test_hotpath_regressions.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Compare full default solver without depth gating
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/epoch_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import logging
          import statistics
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          logging.disable(10_000)

          def factory(case):
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load("123456654321........................", row_wise=False)
                  return grid, 20, 20
              raise SystemExit(case)

          case = sys.argv[1]
          durations = []
          digest = None
          for _ in range(2):
              gc.collect()
              grid, max_sols, expected = factory(case)
              started = time.perf_counter()
              solutions = solver.solve(
                  grid,
                  log_level=0,
                  max_sols=max_sols,
                  depth_gate=None,
              )
              durations.append(time.perf_counter() - started)
              if len(solutions) != expected:
                  raise SystemExit(
                      f"{case}: expected {expected}, got {len(solutions)}"
                  )
              payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
              current = hashlib.sha256(payload).hexdigest()
              if digest is None:
                  digest = current
              elif current != digest:
                  raise SystemExit(f"{case}: nondeterministic solution set")
          print(json.dumps({
              "case": case,
              "seconds": durations,
              "median": statistics.median(durations),
              "digest": digest,
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/epoch_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
