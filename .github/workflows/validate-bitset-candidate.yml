name: Validate broader candidate bitsets

on:
  push:
    branches:
      - agent/broaden-candidate-bitsets
    paths:
      - .github/workflows/validate-bitset-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-broader-candidate-bitsets
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the candidate source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          encoded = Path(
              ".github/patches/broaden-candidate-bitsets.b85"
          ).read_text(encoding="ascii").strip()
          Path("/tmp/broaden-candidate-bitsets.patch").write_bytes(
              zlib.decompress(base64.b85decode(encoded.encode("ascii")))
          )
          PY
          git apply --check /tmp/broaden-candidate-bitsets.patch
          git apply /tmp/broaden-candidate-bitsets.patch
          git diff --check

      - name: Install, build, and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help >/dev/null
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Run complete bounded correctness suite
        run: >-
          python -X dev -m pytest -q tests
          -m "not slow"
          --durations=20

      - name: Compare exact master and candidate performance
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/bitset-baseline origin/master
          cat > /tmp/benchmark_broader_candidate_bitsets.py <<'PY'
          from __future__ import annotations

          import argparse
          import gc
          import hashlib
          import inspect
          import json
          import logging
          import math
          import os
          from pathlib import Path
          import statistics
          import subprocess
          import sys
          import time


          EXAMPLE_9 = (
              "..29.6......1.83...96.7....9...5....2....9.31.1..8.5"
              "....8...........57.....7...2."
          )


          def fingerprint(solutions) -> str:
              payload = repr(
                  tuple(sorted(tuple(solution) for solution in solutions))
              ).encode()
              return hashlib.sha256(payload).hexdigest()


          def macro_factory(case: str):
              from gridsolver.abstract_grids.grid_loading import (
                  create_from_str_and_class,
              )
              from gridsolver.grid_classes.sudoku import Sudoku

              if case == "loaded4_all":
                  grid = Sudoku(2, 2, 2, 2)
                  grid.load("12344321........")
                  return grid, -1, 4
              if case == "blank4_cap20":
                  return Sudoku(2, 2, 2, 2), 20, 20
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load(
                      "123456654321........................",
                      row_wise=False,
                  )
                  return grid, 20, 20
              if case == "example9_first":
                  grid = create_from_str_and_class(EXAMPLE_9, Sudoku)
                  return grid, 1, 1
              raise ValueError(case)


          def worker(kind: str, case: str) -> dict[str, object]:
              logging.disable(10_000)
              gc.collect()
              started = time.perf_counter()

              if kind == "micro":
                  from gridsolver.grid_classes.sudoku import Sudoku
                  from gridsolver.solver.candidate_topology import (
                      CandidateTopology,
                  )
                  from gridsolver.solver.solve_empty_rectangle import (
                      empty_rectangle,
                  )
                  from gridsolver.solver.solve_locked_candidate import (
                      locked_candidate,
                  )
                  from gridsolver.solver.solve_skyscraper import skyscraper

                  accepts_topology = (
                      "topology"
                      in inspect.signature(locked_candidate).parameters
                  )
                  final = None
                  for _ in range(200):
                      grid = Sudoku()
                      if accepts_topology:
                          topology = CandidateTopology(grid)
                          locked_candidate(grid, topology=topology)
                          skyscraper(grid, topology=topology)
                          empty_rectangle(grid, topology=topology)
                      else:
                          locked_candidate(grid)
                          skyscraper(grid)
                          empty_rectangle(grid)
                      final = tuple(
                          tuple(sorted(possible))
                          for possible in grid._candidates
                      )
                  digest = hashlib.sha256(repr(final).encode()).hexdigest()
                  count = 200
              else:
                  from gridsolver.solver import solver

                  grid, max_sols, expected = macro_factory(case)
                  solutions = solver.solve(
                      grid,
                      log_level=-1,
                      max_sols=max_sols,
                      depth_gate=None,
                  )
                  if len(solutions) != expected:
                      raise RuntimeError(
                          f"{case}: expected {expected}, got {len(solutions)}"
                      )
                  digest = fingerprint(solutions)
                  count = len(solutions)

              return {
                  "seconds": time.perf_counter() - started,
                  "digest": digest,
                  "count": count,
              }


          def run_one(
              directory: Path,
              kind: str,
              case: str,
          ) -> dict[str, object]:
              env = os.environ.copy()
              env["PYTHONPATH"] = str(directory)
              env["PYTHONHASHSEED"] = "0"
              result = subprocess.run(
                  [
                      sys.executable,
                      __file__,
                      "--worker",
                      "--kind",
                      kind,
                      "--case",
                      case,
                  ],
                  cwd=directory,
                  env=env,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)


          def orchestrate(args: argparse.Namespace) -> None:
              baseline = Path(args.baseline).resolve()
              candidate = Path(args.candidate).resolve()
              specs = (
                  ("power_action_micro", "micro", 5),
                  ("loaded4_all", "macro", 5),
                  ("blank4_cap20", "macro", 3),
                  ("blank4_all", "macro", 2),
                  ("nonsquare6_cap20", "macro", 3),
                  ("example9_first", "macro", 5),
              )

              results: dict[str, object] = {
                  "python": sys.version,
                  "depth_gate": None,
                  "cases": {},
              }
              for case, kind, repeats in specs:
                  timings = {"baseline": [], "candidate": []}
                  expected_digest = None
                  expected_count = None
                  for round_index in range(repeats):
                      order = (
                          ("baseline", baseline),
                          ("candidate", candidate),
                      )
                      if round_index % 2:
                          order = tuple(reversed(order))
                      for label, directory in order:
                          sample = run_one(directory, kind, case)
                          digest = sample["digest"]
                          count = sample["count"]
                          if expected_digest is None:
                              expected_digest = digest
                              expected_count = count
                          elif digest != expected_digest or count != expected_count:
                              raise RuntimeError(
                                  f"{case}: solution/state mismatch for {label}"
                              )
                          timings[label].append(float(sample["seconds"]))

                  base_median = statistics.median(timings["baseline"])
                  candidate_median = statistics.median(timings["candidate"])
                  ratio = candidate_median / base_median
                  results["cases"][case] = {
                      "kind": kind,
                      "baseline_seconds": timings["baseline"],
                      "candidate_seconds": timings["candidate"],
                      "baseline_median": base_median,
                      "candidate_median": candidate_median,
                      "candidate_over_baseline": ratio,
                      "improvement_percent": (1.0 - ratio) * 100.0,
                      "digest": expected_digest,
                      "count": expected_count,
                  }

              cases = results["cases"]
              micro_ratio = cases["power_action_micro"][
                  "candidate_over_baseline"
              ]
              macro_ratios = [
                  data["candidate_over_baseline"]
                  for name, data in cases.items()
                  if name != "power_action_micro"
              ]
              macro_geomean = math.exp(
                  sum(math.log(value) for value in macro_ratios)
                  / len(macro_ratios)
              )
              macro_worst = max(macro_ratios)
              results["gates"] = {
                  "micro_max_ratio": 0.95,
                  "macro_geomean_max_ratio": 1.0075,
                  "macro_worst_max_ratio": 1.03,
                  "micro_ratio": micro_ratio,
                  "macro_geomean_ratio": macro_geomean,
                  "macro_worst_ratio": macro_worst,
              }
              passed = (
                  micro_ratio <= 0.95
                  and macro_geomean <= 1.0075
                  and macro_worst <= 1.03
              )
              results["passed"] = passed

              json_path = Path(args.json_report)
              md_path = Path(args.report)
              json_path.parent.mkdir(parents=True, exist_ok=True)
              json_path.write_text(
                  json.dumps(results, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

              rows = []
              for name, data in cases.items():
                  rows.append(
                      "| "
                      f"{name} | {data['baseline_median']:.6f} | "
                      f"{data['candidate_median']:.6f} | "
                      f"{data['improvement_percent']:+.2f}% |"
                  )
              md_path.write_text(
                  "# Broader candidate bitsets — 2026-08-12\n\n"
                  "All macro comparisons used `depth_gate=None` and exact "
                  "deterministic solution fingerprints. Runs were interleaved "
                  "to reduce host drift.\n\n"
                  "| Case | Master seconds | Candidate seconds | Improvement |\n"
                  "|---|---:|---:|---:|\n"
                  + "\n".join(rows)
                  + "\n\n"
                  f"- Micro ratio: `{micro_ratio:.6f}` (must be <= 0.95)\n"
                  f"- Macro geometric-mean ratio: `{macro_geomean:.6f}` "
                  "(must be <= 1.0075)\n"
                  f"- Worst macro ratio: `{macro_worst:.6f}` "
                  "(must be <= 1.03)\n"
                  f"- Verdict: **{'accepted' if passed else 'rejected'}**\n",
                  encoding="utf-8",
              )
              print(json.dumps(results["gates"], sort_keys=True))
              if not passed:
                  raise SystemExit("Broader candidate bitsets failed gates")


          def main() -> None:
              parser = argparse.ArgumentParser()
              parser.add_argument("--worker", action="store_true")
              parser.add_argument("--kind")
              parser.add_argument("--case")
              parser.add_argument("--baseline")
              parser.add_argument("--candidate")
              parser.add_argument("--report")
              parser.add_argument("--json-report")
              args = parser.parse_args()
              if args.worker:
                  print(json.dumps(worker(args.kind, args.case)))
              else:
                  orchestrate(args)


          if __name__ == "__main__":
              main()
          PY
          python /tmp/benchmark_broader_candidate_bitsets.py \
            --baseline /tmp/bitset-baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --report benchmarks/broader_candidate_bitsets_2026-08-12.md \
            --json-report benchmarks/broader_candidate_bitsets_2026-08-12.json

      - name: Publish the tested source and benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/broaden-candidate-bitsets.b85
          git add -A -- \
            gridsolver \
            tests/test_bitset_power_actions.py \
            benchmarks/broader_candidate_bitsets_2026-08-12.md \
            benchmarks/broader_candidate_bitsets_2026-08-12.json \
            .github/patches/broaden-candidate-bitsets.b85
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Broaden incremental candidate bitsets"
          git push origin "HEAD:$GITHUB_REF_NAME"
