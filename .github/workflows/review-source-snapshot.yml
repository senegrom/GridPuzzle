name: Review repair source snapshot
on:
  push:
    branches: [fix/review-and-live-acquisition-20260922]
    paths: [.github/workflows/review-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive exact source revision
        run: |
          mkdir -p source-snapshot
          git rev-parse HEAD > source-snapshot/commit.txt
          git archive --format=tar HEAD > source-snapshot/source.tar
          sha256sum source-snapshot/source.tar > source-snapshot/source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-repair-source
          path: source-snapshot
          retention-days: 1
