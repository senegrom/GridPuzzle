name: Branch source snapshot
on:
  push:
    branches: ['improve/live-worker-recovery-diagnostics-20260919']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Retain exact source and history for paired local tests
        run: |
          mkdir -p source-artifact
          git archive HEAD > source-artifact/source.tar
          git bundle create source-artifact/history.bundle --all
          git rev-parse HEAD > source-artifact/commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: branch-source
          path: source-artifact
          retention-days: 2
