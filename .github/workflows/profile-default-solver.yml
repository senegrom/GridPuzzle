name: Temporary profile current default solver

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/profile_default_solver.py
      - .github/workflows/profile-default-solver.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-default-solver
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Profile current default solver
        run: |
          python .github/scripts/profile_default_solver.py blank4_all
          python .github/scripts/profile_default_solver.py nonsquare6_cap20
          python .github/scripts/profile_default_solver.py killer_a
