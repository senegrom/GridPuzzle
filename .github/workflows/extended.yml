name: Extended CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: extended-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  supported-corpus:
    name: Supported puzzle corpus
    runs-on: ubuntu-latest
    # the whole selection runs in single-digit minutes since August 2026
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run supported example corpora
        run: >-
          python -X dev -m pytest -q
          tests/test_examples_1.py
          tests/test_examples_futoshiki.py
          tests/test_examples_kenken.py
          tests/test_examples_killer.py
          tests/test_examples_sudoku1.py
          tests/test_examples_sudoku2.py
          tests/test_examples_lsq.py::test_ex_latin_squares
          --durations=20

  new-family-corpus:
    name: ${{ matrix.family }} corpus shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # worst shard is ~21 cases x 60s case timeout, well under an hour
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [hidato, numbrix, kakuro, slitherlink]
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Solve isolated corpus shard
        run: >-
          python scripts/run_new_family_corpus.py
          --family "${{ matrix.family }}"
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --case-timeout 60
          --output "artifacts/${{ matrix.family }}-${{ matrix.shard }}.json"
      - name: Upload corpus timing and status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-family-${{ matrix.family }}-${{ matrix.shard }}
          path: artifacts/${{ matrix.family }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  # The former large-scale and technique-soundness jobs were removed in
  # August 2026: their test selections lost the slow marker once the engine
  # made them run in seconds, so they now execute in the per-push core suite.

  pandiagonal-corpus:
    name: Slow pandiagonal Latin-square corpus
    runs-on: ubuntu-latest
    # ~3-5 minutes since the August 2026 engine work
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run the slow pandiagonal corpus
        run: >-
          python -X dev -m pytest -q
          tests/test_examples_lsq.py::test_ex_diag_latin_squares
          --durations=10

  parallel-equivalence:
    name: Full 288-solution parallel-vs-sequential equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Run the full-enumeration cross-process merge test
        run: >-
          python -X dev -m pytest -q
          "tests/test_basic.py::test_parallel_trials_match_sequential"
          --durations=5
