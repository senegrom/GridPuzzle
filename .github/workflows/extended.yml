name: Extended CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "gridsolver/**"
      - "scripts/run_new_family_corpus.py"
      - "benchmarks/corpus_timeout_baseline.json"
      - "tests/test_corpus_timeout_policy.py"
      - "tests/test_new_family_corpus_runner.py"
      - "tests/test_gridpuzzle_review_regressions.py"
      - "tests/test_review3_native.py"
      - "tests/test_basic.py"
      - "tests/test_stack_safe_search.py"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: extended-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  # The corpus jobs run without -X dev: its debug memory allocator roughly
  # doubles solver time, and the per-push core suite already runs every
  # bounded test under it.
  corpus:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Supported non-Sudoku corpora
            timeout: 45
            flags: ""
            selection: >-
              tests/test_examples_1.py
              tests/test_examples_futoshiki.py
              tests/test_examples_kenken.py
              tests/test_examples_killer.py
              tests/test_examples_lsq.py::test_ex_latin_squares
          - name: Sudoku corpora (9x9 sets, 16x16, bounded 25x25)
            timeout: 45
            flags: ""
            selection: >-
              tests/test_examples_sudoku1.py
              tests/test_examples_sudoku2.py
          - name: Slow pandiagonal Latin-square corpus
            timeout: 30
            flags: ""
            selection: tests/test_examples_lsq.py::test_ex_diag_latin_squares
          # The tests marked slow that the per-push suite skips: the full
          # 288-solution parallel-vs-sequential equivalence, the two blank
          # Sudoku enumerations and the deep stack-safety searches.
          - name: Slow deterministic checks
            timeout: 30
            flags: -X dev
            selection: >-
              tests/test_basic.py::test_parallel_trials_match_sequential
              tests/test_basic.py::test_sudo1
              tests/test_basic.py::test_sudo_nonsq
              tests/test_stack_safe_search.py

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Run ${{ matrix.name }}
        run: python ${{ matrix.flags }} -m pytest -q ${{ matrix.selection }} --durations=20

  new-family-corpus:
    name: ${{ matrix.family }} corpus shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # worst shard is ~21 cases x 60s case timeout, well under an hour
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family: [hidato, numbrix, kakuro, slitherlink]
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-project
      - name: Solve isolated corpus shard
        run: >-
          python scripts/run_new_family_corpus.py
          --family "${{ matrix.family }}"
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --case-timeout 60
          --timeout-baseline benchmarks/corpus_timeout_baseline.json
          --output "artifacts/${{ matrix.family }}-${{ matrix.shard }}.json"
      - name: Upload corpus timing and status report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: new-family-${{ matrix.family }}-${{ matrix.shard }}
          path: artifacts/${{ matrix.family }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 30
