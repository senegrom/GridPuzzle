name: Evaluate at-most-once helper memoization

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/atmostonce-memo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atmostonce-memo
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply helper memo candidate
        run: python .github/scripts/apply_atmostonce_memo.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_atmostonce_memo.py \
            tests/test_rule_only_cache.py \
            tests/test_topology_cache_lifecycle.py \
            tests/test_aic_extra_visibility.py \
            tests/test_differential.py \
            tests/test_action_dispatch.py \
            tests/test_hotpath_regressions.py \
            tests/test_regressions.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=15

      - name: Benchmark full default solver
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/atmostonce-baseline HEAD^
          python .github/scripts/benchmark_atmostonce_memo.py \
            --baseline /tmp/atmostonce-baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --json /tmp/atmostonce-result.json \
            --report benchmarks/atmostonce_memo_2026-08-09.md \
            --marker /tmp/atmostonce-promote

      - name: Promote or reject and remove experiment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/atmostonce-promote ]]; then
            message="Memoize stable at-most-once materialisation"
          else
            git checkout HEAD^ -- gridsolver/solver/rulehelpers.py
            rm -f tests/test_atmostonce_memo.py
            message="Record rejected at-most-once memo benchmark"
          fi

          rm -f \
            .github/scripts/apply_atmostonce_memo.py \
            .github/scripts/benchmark_atmostonce_memo.py \
            .github/workflows/atmostonce-memo.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git pull --rebase origin master
          git push origin HEAD:master
