name: Temporary restore optional depth gate

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/apply_restore_depth_gate.py
      - .github/scripts/run_restore_depth_gate.py
      - .github/workflows/restore-depth-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-depth-gate
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: Validate / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply candidate
        run: python .github/scripts/run_restore_depth_gate.py

      - name: Install and compile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests run.py examples2.py
          gridpuzzle --help

      - name: Run API, parallel, CLI, rollback, and example tests
        run: >-
          python -X dev -m pytest -q
          tests/test_depth_gate.py
          tests/test_solver_api.py
          tests/test_cli_and_loading.py
          tests/test_runtime_overhead.py
          tests/test_regressions.py
          tests/test_trail.py
          tests/test_differential.py
          tests/test_examples_2.py
          -m "not slow"
          --durations=10

  promote:
    name: Promote restored depth gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply validated candidate
        run: python .github/scripts/run_restore_depth_gate.py

      - name: Commit validated source, tests, and documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            DEVELOPMENT.md \
            TODO.md \
            run.py \
            gridsolver/solver/atomic_solver.py \
            gridsolver/solver/solve_parallel.py \
            gridsolver/solver/solver.py \
            tests/test_depth_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore explicit default-off depth gate"
          git push origin HEAD:master
