name: Temporary promote validation-plan refinement

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/promote-validation-plan-refinement.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-validation-plan-refinement
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: random
  PYTHONUNBUFFERED: "1"

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply validated candidate
        run: python .github/scripts/apply_validation_plan_refinement.py

      - name: Revalidate focused suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests run.py examples2.py
          python -X dev -m pytest -q tests/test_extension_validation.py tests/test_solution_validation.py tests/test_rule_inputs.py tests/test_rule_hash_cache.py tests/test_solver_api.py tests/test_regressions.py tests/test_differential.py tests/test_examples_2.py -m "not slow" --durations=10

      - name: Commit validated source and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            gridsolver/solver/validation.py \
            tests/test_extension_validation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align extension validation with active guarantees"
          git push origin HEAD:master
