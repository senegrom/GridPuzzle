name: Temporary guarantee-filter candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/filter-guarantees-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filter-guarantees-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache guarantee groups used by filtering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("gridsolver/solver/solve_guarantees.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("# noinspection PyProtectedMember\ndef filter_guarantees")
          end = text.index("# noinspection PyProtectedMember\ndef update_from_guarantee", start)
          replacement = dedent('''
              def _guarantees_by_value(grid: Grid) -> dict[int, tuple[Guarantee, ...]]:
                  """Return live guarantees grouped and size-sorted for filtering."""
                  grouped: dict[int, list[Guarantee]] = {}
                  for guarantee in grid.guarantees:
                      grouped.setdefault(guarantee.val, []).append(guarantee)
                  return {
                      value: tuple(
                          sorted(
                              guarantees,
                              key=lambda guarantee: len(guarantee.cells),
                          )
                      )
                      for value, guarantees in grouped.items()
                  }


              # noinspection PyProtectedMember
              def filter_guarantees(grid: Grid) -> None:
                  # The live guarantee set changes far less often than propagation calls.
                  # Cache grouping and sorting with the existing guarantee-only lifecycle.
                  grouped = grid.cached_guarantee_struct(
                      "filter_guarantees_by_value",
                      lambda: _guarantees_by_value(grid),
                  )

                  to_deactivate: set[Guarantee] = set()
                  for guarantees in grouped.values():
                      if len(guarantees) < 2:
                          continue
                      for index, smaller in enumerate(guarantees):
                          for larger in guarantees[index + 1:]:
                              if smaller.cells <= larger.cells:
                                  to_deactivate.add(larger)

                  for guarantee in to_deactivate:
                      if guarantee in grid.guarantees:
                          grid.deactivate_gtee(guarantee)

                  for guarantee in tuple(grid.guarantees):
                      if guarantee in grid.guarantees:
                          update_from_guarantee(grid, guarantee)


          ''').lstrip()
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          Path("tests/test_guarantee_filter_cache.py").write_text(
              dedent('''
                  from gridsolver.abstract_grids.grid import Grid
                  from gridsolver.rules.rules import Guarantee
                  from gridsolver.solver.solve_guarantees import filter_guarantees


                  def test_guarantee_filter_grouping_is_cached_and_invalidated():
                      grid = Grid(2)
                      larger = Guarantee(1, frozenset({0, 1, 2}), 2, 2)
                      smaller = Guarantee(1, frozenset({0, 1}), 2, 2)
                      grid.add_gtee_checked(larger)
                      grid.add_gtee_checked(smaller)

                      filter_guarantees(grid)
                      first_cache = grid._guarantee_cache
                      assert larger in grid.guarantees_ia

                      filter_guarantees(grid)
                      assert grid._guarantee_cache is first_cache
                      grouped = grid._guarantee_cache["filter_guarantees_by_value"]
                      assert grouped[1] == (smaller,)

                      grid.add_gtee_checked(
                          Guarantee(2, frozenset({2, 3}), 2, 2)
                      )
                      assert grid._guarantee_cache is not first_cache
                      filter_guarantees(grid)
                      assert set(grid._guarantee_cache["filter_guarantees_by_value"]) == {1, 2}
              ''').lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Install and test candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_guarantee_filter_cache.py \
            tests/test_hotpath_regressions.py \
            tests/test_regressions.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            -m "not slow" --durations=10

      - name: Compare full default solver
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/filter_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import logging
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          logging.disable(10_000)

          case = sys.argv[1]
          if case == "blank4_all":
              grid = Sudoku(2, 2, 2, 2)
              max_sols, expected = -1, 288
          elif case == "nonsquare6_cap20":
              grid = Sudoku(3, 2, 2, 3)
              grid.load("123456654321........................", row_wise=False)
              max_sols, expected = 20, 20
          else:
              raise SystemExit(case)

          gc.collect()
          started = time.perf_counter()
          solutions = solver.solve(
              grid,
              log_level=0,
              max_sols=max_sols,
              depth_gate=None,
          )
          seconds = time.perf_counter() - started
          if len(solutions) != expected:
              raise SystemExit(f"{case}: expected {expected}, got {len(solutions)}")
          payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
          print(json.dumps({
              "case": case,
              "seconds": seconds,
              "digest": hashlib.sha256(payload).hexdigest(),
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/filter_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
