name: Validate and publish path guarantees

on:
  push:
    branches:
      - agent/path-guarantees-correctness
    paths:
      - .github/workflows/export-path-guarantee-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: path-guarantee-promotion
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply guarantee implementation
        run: python .github/scripts/apply_path_guarantee_hardening.py

      - name: Install and test focused correctness surface
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_path_guarantees.py \
            tests/test_new_puzzle_families.py \
            tests/test_solution_validation.py \
            tests/test_rule_metadata.py \
            tests/test_guarantee_filter_cache.py \
            tests/test_hotpath_regressions.py \
            tests/test_extension_validation.py \
            -m "not slow" \
            --durations=15

      - name: Commit tested source and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/apply_path_guarantee_hardening.py \
            .github/workflows/export-path-guarantee-source.yml
          git add -A -- \
            .github/scripts/apply_path_guarantee_hardening.py \
            .github/workflows/export-path-guarantee-source.yml \
            gridsolver/abstract_grids/grid.py \
            gridsolver/grid_classes/path_puzzles.py \
            gridsolver/rules/unique.py \
            gridsolver/solver/propagation.py \
            gridsolver/solver/validation.py \
            tests/test_path_guarantees.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seed path value guarantees"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
