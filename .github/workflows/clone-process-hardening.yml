name: Clone and process payload hardening v2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/clone-process-hardening.yml
      - .github/scripts/clone_process_hardening.py

permissions:
  contents: write

concurrency:
  group: clone-process-hardening
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply clone and worker-payload hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("gridsolver/solver/solver.py")
          text = path.read_text(encoding="utf-8")
          current = "    return max_sols, processes, depth_gate\n\ndef solve(\n"
          normalized = "    return max_sols, processes, depth_gate\ndef solve(\n"
          if current not in text:
              raise SystemExit("Solve-option boundary not found")
          path.write_text(text.replace(current, normalized, 1), encoding="utf-8")
          PY
          python .github/scripts/clone_process_hardening.py

      - name: Install and validate clone semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_rule_inputs.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Commit tested source and remove migration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git rm \
            .github/workflows/clone-process-hardening.yml \
            .github/scripts/clone_process_hardening.py
          git add \
            gridsolver/abstract_grids/grid.py \
            gridsolver/solver/solver.py \
            tests/test_solver_api.py \
            DEVELOPMENT.md
          git diff --cached --check
          git commit -m "Harden clone hooks and parallel worker payloads"
          git push origin HEAD:master
