name: Temporary rendering-domain hardening

# Revision 2 preserves the established "known must be a sequence" prefix.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/render-domain-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-domain-hardening
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply rendering-domain hardening
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_render_domain_hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path("gridsolver/abstract_grids/pretty_print.py")
          text = path.read_text(encoding="utf-8")
          old = "known must be an iterable of grid values"
          if text.count(old) != 2:
              raise SystemExit(f"known error-message marker count: {text.count(old)}")
          path.write_text(
              text.replace(
                  old,
                  "known must be a sequence or iterable of grid values",
              ),
              encoding="utf-8",
          )
          PY

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_hardening.py \
            tests/test_basic.py \
            tests/test_regressions.py \
            tests/test_examples_2.py \
            -m "not slow" \
            --durations=10

      - name: Commit validated source and tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            gridsolver/abstract_grids/pretty_print.py \
            tests/test_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate rendering values and inequalities"
          git push origin HEAD:master
