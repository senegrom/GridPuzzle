name: Export consolidation source

on:
  push:
    branches:
      - agent/consolidate-correctness-debloat
    paths:
      - .github/workflows/export-consolidation-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gridpuzzle-consolidation-source
          path: .
          include-hidden-files: true
          retention-days: 1
