name: Apply scanner follow-up
on:
  push:
    branches: [browser-scanner]
    paths: ['.followup/trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply reviewed follow-up atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff -s ours origin/master
          python - <<'PY'
          import base64,hashlib,io,struct,tarfile,zlib
          from pathlib import Path,PurePosixPath
          chunks=[Path(f'.followup/chunk-{i:02d}').read_bytes().strip() for i in range(7)]
          data=b''.join(chunks);raw=base64.b64decode(data+b'='*((-len(data))%4),validate=True)
          if hashlib.sha256(raw).hexdigest()!='b8a3f94494be7c937fd85b54ff69099ec93c45dfdad22a004df13a3fd1c02e46':raise SystemExit('staged payload changed')
          flags=raw[3];pos=10
          if flags&4:n=struct.unpack_from('<H',raw,pos)[0];pos+=2+n
          for bit in (8,16):
              if flags&bit:
                  end=raw.find(b'\0',pos)
                  if end<0:raise SystemExit('truncated gzip header')
                  pos=end+1
          if flags&2:pos+=2
          decoder=zlib.decompressobj(-zlib.MAX_WBITS);tar_bytes=decoder.decompress(raw[pos:])+decoder.flush()
          if not decoder.eof:raise SystemExit('incomplete DEFLATE payload')
          expected={'.','./benchmarks','./benchmarks/README.md','./scripts','./scripts/offline_query_smoke.cjs','./scripts/prune_tesseract_build.py','./.github','./.github/workflows','./.github/workflows/browser-tests.yml','./.github/workflows/browser-pages.yml','./web','./web/photo-flow.js','./web/style.css','./web/offline.js','./web/tests','./web/tests/final-hardening.test.js','./web/tests/cache-recovery.test.js','./web/model.js','./web/scan-analysis.js','./web/TESTING.md','./web/README.md','./web/index.html'}
          with tarfile.open(fileobj=io.BytesIO(tar_bytes),mode='r:') as tf:
              members=tf.getmembers();names={m.name for m in members}
              if names!=expected:raise SystemExit(f'unexpected members: {sorted(names^expected)}')
              for m in members:
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not(m.isdir() or m.isfile()):raise SystemExit(f'unsafe member: {m.name}')
                  if m.isfile():
                      f=tf.extractfile(m);content=f.read() if f else b''
                      if len(content)!=m.size:raise SystemExit(f'truncated member: {m.name}')
              tf.extractall('.',members=members,filter='data')
          print(f'validated payload; ignored {len(decoder.unused_data)} transport bytes')
          PY
          git checkout origin/master -- tests/review_parallel_probe.py benchmarks/README.md
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/app.js');s=p.read_text()
          def once(old,new,label):
              global s
              if s.count(old)!=1:raise SystemExit(f'{label}: expected one match, got {s.count(old)}')
              s=s.replace(old,new)
          once('  $("puzzle-type").value = p.type;\n','', 'board load must not rewrite next-scan type')
          once('const prefs = storage.get("gridpuzzle-settings-v1");','const prefs = storage.get("gridpuzzle-settings-v2") || storage.get("gridpuzzle-settings-v1");','settings migration read')
          once('storage.set("gridpuzzle-settings-v1", {','storage.set("gridpuzzle-settings-v2", {','settings v2 write')
          once('  isCage,\n  boxShape,\n} from "./model.js";','  isCage,\n  boxShape,\n  moveIndex,\n  hasCageRemoval,\n  hasInequalityRemoval,\n  checkSolveReady,\n} from "./model.js";','model helper imports')
          old='''  const delta = {\n    ArrowLeft: -1,\n    ArrowRight: 1,\n    ArrowUp: -state.puzzle.cols,\n    ArrowDown: state.puzzle.cols,\n  }[e.key];\n  if (delta) {\n    e.preventDefault();\n    focused = Math.max(0, Math.min(state.puzzle.cells.length - 1, i + delta));\n    drawBoard();\n    $("board").querySelector(`[data-cell="${focused}"]`).focus();\n  }'''
          new='''  if (e.key.startsWith("Arrow")) {\n    e.preventDefault();\n    const next = moveIndex(i, e.key, state.puzzle.rows, state.puzzle.cols);\n    if (next === i) return;\n    focused = next;\n    drawBoard();\n    $("board").querySelector(`[data-cell="${focused}"]`)?.focus();\n  }'''
          once(old,new,'authoritative keyboard navigation')
          old='''$("remove-cage").onclick = () =>\n  mutate(() => {\n    state.puzzle.cages = state.puzzle.cages.filter(\n      (q) => !q.cells.some((i) => state.selected.includes(i)),\n    );\n    state.selected = [];\n  });'''
          new='''$("remove-cage").onclick = () => {\n  if (!hasCageRemoval(state.puzzle, state.selected)) return;\n  mutate(() => {\n    state.puzzle.cages = state.puzzle.cages.filter(\n      (q) => !q.cells.some((i) => state.selected.includes(i)),\n    );\n    state.selected = [];\n  });\n};'''
          once(old,new,'no-op cage removal')
          old='''$("remove-inequality").onclick = () =>\n  mutate(() => {\n    state.puzzle.inequalities = state.puzzle.inequalities.filter(\n      (q) =>\n        !(\n          state.selected.includes(q.less) && state.selected.includes(q.greater)\n        ),\n    );\n    state.selected = [];\n  });'''
          new='''$("remove-inequality").onclick = () => {\n  if (!hasInequalityRemoval(state.puzzle, state.selected)) return;\n  mutate(() => {\n    state.puzzle.inequalities = state.puzzle.inequalities.filter(\n      (q) =>\n        !(\n          state.selected.includes(q.less) && state.selected.includes(q.greater)\n        ),\n    );\n    state.selected = [];\n  });\n};'''
          once(old,new,'no-op inequality removal')
          n,s=re.subn(r'(function requestSolve\(\)\s*\{\s*try\s*\{)',r'\1\n    checkSolveReady(state.puzzle);',s,count=1)
          if n!=1:raise SystemExit('requestSolve solve-ready insertion failed')
          n,s=re.subn(r'(function solveNow\(\)\s*\{\s*try\s*\{)',r'\1\n    checkSolveReady(state.puzzle);',s,count=1)
          if n!=1:raise SystemExit('solveNow solve-ready insertion failed')
          p.write_text(s)
          t=Path('web/tests/final-hardening.test.js');ts=t.read_text()
          ts+='''\n\ntest("production handlers use authoritative puzzle state",()=>{\n  const source=fs.readFileSync(new URL("../app.js",import.meta.url),"utf8");\n  assert.match(source,/moveIndex\\(i, e\\.key, state\\.puzzle\\.rows, state\\.puzzle\\.cols\\)/);\n  assert.match(source,/hasCageRemoval\\(state\\.puzzle, state\\.selected\\)/);\n  assert.match(source,/hasInequalityRemoval\\(state\\.puzzle, state\\.selected\\)/);\n  assert.ok((source.match(/checkSolveReady\\(state\\.puzzle\\)/g)||[]).length>=2);\n});\n'''
          t.write_text(ts)
          PY
          rm -f web/accessibility.js web/polish.css web/tests/followup-ui.test.js
          rm -rf .followup
          rm -f .github/workflows/apply-scanner-followup.yml
          git add -A
          git diff --cached --check
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --test web/tests/*.test.js
          git diff --cached --stat
          git commit -m 'Harden scanner trust, offline updates and phone UX; sync master'
          git push origin HEAD:browser-scanner
