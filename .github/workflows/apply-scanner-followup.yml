name: Apply scanner follow-up
on:
  push:
    branches: [browser-scanner]
    paths: ['.followup/trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed follow-up atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff -s ours origin/master
          python - <<'PY'
          import base64, hashlib, multiprocessing as mp
          from pathlib import Path

          expected = '8442a30b1c05fb75915e9167764e3d6847adfb1b6b557c401d5679ec89051684'
          chunks = [Path(f'.followup/chunk-{i:02d}').read_bytes().strip() for i in range(7)]
          sizes = [len(x) for x in chunks]
          if sizes != [9000, 9000, 9000, 8999, 9000, 9000, 3928]:
              raise SystemExit(f'unexpected staged chunk sizes: {sizes}')
          data = b''.join(chunks)
          if len(data) % 4 != 3:
              raise SystemExit('staged Base64 does not have the expected one-character deficit')
          start = sum(sizes[:3])
          stop = start + sizes[3]
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def probe(pos):
              prefix, suffix = data[:pos], data[pos:]
              for ch in alphabet:
                  candidate = prefix + bytes((ch,)) + suffix
                  try:
                      raw = base64.b64decode(candidate, validate=True)
                  except Exception:
                      continue
                  if hashlib.sha256(raw).hexdigest() == expected:
                      return pos, ch
              return None

          found = None
          with mp.Pool(processes=min(4, mp.cpu_count())) as pool:
              for result in pool.imap_unordered(probe, range(start, stop + 1), chunksize=8):
                  if result is not None:
                      found = result
                      pool.terminate()
                      break
          if found is None:
              raise SystemExit('could not recover the missing staged Base64 character')
          pos, ch = found
          repaired = data[:pos] + bytes((ch,)) + data[pos:]
          raw = base64.b64decode(repaired, validate=True)
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('recovered payload failed the pinned digest')
          Path('/tmp/gridpuzzle-followup.tar.gz').write_bytes(raw)
          print(f'recovered one missing Base64 character at offset {pos}: {chr(ch)!r}; pinned digest verified')
          PY
          tar -xzf /tmp/gridpuzzle-followup.tar.gz -C .
          rm -f web/accessibility.js web/polish.css web/tests/followup-ui.test.js
          rm -rf .followup
          rm -f .github/workflows/apply-scanner-followup.yml
          git add -A
          git commit -m 'Harden scanner trust, offline updates and phone UX; sync master'
          git push origin HEAD:browser-scanner
