name: Apply scanner follow-up
on:
  push:
    branches: [browser-scanner]
    paths: ['.followup/trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply reviewed follow-up atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff -s ours origin/master
          python - <<'PY'
          import base64, hashlib, tarfile
          from pathlib import Path, PurePosixPath

          expected = '8442a30b1c05fb75915e9167764e3d6847adfb1b6b557c401d5679ec89051684'
          chunks = [Path(f'.followup/chunk-{i:02d}').read_bytes().strip() for i in range(7)]
          data = b''.join(chunks)
          if len(data) % 4 != 3:
              raise SystemExit(f'unexpected staged Base64 length: {len(data)}')
          alphabet = b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          raw = None
          recovered = None
          for ch in alphabet:
              candidate = data + bytes((ch,))
              try:
                  decoded = base64.b64decode(candidate, validate=True)
              except Exception:
                  continue
              if hashlib.sha256(decoded).hexdigest() == expected:
                  raw = decoded
                  recovered = chr(ch)
                  break
          if raw is None:
              raise SystemExit('no final Base64 character recreates the original pinned archive')
          archive = Path('/tmp/gridpuzzle-followup.tar.gz')
          archive.write_bytes(raw)
          with tarfile.open(archive, 'r:gz') as tf:
              names = []
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe archive member type: {member.name}')
                  names.append(member.name)
              print('verified staged archive members:')
              print('\n'.join(names))
          print(f'recovered final Base64 character {recovered!r}; original pinned digest verified')
          PY
          gzip -t /tmp/gridpuzzle-followup.tar.gz
          tar -xzf /tmp/gridpuzzle-followup.tar.gz -C .
          rm -f web/accessibility.js web/polish.css web/tests/followup-ui.test.js
          rm -rf .followup
          rm -f .github/workflows/apply-scanner-followup.yml
          git add -A
          git diff --cached --check
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --test web/tests/*.test.js
          git commit -m 'Harden scanner trust, offline updates and phone UX; sync master'
          git push origin HEAD:browser-scanner
