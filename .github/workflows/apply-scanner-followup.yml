name: Apply scanner follow-up
on:
  push:
    branches: [browser-scanner]
    paths: ['.followup/trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply reviewed follow-up atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff -s ours origin/master
          python - <<'PY'
          import base64, hashlib, io, struct, tarfile, zlib
          from pathlib import Path, PurePosixPath

          # Transport lost/corrupted only the gzip trailer. Pin the exact staged
          # compressed bytes and require the raw DEFLATE stream itself to reach
          # its formal end marker before accepting any payload.
          expected_compressed = 'b8a3f94494be7c937fd85b54ff69099ec93c45dfdad22a004df13a3fd1c02e46'
          chunks = [Path(f'.followup/chunk-{i:02d}').read_bytes().strip() for i in range(7)]
          data = b''.join(chunks)
          repaired = data + b'=' * ((-len(data)) % 4)
          raw = base64.b64decode(repaired, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != expected_compressed:
              raise SystemExit(f'unexpected staged compressed payload: {digest}')
          if raw[:3] != b'\x1f\x8b\x08':
              raise SystemExit('staged payload is not gzip/deflate')

          flags = raw[3]
          pos = 10
          if flags & 4:  # FEXTRA
              if pos + 2 > len(raw): raise SystemExit('truncated gzip extra header')
              n = struct.unpack_from('<H', raw, pos)[0]
              pos += 2 + n
          for bit in (8, 16):  # FNAME, FCOMMENT
              if flags & bit:
                  end = raw.find(b'\0', pos)
                  if end < 0: raise SystemExit('truncated gzip string header')
                  pos = end + 1
          if flags & 2: pos += 2  # FHCRC
          if pos >= len(raw): raise SystemExit('gzip has no deflate body')

          decoder = zlib.decompressobj(-zlib.MAX_WBITS)
          tar_bytes = decoder.decompress(raw[pos:]) + decoder.flush()
          if not decoder.eof:
              raise SystemExit('DEFLATE body is incomplete; refusing staged payload')
          trailer = decoder.unused_data
          if len(trailer) > 8:
              raise SystemExit(f'unexpected bytes after gzip stream: {len(trailer)}')
          crc = zlib.crc32(tar_bytes) & 0xffffffff
          size = len(tar_bytes) & 0xffffffff
          if len(trailer) >= 8:
              stored_crc, stored_size = struct.unpack('<II', trailer[:8])
              print(f'gzip trailer mismatch isolated: stored crc={stored_crc:08x} size={stored_size}; computed crc={crc:08x} size={size}')
          else:
              print(f'gzip trailer truncated to {len(trailer)} byte(s); computed crc={crc:08x} size={size}')

          expected_names = {
              '.', './benchmarks', './benchmarks/README.md', './scripts',
              './scripts/offline_query_smoke.cjs', './scripts/prune_tesseract_build.py',
              './.github', './.github/workflows', './.github/workflows/browser-tests.yml',
              './.github/workflows/browser-pages.yml', './web', './web/photo-flow.js',
              './web/style.css', './web/offline.js', './web/tests',
              './web/tests/final-hardening.test.js', './web/tests/cache-recovery.test.js',
              './web/model.js', './web/scan-analysis.js', './web/TESTING.md',
              './web/README.md', './web/index.html'
          }
          with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:') as tf:
              members = tf.getmembers()
              names = {m.name for m in members}
              if names != expected_names:
                  raise SystemExit(f'unexpected staged archive members: {sorted(names ^ expected_names)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsafe archive member type: {member.name}')
          Path('/tmp/gridpuzzle-followup.tar').write_bytes(tar_bytes)
          print(f'complete DEFLATE payload verified; tar sha256={hashlib.sha256(tar_bytes).hexdigest()}')
          PY
          tar -xf /tmp/gridpuzzle-followup.tar -C .
          # The ancestry sync uses the ours strategy to avoid replaying already-
          # identical solver patches. Restore the two master-only bookkeeping/test
          # files explicitly so content as well as ancestry is current.
          git checkout origin/master -- tests/review_parallel_probe.py benchmarks/README.md
          rm -f web/accessibility.js web/polish.css web/tests/followup-ui.test.js
          rm -rf .followup
          rm -f .github/workflows/apply-scanner-followup.yml
          git add -A
          git diff --cached --check
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --test web/tests/*.test.js
          git commit -m 'Harden scanner trust, offline updates and phone UX; sync master'
          git push origin HEAD:browser-scanner
