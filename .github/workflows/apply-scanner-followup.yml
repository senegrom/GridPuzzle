name: Apply scanner follow-up
on:
  push:
    branches: [browser-scanner]
    paths: ['.followup/trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply reviewed follow-up atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff -s ours origin/master
          python - <<'PY'
          import base64, hashlib, io, struct, tarfile, zlib
          from pathlib import Path, PurePosixPath
          expected_compressed='b8a3f94494be7c937fd85b54ff69099ec93c45dfdad22a004df13a3fd1c02e46'
          chunks=[Path(f'.followup/chunk-{i:02d}').read_bytes().strip() for i in range(7)]
          data=b''.join(chunks);raw=base64.b64decode(data+b'='*((-len(data))%4),validate=True)
          if hashlib.sha256(raw).hexdigest()!=expected_compressed:raise SystemExit('staged compressed payload changed')
          if raw[:3]!=b'\x1f\x8b\x08':raise SystemExit('staged payload is not gzip/deflate')
          flags=raw[3];pos=10
          if flags&4:
              if pos+2>len(raw):raise SystemExit('truncated gzip extra header')
              n=struct.unpack_from('<H',raw,pos)[0];pos+=2+n
          for bit in (8,16):
              if flags&bit:
                  end=raw.find(b'\0',pos)
                  if end<0:raise SystemExit('truncated gzip string header')
                  pos=end+1
          if flags&2:pos+=2
          decoder=zlib.decompressobj(-zlib.MAX_WBITS);tar_bytes=decoder.decompress(raw[pos:])+decoder.flush()
          if not decoder.eof:raise SystemExit('DEFLATE body is incomplete; refusing staged payload')
          expected_names={'.','./benchmarks','./benchmarks/README.md','./scripts','./scripts/offline_query_smoke.cjs','./scripts/prune_tesseract_build.py','./.github','./.github/workflows','./.github/workflows/browser-tests.yml','./.github/workflows/browser-pages.yml','./web','./web/photo-flow.js','./web/style.css','./web/offline.js','./web/tests','./web/tests/final-hardening.test.js','./web/tests/cache-recovery.test.js','./web/model.js','./web/scan-analysis.js','./web/TESTING.md','./web/README.md','./web/index.html'}
          with tarfile.open(fileobj=io.BytesIO(tar_bytes),mode='r:') as tf:
              members=tf.getmembers();names={m.name for m in members}
              if names!=expected_names:raise SystemExit(f'unexpected archive members: {sorted(names^expected_names)}')
              for m in members:
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not(m.isdir() or m.isfile()):raise SystemExit(f'unsafe archive member: {m.name}')
                  if m.isfile():
                      fh=tf.extractfile(m);content=fh.read() if fh else b''
                      if len(content)!=m.size:raise SystemExit(f'truncated archive member: {m.name}')
              tf.extractall('.',members=members,filter='data')
          print(f'validated reviewed payload; isolated {len(decoder.unused_data)} trailing transport bytes; tar sha256={hashlib.sha256(tar_bytes).hexdigest()}')
          PY
          git checkout origin/master -- tests/review_parallel_probe.py benchmarks/README.md
          # Loading a board must not silently rewrite the preference used for the
          # next camera scan. Require exactly one old assignment before removing it.
          python - <<'PY'
          from pathlib import Path
          p=Path('web/app.js');s=p.read_text();needle='  $("puzzle-type").value = p.type;\n'
          if s.count(needle)!=1:raise SystemExit(f'unexpected puzzle-type assignment count: {s.count(needle)}')
          p.write_text(s.replace(needle,''))
          PY
          echo '--- new authoritative helpers ---'
          grep -nE 'export function (moveIndex|hasCageRemoval|hasInequalityRemoval|validateSolveReady)' web/model.js || true
          echo '--- production handlers still to wire ---'
          grep -nE 'onkeydown|remove-cage|remove-inequality' web/app.js || true
          rm -f web/accessibility.js web/polish.css web/tests/followup-ui.test.js
          rm -rf .followup
          rm -f .github/workflows/apply-scanner-followup.yml
          git add -A
          git diff --cached --check
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --test web/tests/*.test.js
          git diff --cached --stat
          git commit -m 'Harden scanner trust, offline updates and phone UX; sync master'
          git push origin HEAD:browser-scanner
