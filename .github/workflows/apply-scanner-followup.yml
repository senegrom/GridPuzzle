name: Apply scanner follow-up
on:
  push:
    branches: [browser-scanner]
    paths: ['.followup/trigger']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed follow-up atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git merge --no-commit --no-ff -s ours origin/master
          python - <<'PY'
          import base64, hashlib
          from pathlib import Path

          expected = '8442a30b1c05fb75915e9167764e3d6847adfb1b6b557c401d5679ec89051684'
          chunks = [Path(f'.followup/chunk-{i:02d}').read_bytes().strip() for i in range(7)]
          data = b''.join(chunks)
          # The staged stream lost only terminal Base64 padding in transport.
          # Restore standard padding, then trust it only if the original pinned
          # archive digest matches exactly.
          repaired = data + b'=' * ((-len(data)) % 4)
          raw = base64.b64decode(repaired, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != expected:
              raise SystemExit(f'reconstructed payload digest mismatch: {digest}')
          Path('/tmp/gridpuzzle-followup.tar.gz').write_bytes(raw)
          print(f'payload reconstructed with {len(repaired)-len(data)} padding byte(s); pinned digest verified')
          PY
          tar -xzf /tmp/gridpuzzle-followup.tar.gz -C .
          rm -f web/accessibility.js web/polish.css web/tests/followup-ui.test.js
          rm -rf .followup
          rm -f .github/workflows/apply-scanner-followup.yml
          git add -A
          git commit -m 'Harden scanner trust, offline updates and phone UX; sync master'
          git push origin HEAD:browser-scanner
