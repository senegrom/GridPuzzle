name: Live refinement source snapshot
on:
  push:
    branches: [improve/live-worker-recovery-diagnostics-20260919]
    paths: [.github/workflows/live-refinement-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-scanner
      - run: node scripts/live_refinement_probe.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-refinement-probe
          path: browser-artifacts
          retention-days: 1
