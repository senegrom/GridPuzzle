name: Live refinement source snapshot
on:
  push:
    branches: [improve/live-worker-recovery-diagnostics-20260919]
    paths: [.github/workflows/live-refinement-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: |
          git archive HEAD -o /tmp/live-refinement-source.tar
          git rev-parse HEAD > /tmp/live-refinement-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: live-refinement-source
          path: /tmp/live-refinement-*
          retention-days: 1
