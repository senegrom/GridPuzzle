name: Explicit per-solve depth gating migration v5

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/depth-gate-migration.yml

permissions:
  contents: write

concurrency:
  group: explicit-depth-gate-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("run.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        max_sols=args.max_solutions,\n"
              "        processes=args.processes,\n"
              "    )\n"
          )
          normalized = (
              "        max_sols=args.max_solutions,\n"
              "        processes=args.processes,\n"
              "        )\n"
          )
          if old not in text:
              raise SystemExit("CLI solve call not found")
          path.write_text(text.replace(old, normalized, 1), encoding="utf-8")
          PY
          python .github/scripts/depth_gate_migration.py
          python - <<'PY'
          from pathlib import Path

          path = Path("run.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        max_sols=args.max_solutions,\n"
              "        processes=args.processes,\n"
              "        depth_gate=args.depth_gate,\n"
              "        )\n"
          )
          formatted = (
              "        max_sols=args.max_solutions,\n"
              "        processes=args.processes,\n"
              "        depth_gate=args.depth_gate,\n"
              "    )\n"
          )
          if old not in text:
              raise SystemExit("Migrated CLI solve call not found")
          path.write_text(text.replace(old, formatted, 1), encoding="utf-8")

          test_path = Path("tests/test_trail.py")
          tests = test_path.read_text(encoding="utf-8")
          old_helper = "    def fake_propagation(branch: Grid) -> SolveStatus:\n"
          new_helper = (
              "    def fake_propagation(\n"
              "        branch: Grid,\n"
              "        depth_gate: int | None = None,\n"
              "    ) -> SolveStatus:\n"
          )
          if old_helper not in tests:
              raise SystemExit("Forcing-chain test helper not found")
          test_path.write_text(
              tests.replace(old_helper, new_helper, 1),
              encoding="utf-8",
          )

          validation_path = Path("tests/test_solution_validation.py")
          validation = validation_path.read_text(encoding="utf-8")
          old_lambda = (
              "        lambda grid, steps, max_sols, checked: {invalid},\n"
          )
          new_lambda = (
              "        lambda grid, steps, max_sols, checked, depth_gate=None: {invalid},\n"
          )
          if old_lambda not in validation:
              raise SystemExit("Solution-validation monkeypatch not found")
          validation_path.write_text(
              validation.replace(old_lambda, new_lambda, 1),
              encoding="utf-8",
          )
          PY

      - name: Install and validate explicit solve options
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_solver_api.py \
            tests/test_differential.py \
            tests/test_trail.py \
            tests/test_regressions.py \
            tests/test_rule_metadata.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_rule_metadata.py \
            tests/test_basic.py \
            tests/test_scale.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Commit tested source and remove migration files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git rm \
            .github/workflows/depth-gate-migration.yml \
            .github/scripts/depth_gate_migration.py
          git add \
            gridsolver/solver/atomic_solver.py \
            gridsolver/solver/solve_forcing_chain.py \
            gridsolver/solver/solver.py \
            gridsolver/solver/solve_parallel.py \
            run.py \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_differential.py \
            tests/test_trail.py \
            tests/test_solution_validation.py \
            tests/test_basic.py \
            README.md \
            DEVELOPMENT.md \
            TODO.md
          git diff --cached --check
          git commit -m "Make depth gating an explicit solve option"
          git push origin HEAD:master
