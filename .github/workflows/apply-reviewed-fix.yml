name: Apply reviewed live refinements
on:
  push:
    branches: ['improve/live-worker-recovery-diagnostics-20260919']
    paths: ['.github/workflows/apply-reviewed-fix.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check exact patch, source tree and content permissions
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          files=['.github/workflows/live-feature-refinement.yml','.github/workflows/apply-reviewed-fix.yml']
          changed=subprocess.check_output(['git','diff','--name-only','dd75bde458955a954414b2bde0a39f910447fbe6','HEAD'],text=True).splitlines()
          assert set(changed)==set(files),'Branch changed; do not overwrite it'
          text=pathlib.Path(files[0]).read_text().split("payload='")[1].split("'\n")[0]
          text=text.replace('JR+kxUwt','JR+kxU/+kUwt')
          patch=gzip.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a3385b48f9255e0011de2441467d11da1a4bb41d1ebe8486ed1e15b641ae7d69'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          saved={f:pathlib.Path(f).read_bytes() for f in files}
          for f in files:pathlib.Path(f).unlink()
          subprocess.run(['git','add','-A'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='3f01dae03f0ae4e1d02adafdd7d4da20de7db268'
          for f,data in saved.items():pathlib.Path(f).write_bytes(data)
          subprocess.run(['git','add',*files],check=True)
          PY
      - name: Run complete unit suite and push content-only commit
        run: |
          node --test --test-concurrency=1 web/tests/*.test.js
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Pair accelerated browser tests with real worker completion and keep diagnostic evidence current'
          git push origin HEAD:refs/heads/improve/live-worker-recovery-diagnostics-20260919
