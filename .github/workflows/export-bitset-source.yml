name: Export bitset experiment source

on:
  push:
    branches:
      - agent/broaden-candidate-bitsets
    paths:
      - .github/workflows/export-bitset-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gridpuzzle-bitset-source
          path: .
          include-hidden-files: true
          retention-days: 2
