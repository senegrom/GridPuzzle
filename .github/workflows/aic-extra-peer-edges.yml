name: Evaluate additive AIC non-house visibility

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/aic-extra-peer-edges.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aic-extra-peer-edges
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply additive AIC visibility candidate
        run: python .github/scripts/apply_aic_extra_peer_edges.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_aic_extra_visibility.py \
            tests/test_topology_cache_lifecycle.py \
            tests/test_rule_only_cache.py \
            tests/test_differential.py \
            tests/test_action_dispatch.py \
            tests/test_hotpath_regressions.py \
            tests/test_regressions.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=15

      - name: Benchmark unchanged standard fast path
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/aic-extra-baseline HEAD^
          python .github/scripts/benchmark_aic_extra_peer_edges.py \
            --baseline /tmp/aic-extra-baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --json /tmp/aic-extra-result.json \
            --report benchmarks/aic_extra_peer_edges_2026-08-09.md \
            --marker /tmp/aic-extra-promote

      - name: Promote or reject and remove experiment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/aic-extra-promote ]]; then
            message="Add missing non-house AIC weak edges"
          else
            git checkout HEAD^ -- \
              gridsolver/solver/candidate_topology.py \
              gridsolver/solver/solve_aic.py
            rm -f tests/test_aic_extra_visibility.py
            message="Record rejected additive AIC visibility benchmark"
          fi

          rm -f \
            .github/scripts/apply_aic_extra_peer_edges.py \
            .github/scripts/benchmark_aic_extra_peer_edges.py \
            .github/workflows/aic-extra-peer-edges.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$message"
          git pull --rebase origin master
          git push origin HEAD:master
