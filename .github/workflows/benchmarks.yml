name: Solver Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/benchmarks.yml
      - benchmarks/depth_gate.py
  schedule:
    - cron: "41 4 1 * *"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  depth-gates:
    name: Depth-gate solution equivalence and timings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run depth-gate benchmark
        run: python -X dev benchmarks/depth_gate.py

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: depth-gate-results
          path: benchmark-results.json
          if-no-files-found: error
          retention-days: 30
