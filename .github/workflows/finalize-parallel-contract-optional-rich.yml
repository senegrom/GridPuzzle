name: Finalize parallel contract and optional Rich

on:
  push:
    branches:
      - agent/parallel-contract-and-optional-rich

permissions:
  contents: write

concurrency:
  group: finalize-parallel-contract-and-optional-rich
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the reviewed patch and remove delivery files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/parallel-contract-optional-rich.patch
          git apply .github/patches/parallel-contract-optional-rich.patch
          rm -f \
            .github/patches/parallel-contract-optional-rich.patch \
            .github/workflows/finalize-parallel-contract-optional-rich.yml
          git diff --check

      - name: Validate a minimal default installation
        shell: bash
        run: |
          set -euo pipefail
          MIN_ENV="$RUNNER_TEMP/gridpuzzle-minimal"
          python -m venv "$MIN_ENV"
          "$MIN_ENV/bin/python" -m pip install --upgrade pip
          "$MIN_ENV/bin/python" -m pip install .
          "$MIN_ENV/bin/python" - <<'PY'
          import importlib.util

          if importlib.util.find_spec("rich") is not None:
              raise SystemExit("Rich was installed by the default dependency set")

          from gridsolver.solver.logger import Colouring, set_colouring

          set_colouring(Colouring.No)
          try:
              set_colouring(Colouring.Rich)
          except ImportError as exc:
              if "gridpuzzle-solver[rich]" not in str(exc):
                  raise
          else:
              raise SystemExit("Rich colouring unexpectedly succeeded")
          PY

      - name: Install, package, and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help >/dev/null
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Run every bounded test
        run: python -X dev -m pytest -q tests -m "not slow" --durations=15

      - name: Verify and publish the tested source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          import tomllib

          expected = {
              ".github/patches/parallel-contract-optional-rich.patch",
              ".github/workflows/finalize-parallel-contract-optional-rich.yml",
              "README.md",
              "TODO.md",
              "gridsolver/solver/logger.py",
              "gridsolver/solver/solve_parallel.py",
              "gridsolver/solver/solver.py",
              "pyproject.toml",
              "tests/test_cli_and_loading.py",
              "tests/test_solver_api.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"unexpected finalization diff: {sorted(changed ^ expected)}"
              )

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          if "rich>=13.0" in project["dependencies"]:
              raise SystemExit("Rich remains a mandatory dependency")
          optional = project["optional-dependencies"]
          if optional.get("rich") != ["rich>=13.0"]:
              raise SystemExit("Rich optional extra is not exact")
          if "rich>=13.0" not in optional["dev"]:
              raise SystemExit("Development extra no longer exercises Rich")
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct capped parallel contract and make Rich optional"
          git push origin "HEAD:$GITHUB_REF_NAME"
