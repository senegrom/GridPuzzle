name: Build and deploy phone scanner
on:
  push:
    branches: [master]
    # Documentation and benchmark records do not change the built app.
    paths-ignore:
      - "**/*.md"
      - "benchmarks/**"
  pull_request:
    paths: ["web/**", "scripts/**", ".github/workflows/browser-pages.yml", "gridsolver/**", "pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridpuzzle-browser-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-scanner
      - run: python -m pip install -e '.[dev]'
      # The bounded Python suite runs in CI on every push and pull request, and
      # the browser unit tests run in "Browser branch tests" on every pull
      # request; on a master push this is the only place the latter run.
      - name: Geometry and model tests
        if: github.event_name == 'push'
        run: node --test web/tests/*.test.js
      - name: Retain build for independent testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-static-build
          path: _site
          retention-days: 2
      - name: Live camera overlays and saved-picture regressions
        run: node scripts/live_camera_regressions.cjs
      - name: OCR latency and engine reuse regressions
        run: node scripts/ocr_latency_regressions.cjs
      - name: Cross-tab solver update regressions
        run: node scripts/solver_update_regressions.cjs
      - name: Chromium and mobile WebKit acceptance tests
        run: node scripts/browser_smoke.cjs
      - name: Scanner settings and type-correction regressions
        run: node scripts/scanner_settings_regressions.cjs
      - name: Scanner repair regressions
        run: node scripts/scanner_repair_regressions.cjs
      - name: Photo Read transaction regressions
        run: node scripts/photo_read_regressions.cjs
      - name: Play mode and solver warm-up regressions
        run: node scripts/play_regressions.cjs
      - name: Play confirmation, uniqueness and cancellation regressions
        run: node scripts/play_safety_regressions.cjs
      - name: Scanner variation, review and real-newspaper regressions
        run: |
          node scripts/browser_regressions.cjs
          node scripts/newspaper_regressions.cjs
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-report
          path: browser-artifacts
          if-no-files-found: ignore
      - name: Upload static Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
  live-acceptance:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scanner-static-build
          path: _site
      - uses: ./.github/actions/setup-scanner
        with:
          build: "false"
      - name: Verify exact deployment build
        run: node -e "const fs=require('node:fs');if(JSON.parse(fs.readFileSync('_site/build-info.json')).build!==process.env.GITHUB_SHA.slice(0,12))process.exit(1)"
      - name: Fetch bounded external picture tests
        run: python scripts/fetch_live_fixtures.py
      - name: Moving-video acceptance before deployment
        run: node scripts/live_motion_regressions.cjs
      - name: Integrated backup, preferences and modal regressions
        run: node scripts/app_review_regressions.cjs
      - name: Background tracking, targeted reads and diagnostic privacy
        run: node scripts/live_features_regressions.cjs
      - name: Real degraded-to-clear live recovery and stalled-frame safety
        run: node scripts/live_recovery_regressions.cjs
      - name: Clue editor re-read proposals and confirmation
        run: node scripts/editor_reread_regressions.cjs
      - name: Repeated-session worker and image ownership soak
        run: node scripts/live_soak_regressions.cjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: deployed-live-acceptance
          path: browser-artifacts
          retention-days: 7
  configure:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Explain the one-time repository setting
        if: failure()
        run: |
          echo '::error::Pages is not enabled for Actions. A repository owner must set Settings > Pages > Source to GitHub Actions, then re-run this job. The workflow token cannot grant itself repository administration permission.'
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: [build, configure, live-acceptance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The default Pages environment only accepts deployments from master.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested branch artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
