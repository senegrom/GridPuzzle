name: Temporary free-threaded parallel candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/free-threaded-parallel-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-threaded-parallel-candidate
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  correctness-and-timings:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14t"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        shell: bash
        run: |
          set -euo pipefail
          python -VV
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Free-threaded correctness checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import sysconfig

          assert sysconfig.get_config_var("Py_GIL_DISABLED") == 1
          assert not sys._is_gil_enabled()
          PY
          python -X dev -m pytest -q \
            tests/test_solver_api.py \
            tests/test_differential.py \
            -m "not slow" \
            --durations=10

      - name: Compare process and thread pools
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/free_threaded_parallel_harness.py \
            --case fanout1000 --repeats 5 --workers 2
          python .github/scripts/free_threaded_parallel_harness.py \
            --case blank4_cap1 --repeats 3 --workers 2
          python .github/scripts/free_threaded_parallel_harness.py \
            --case blank4_all --repeats 2 --workers 2
          python .github/scripts/free_threaded_parallel_harness.py \
            --case nonsquare6_cap20 --repeats 2 --workers 2
