name: Promote correctness and debloat review

on:
  push:
    branches:
      - agent/correctness-debloat-review-2026-08-12
    paths:
      - .github/workflows/promote-correctness-review.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: correctness-debloat-review
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          encoded = Path(
              ".github/patches/correctness-debloat-review.b85"
          ).read_text(encoding="ascii").strip()
          Path("/tmp/correctness-review.patch").write_bytes(
              zlib.decompress(base64.b85decode(encoded.encode("ascii")))
          )
          PY
          git apply --check /tmp/correctness-review.patch
          git apply /tmp/correctness-review.patch
          git diff --check

      - name: Install, build, and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help >/dev/null
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Run complete bounded suite
        run: python -X dev -m pytest -q tests -m "not slow" --durations=20

      - name: Publish reviewed source and tests
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patches/correctness-debloat-review.b85
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix indexing, CSP parsing, rule identity, and import bloat"
          git push origin "HEAD:$GITHUB_REF_NAME"
