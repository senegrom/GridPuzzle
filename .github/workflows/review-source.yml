name: Reconcile reviewed branch with concurrent master
on:
  push:
    branches: [fix/repo-review-20260929]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: write
concurrency:
  group: apply-repo-review-20260929
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'senegrom/GridPuzzle' && github.ref == 'refs/heads/fix/repo-review-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Merge the exact concurrent master and reconcile only its changed paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          base=d2a6d7e99a337e350cce79d3d91f1621e757066c
          test "$(git rev-parse $base^{tree})" = a26b90db5f06624c5681e0974379eb0c52f1808f
          git merge --no-commit --no-ff "$base" || test "$(cat .git/MERGE_HEAD)" = "$base"
          git restore --source="$base" --staged --worktree -- corpus/SOURCES.md corpus/benchmark-runner.cjs corpus/benchmark.cjs corpus/score.cjs web/OCR_QUALITY.md web/TESTING.md web/tests/corpus-benchmark.test.js web/tests/corpus-runner.test.js
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          sha = '6a937783d35d28a6900dc7a8d82d7c32f34a071c'
          result = json.loads(subprocess.check_output(['gh', 'api', 'repos/senegrom/GridPuzzle/git/blobs/' + sha]))
          data = base64.b64decode(result['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == 'c574fe3cb63f47cfa17b5a8295072623f6465c42329f8c1e26f1036ec345ca9c'
          pathlib.Path('/tmp/reconcile.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '/tmp/reconcile.patch'], check=True)
          PY
          git diff --cached --check
          test -z "$(git ls-files -u)"
          cp .git/index /tmp/final-index
          GIT_INDEX_FILE=/tmp/final-index git rm --cached .github/workflows/review-source.yml
          test "$(GIT_INDEX_FILE=/tmp/final-index git write-tree)" = 472b26000221560ecc8a0fb11d5d88a82e45b853
      - name: Test the reconciled tree before publishing
        run: |
          mkdir -p /tmp/review-output
          node --version
          node --test web/tests/*.test.js > /tmp/review-output/node-tests.log 2>&1
          tail -12 /tmp/review-output/node-tests.log
          node --check corpus/benchmark.cjs
          node --check corpus/benchmark-runner.cjs
          node --check scripts/editor_reread_regressions.cjs
      - name: Commit both parents and fast-forward only the fix branch
        run: |
          test "$GITHUB_REF" = refs/heads/fix/repo-review-20260929
          git commit -m "Merge concurrent benchmark v4 update and preserve reference-input provenance"
          git push origin HEAD:refs/heads/fix/repo-review-20260929
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: review-merged-tests
          path: /tmp/review-output
          retention-days: 7
          if-no-files-found: ignore
