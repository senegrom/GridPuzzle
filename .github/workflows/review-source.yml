name: Apply reviewed branch fixes
on:
  push:
    branches: [fix/repo-review-20260929]
    paths: [.github/workflows/review-source.yml]
permissions:
  contents: write
concurrency:
  group: apply-repo-review-20260929
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'senegrom/GridPuzzle' && github.ref == 'refs/heads/fix/repo-review-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply the hash-pinned patch from repository blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          blobs = ['05fb8b02ce9360b8e45ca11f802fafecb73b236b', '9bea6ea964473b7877db0c22b1413e55fa8ccc7b', 'cc286ca9a37d371454a39bd689a13738470aa268', '5ee1c997f0902b6c975c572028a16161cc5333a2']
          parts = []
          for sha in blobs:
              result = json.loads(subprocess.check_output(['gh', 'api', 'repos/senegrom/GridPuzzle/git/blobs/' + sha]))
              data = base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              parts.append(data)
          patch = lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest() == '674bf186fe1aa51e643ec3f3e37287bbc26315d54d663c6e2927412a34a7e9f8'
          pathlib.Path('/tmp/review.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', '--unidiff-zero', '/tmp/review.patch'], check=True)
          PY
          git diff --cached --check
          cp .git/index /tmp/review-final-index
          GIT_INDEX_FILE=/tmp/review-final-index git rm --cached .github/workflows/review-source.yml
          test "$(GIT_INDEX_FILE=/tmp/review-final-index git write-tree)" = c0a230e8436061047561f95b3ba28fbfd0e2b97e
      - name: Run all JavaScript regressions and syntax checks
        run: |
          mkdir -p /tmp/review-output
          node --version
          node --test web/tests/*.test.js > /tmp/review-output/node-tests.log 2>&1
          tail -12 /tmp/review-output/node-tests.log
          find web -name '*.js' -not -path '*/vendor/*' -print0 | xargs -0 -n1 node --check
          node --check scripts/editor_reread_regressions.cjs
      - name: Commit tested changes without modifying master or force-pushing
        run: |
          test "$GITHUB_REF" = refs/heads/fix/repo-review-20260929
          git config user.name senegrom
          git config user.email 6349874+senegrom@users.noreply.github.com
          git commit -m "Fix review findings: bounded photo and update work, cage limits, OCR reuse and benchmark provenance"
          git push origin HEAD:refs/heads/fix/repo-review-20260929
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: review-fix-tests
          path: /tmp/review-output
          retention-days: 7
          if-no-files-found: ignore
