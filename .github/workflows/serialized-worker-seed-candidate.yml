name: Temporary serialized worker seed candidate

# Candidate patch revision 4: repeated real-puzzle timings.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/serialized-worker-seed-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serialized-worker-seed-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  correctness:
    name: Correctness / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply serialized worker seed candidate
        run: python .github/scripts/apply_serialized_seed_candidate.py

      - name: Install and run focused correctness checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests .github/scripts
          python .github/scripts/serialized_seed_harness.py --unit
          python -X dev -m pytest -q tests/test_solver_api.py tests/test_trail.py tests/test_regressions.py::test_parallel_trials_work_with_python_314_start_methods tests/test_hardening.py::test_capped_solution_subset_is_deterministic_across_process_modes tests/test_runtime_overhead.py::test_parallel_workers_return_and_merge_power_statistics --durations=10

  benchmark:
    name: Linux timings
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply serialized worker seed candidate
        run: python .github/scripts/apply_serialized_seed_candidate.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compare timings and solution sets
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^

          run_case() {
            local directory="$1"
            local case="$2"
            local repeats="$3"
            (cd "$directory" && PYTHONPATH="$directory" python \
              "$GITHUB_WORKSPACE/.github/scripts/serialized_seed_harness.py" \
              --case "$case" --repeats "$repeats")
          }

          for specification in blank4_cap1:5 blank4_all:3 nonsquare6_cap20:2; do
            case="${specification%%:*}"
            repeats="${specification##*:}"
            baseline="$(run_case /tmp/baseline "$case" "$repeats")"
            candidate="$(run_case "$GITHUB_WORKSPACE" "$case" "$repeats")"
            echo "BASELINE ${baseline}"
            echo "CANDIDATE ${candidate}"
            BASELINE="$baseline" CANDIDATE="$candidate" python - <<'PY'
          import json
          import os

          baseline = json.loads(os.environ["BASELINE"])
          candidate = json.loads(os.environ["CANDIDATE"])
          if baseline["digest"] != candidate["digest"]:
              raise SystemExit("baseline and candidate solution hashes differ")
          if baseline["cardinality"] != candidate["cardinality"]:
              raise SystemExit("baseline and candidate cardinalities differ")
          change = 100 * (candidate["median"] / baseline["median"] - 1)
          print(f"CHANGE {baseline['case']}: {change:+.2f}%")
          PY
          done
