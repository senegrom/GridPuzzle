name: Review three browser verification
on:
  push:
    branches: [fix/review3-browser]
    paths: ['.review3_*.py', '.github/workflows/review3-browser.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/review3-browser
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - name: Preserve concurrent scanner changes in a real merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .review3_reconcile.py
      - name: Format reconciled first-party sources
        run: npx --yes --package=prettier@3.6.2 prettier --write 'web/**/*.js' 'web/*.html' 'scripts/browser_smoke.cjs' 'scripts/browser_regressions.cjs'
      - name: Browser unit and lifecycle regressions
        run: node --test web/tests/*.test.js
      - name: Native adapter and complete bounded regressions
        run: python -X dev -m pytest -q tests -m 'not slow' --durations=10
      - name: Build the self-hosted application
        run: python scripts/build_web.py
      - name: Install actual browser runtimes
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Actual Python, OCR, recovery, cancellation and upstream scan variations
        run: |
          node scripts/browser_smoke.cjs
          node scripts/browser_regressions.cjs
      - name: Preserve browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review3-browser-results
          path: browser-artifacts
          if-no-files-found: ignore
      - name: Commit tested reconciliation and evidence
        run: |
          cp browser-artifacts/results.json benchmarks/review3_browser.json
          cp browser-artifacts/recognition-regressions.json benchmarks/review3_recognition.json
          git add web scripts tests benchmarks/review3_browser.json benchmarks/review3_recognition.json
          git diff --cached --check
          git commit -m 'Merge concurrent scanner improvements while retaining safe lifecycle and exact solver fixes'
          git push origin HEAD:fix/review3-browser
