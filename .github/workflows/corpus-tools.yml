name: Corpus tools
on:
  push:
    paths:
      - 'corpus/**'
      - 'tests/test_corpus*.py'
      - 'tests/test_parse_janko.py'
      - 'web/tests/corpus*.test.js'
      - 'pyproject.toml'
      - '.github/workflows/corpus-tools.yml'
  pull_request:
    paths:
      - 'corpus/**'
      - 'tests/test_corpus*.py'
      - 'tests/test_parse_janko.py'
      - 'web/tests/corpus*.test.js'
      - 'pyproject.toml'
      - '.github/workflows/corpus-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install tooling dependencies
        run: python -m pip install -e '.[dev,corpus]'
      - name: Corpus targets, rebuilds and rendering
        shell: bash
        run: python -X dev -m pytest -q tests/test_corpus*.py tests/test_parse_janko.py --junitxml=corpus-results.xml
      - name: Benchmark regression tests
        shell: bash
        run: node --test web/tests/corpus*.test.js
      - name: Archive exact tested source
        if: always()
        run: git archive --format=tar --output=corpus-source.tar HEAD
      - name: Retain results and source
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-tools-${{ matrix.os }}
          path: |
            corpus-results.xml
            corpus-source.tar
          retention-days: 7
