name: Full new-family corpus audit

on:
  push:
    branches:
      - agent/add-hidato-kakuro-numbrix-slitherlink
    paths:
      - .github/workflows/full-new-family-corpus.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-new-family-corpus-audit
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  corpus:
    name: ${{ matrix.family }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        family: [hidato, numbrix, kakuro, slitherlink]
        shard: [0, 1, 2, 3]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Solve isolated corpus shard
        run: >-
          python scripts/run_new_family_corpus.py
          --family "${{ matrix.family }}"
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
          --case-timeout 60
          --output "artifacts/${{ matrix.family }}-${{ matrix.shard }}.json"

      - name: Upload result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.family }}-${{ matrix.shard }}
          path: artifacts/${{ matrix.family }}-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30
