name: Final path guarantee validation

on:
  push:
    branches:
      - agent/path-guarantees-correctness
    paths:
      - .github/workflows/path-guarantee-final-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: path-guarantee-final-validation
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install and compile
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
      - name: Run correctness surface
        run: >-
          python -X dev -m pytest -q
          tests/test_path_guarantees.py
          tests/test_new_puzzle_families.py
          tests/test_solution_validation.py
          tests/test_rule_metadata.py
          tests/test_guarantee_filter_cache.py
          tests/test_hotpath_regressions.py
          tests/test_extension_validation.py
          tests/test_trail.py
          tests/test_solver_api.py
          tests/test_differential.py
          tests/test_candidate_domain.py
          tests/test_candidate_view.py
          tests/test_examples_2.py
          -m "not slow"
          --durations=20
      - name: Compare exact master and retained path corpus
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline origin/master
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path
          encoded = '''c-qYx+iu&)^<7^v%f-T^mtrJ!lNLf%!1a1J0h+{!(}zMU&@?%+xuHlchjips1oR{Nh5eGAGZ)T<lI&!+XbmJHXXaey%()Le&pWT`nx;)j85`av4b8|6Ez`SIQhy-JswRxm3<h83S<+O`-n6TmI^U4nHmQ@cp_E0Q=M4tSx>}JqUbanJ(>NyiYF*V0Ny@Tnk|wW8HW;X}`gWbvjH>s$gxwYSje7l=Ri%1fCC#0Bu9$jah><mUsz=(JbzP;fg>K}537*z~0<bHFE)gT2Xdc#id8@|H%7?*VaDH}m5ud;P{({U%eR6X01Qv_x_7?E;=r;L^D&%WgFXOaoL0<J>AR(eGXUR=L{qZOsjYh#BO&A5bfFS}A-OtC1!8&;;sw9I^BpKl|^ScF;MF2c!bV;)Oma-;hRnc-;``uG89T50Sld>xFG${a8)2@Lk1IB3Ps~5365GO9*NL~_+DBy@{3I|*&fkf;snLK~t*K}R`9gQFY1*$UY2SId4H-b4IdCiwZ>~coD6|5*c!5){`ZJlR8?w-~WKE`R0Fb4XCCm65WUw<tqQxX;07!s+Ddy&*F07Pw>|I&6RaZ%6}EgN>${Ea58d0VD5GzMQ+Vr(FURxl8kAVq+6c^Y$XnXK~S!CUZs-0^vj&;mAQ@`J1ZJYexVNS6Ofy+ufz0VP}377c)G`78c;d=uW36twgaq1aUr>J{1&&1HJjT$?m;f%}dt*d#1x?aJ?F@h@k23FZZ}J`xJ|2}~#nPNRZoraD9p#Z~oX1l3_YmEMm3zpnGL@wvHV?P|?@A=Qwe!p9%z1Dn0CTMFttpoOWADJXeUw`udGI;qZ{Ll;%GM(ybinh$sjK8c5J&Iu(DQ%!<)iL-{&@B>q$-c%(OEP`BO6bc;mE%iAGY4GN9!IzIzLQY#?qeZf2dq|O?;$pu*4eewUq?V!LNo2;!15!Oso(YMB{{_w7J$|<LNr6^M4;*cB11F!PP0Yule6?yDbj|!-9q%hO`XdbfHVxSaEPo`Y-1`b3#e3)72aoB{QQdn)DS%o_5qQ4nRIIK(Y9-@KwT{7D+`$wOm3^@cVNL~;-;!}itamjmV+!{JOTOeAGMQTbLF12V3Ibx(*FbWDZW>x<zFsO;bYW~}pPlc(YmFQ0N6w;P_>n<RiqaE9ofz#y<GLGmJOz&%`y<BvGz$M?8yBG;mh8(HMCu_=>_E=&WDDo!^EC73W{QSkq<?8mQI-f9FY|&PF;N8~-u8O?=$1CVw7L+~+)_todhp+(0V=<6Sl7u0x*(NXxEz>UvLiBABWq-pY*5SC%-WtBg&j@;8vrs~$TRL~F&mEUnT)Q%En=B5LmBAF{|j~H^kl5jiSIsrK9X=BRar*G`PE4dihK3I8oIjJ<c*Jt91O7J7z|#&I)C>z##-d6O9pj%5|2ll@d$YEO~zI3qM6-_kT50VQAngR;>&2K*ZfiXEb-HY$$ccc5c(K}iACYLO+h5fG1@<6kmf<8L$fsr2}?GpSPCSRdP=;DO|k<2!Jf&&^fkRnN-BSbuU@^1#>1;9E!Li`fd-$>M5oX&r>73@r4)WYrW??!=C^G^#*k;1klSSR*<>`H49BD4WIVj!*oRk>V|#i2<y+aw60&Z~7?n_LqOPiD%8TVt){mgMV1u=Im5u=IAZ_M2j0N;UOrDA#EP$&Puz;<C8jn%lV90-QV1zx;@*dVy5X;N^yau~YtM!9)gD^DrF8}fV<=Z!xXYXHP*@c|=$YXEC%d@MOR~HxG^Htu+6WmuQW#MOas{j(tQXknI%WArzsYnz+p@%8Bwyq-(av6lg@H$co!9vS5{g};=FFgXh&ETINXdqqT9>IW0*1T;3;##-vq?F@K{u)qsH2pC9ApxgirXCm-)qW#Uu47;|Qa0{;-hrzFj2CrX)ph__dRyE=R3<CBn{IL2JF-k5v}DBJ?!&zcrazUQi$t$vO$MCrek$!TTGu<zi2$;{V6;12H1JdBYd?tCy2zU%FDdhb`EcAdL%1ea^}1z3p$%Q;-5