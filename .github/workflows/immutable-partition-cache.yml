name: Immutable partition cache

on:
  push:
    branches:
      - agent/further-solver-improvements
    paths:
      - .github/scripts/apply_immutable_partition_cache.py
      - .github/scripts/benchmark_immutable_partition_cache.py
      - .github/workflows/immutable-partition-cache.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: immutable-partition-cache
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Preserve the pre-candidate baseline
        run: git worktree add --detach /tmp/partition-baseline HEAD

      - name: Apply immutable partition cache
        run: python .github/scripts/apply_immutable_partition_cache.py

      - name: Install and run bounded CI-equivalent suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_partition_cache.py \
            tests/test_candidate_domain.py \
            tests/test_compact_api_hardening.py \
            tests/test_candidate_mask_index.py \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_iterable_loading.py \
            tests/test_parser_fuzzing.py \
            tests/test_new_puzzle_families.py \
            tests/test_new_family_corpus_runner.py \
            tests/test_depth_gate.py \
            tests/test_action_dispatch.py \
            tests/test_rule_hash_cache.py \
            tests/test_rule_only_cache.py \
            tests/test_topology_cache_lifecycle.py \
            tests/test_atmostonce_memo.py \
            tests/test_aic_extra_visibility.py \
            tests/test_extension_validation.py \
            tests/test_hotpath_regressions.py \
            tests/test_runtime_overhead.py \
            tests/test_handler_aware_logging.py \
            tests/test_guarantee_filter_cache.py \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_basic.py \
            tests/test_scale.py \
            tests/test_examples_2.py \
            -m "not slow" \
            --durations=20
          python -X dev -m pytest -q tests/test_rule_metadata.py

      - name: Benchmark immutable cache
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/benchmark_immutable_partition_cache.py \
            --baseline /tmp/partition-baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --markdown benchmarks/immutable_partition_cache_2026-08-11.md \
            --json benchmarks/immutable_partition_cache_2026-08-11.json \
            --marker /tmp/promote-partition-cache

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-partition-cache-evidence
          path: |
            benchmarks/immutable_partition_cache_2026-08-11.md
            benchmarks/immutable_partition_cache_2026-08-11.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit tested source and remove promotion scaffolding
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/promote-partition-cache ]]; then
            echo "Macro regression gate rejected the candidate."
            exit 1
          fi
          rm -f \
            .github/scripts/apply_immutable_partition_cache.py \
            .github/scripts/benchmark_immutable_partition_cache.py \
            .github/workflows/immutable-partition-cache.yml
          git add -A -- \
            .github/scripts/apply_immutable_partition_cache.py \
            .github/scripts/benchmark_immutable_partition_cache.py \
            .github/workflows/immutable-partition-cache.yml \
            gridsolver/rules/sumrules.py \
            tests/test_partition_cache.py \
            benchmarks/immutable_partition_cache_2026-08-11.md \
            benchmarks/immutable_partition_cache_2026-08-11.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make cage partition caching immutable"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
