name: Apply tested runtime cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/runtime-overhead-candidate.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-runtime-cleanup
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply runtime and guarantee-filter cleanups
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_once(
              path: Path,
              label: str,
              old: str,
              new: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{path} {label}: expected one marker, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(
              path: Path,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(
                  text[:start] + replacement + text[end:],
                  encoding="utf-8",
              )

          atomic = Path("gridsolver/solver/atomic_solver.py")
          replace_once(
              atomic,
              "ContextVar import",
              "from collections.abc import Callable, Iterator\n",
              (
                  "from collections.abc import Callable, Iterator\n"
                  "from contextvars import ContextVar\n"
              ),
          )
          replace_between(
              atomic,
              "POWER_RULE_CHANGES: Counter[str] = Counter()\n",
              "def power_stats_table() -> str:\n",
              dedent('''
                  POWER_RULE_CHANGES: Counter[str] = Counter()
                  _POWER_STATS_ENABLED: ContextVar[bool] = ContextVar(
                      "gridpuzzle_power_stats_enabled",
                      default=False,
                  )


                  def power_stats_enabled() -> bool:
                      return _POWER_STATS_ENABLED.get()


                  def reset_power_stats() -> None:
                      """Clear and enable optional diagnostics in this context."""
                      POWER_TRIES.clear()
                      POWER_HITS.clear()
                      POWER_ELIMS.clear()
                      POWER_RULE_CHANGES.clear()
                      _lg.time_stats.clear()
                      _POWER_STATS_ENABLED.set(True)


                  def disable_power_stats() -> None:
                      """Disable diagnostics for subsequently constructed solvers."""
                      _POWER_STATS_ENABLED.set(False)


              ''').lstrip(),
          )
          replace_once(
              atomic,
              "solver diagnostic flags",
              (
                  "        self.hidden_pair_checked_gts = hidden_pair_checked_gts\n"
                  "        self.depth_gate = depth_gate\n"
              ),
              (
                  "        self.hidden_pair_checked_gts = hidden_pair_checked_gts\n"
                  "        self.depth_gate = depth_gate\n"
                  "        self.collect_stats = power_stats_enabled()\n"
                  "        self.collect_timing = self.collect_stats or _lg.on\n"
              ),
          )
          replace_once(
              atomic,
              "outer update timing",
              (
                  "            try:\n"
                  "                with _lg.time_ctxt(\"update_step\"):\n"
                  "                    self._update_step()\n"
                  "            except InvalidGrid:\n"
              ),
              (
                  "            try:\n"
                  "                if self.collect_timing:\n"
                  "                    with _lg.time_ctxt(\"update_step\"):\n"
                  "                        self._update_step()\n"
                  "                else:\n"
                  "                    self._update_step()\n"
                  "            except InvalidGrid:\n"
              ),
          )
          replace_once(
              atomic,
              "power counters",
              (
                  "                for step_type in self._solve_power_actions():\n"
                  "                    POWER_TRIES[step_type] += 1\n"
                  "                    after_action = self._state_snapshot()\n"
                  "                    if after_action == after_basic:\n"
                  "                        continue\n\n"
                  "                    POWER_HITS[step_type] += 1\n"
                  "                    POWER_ELIMS[step_type] += max(0, after_basic[1] - after_action[1])\n"
                  "                    if after_basic[2:] != after_action[2:]:\n"
                  "                        POWER_RULE_CHANGES[step_type] += 1\n"
              ),
              (
                  "                for step_type in self._solve_power_actions():\n"
                  "                    if self.collect_stats:\n"
                  "                        POWER_TRIES[step_type] += 1\n"
                  "                    after_action = self._state_snapshot()\n"
                  "                    if after_action == after_basic:\n"
                  "                        continue\n\n"
                  "                    if self.collect_stats:\n"
                  "                        POWER_HITS[step_type] += 1\n"
                  "                        POWER_ELIMS[step_type] += max(\n"
                  "                            0,\n"
                  "                            after_basic[1] - after_action[1],\n"
                  "                        )\n"
                  "                        if after_basic[2:] != after_action[2:]:\n"
                  "                            POWER_RULE_CHANGES[step_type] += 1\n"
              ),
          )
          replace_between(
              atomic,
              "    def _update_step(self) -> None:\n",
              "    def _update_from_rules(self) -> None:\n",
              indent(
                  dedent('''
                      def _update_step(self) -> None:
                          _update_known_from_candidates(
                              self.grid.__setitem__,
                              self.grid._candidates,
                              self.grid._known,
                          )
                          if self.collect_timing:
                              with _lg.time_ctxt("update_from_rules"):
                                  self._update_from_rules()
                              with _lg.time_ctxt("filter_guarantees"):
                                  filter_guarantees(self.grid)
                          else:
                              self._update_from_rules()
                              filter_guarantees(self.grid)

                  ''').lstrip(),
                  "    ",
              ),
          )
          replace_between(
              atomic,
              "    def _act(self, label: str, action: Callable[[], None]) -> str:\n",
              "    def _hidden_tuples(self, n: int) -> None:\n",
              indent(
                  dedent('''
                      def _act(self, label: str, action: Callable[[], None]) -> str:
                          """Run one power action and optionally account for diagnostics."""
                          try:
                              if self.collect_timing:
                                  with _lg.time_ctxt(label):
                                      action()
                              else:
                                  action()
                          except InvalidGrid:
                              if self.collect_stats:
                                  POWER_TRIES[label] += 1
                                  POWER_HITS[label] += 1
                              raise
                          return label

                  ''').lstrip(),
                  "    ",
              ),
          )

          grid = Path("gridsolver/abstract_grids/grid.py")
          replace_once(
              grid,
              "singleton candidate promotion",
              (
                  "        self._known[index] = value\n"
                  "        # An assignment outside the current candidate set intentionally empties\n"
                  "        # the set, making the trial branch invalid without corrupting the value\n"
                  "        # domain stored in _known.\n"
                  "        self._candidates[index].intersection_update((value,))\n"
              ),
              (
                  "        self._known[index] = value\n"
                  "        # An assignment outside the current candidate set intentionally empties\n"
                  "        # the set, making the trial branch invalid without corrupting the value\n"
                  "        # domain stored in _known. Avoid journaling a no-op when a singleton\n"
                  "        # candidate is merely promoted to a known value.\n"
                  "        possible = self._candidates[index]\n"
                  "        if len(possible) != 1 or value not in possible:\n"
                  "            possible.intersection_update((value,))\n"
              ),
          )

          guarantees = Path("gridsolver/solver/solve_guarantees.py")
          text = guarantees.read_text(encoding="utf-8")
          start = text.index(
              "# noinspection PyProtectedMember\ndef filter_guarantees"
          )
          end = text.index(
              "# noinspection PyProtectedMember\ndef update_from_guarantee",
              start,
          )
          replacement = dedent('''
              def _guarantees_by_value(grid: Grid) -> dict[int, tuple[Guarantee, ...]]:
                  """Return live guarantees grouped and size-sorted for filtering."""
                  grouped: dict[int, list[Guarantee]] = {}
                  for guarantee in grid.guarantees:
                      grouped.setdefault(guarantee.val, []).append(guarantee)
                  return {
                      value: tuple(
                          sorted(
                              per_value,
                              key=lambda guarantee: len(guarantee.cells),
                          )
                      )
                      for value, per_value in grouped.items()
                  }


              # noinspection PyProtectedMember
              def filter_guarantees(grid: Grid) -> None:
                  # Grouping and sorting depend only on the live guarantee set.
                  # Reuse the guarantee-only cache until that set changes.
                  grouped = grid.cached_guarantee_struct(
                      "filter_guarantees_by_value",
                      lambda: _guarantees_by_value(grid),
                  )

                  to_deactivate: set[Guarantee] = set()
                  for per_value in grouped.values():
                      if len(per_value) < 2:
                          continue
                      for index, smaller in enumerate(per_value):
                          for larger in per_value[index + 1:]:
                              if smaller.cells <= larger.cells:
                                  to_deactivate.add(larger)

                  for guarantee in to_deactivate:
                      if guarantee in grid.guarantees:
                          grid.deactivate_gtee(guarantee)

                  for guarantee in tuple(grid.guarantees):
                      if guarantee in grid.guarantees:
                          update_from_guarantee(grid, guarantee)


          ''').lstrip()
          guarantees.write_text(
              text[:start] + replacement + text[end:],
              encoding="utf-8",
          )

          Path("tests/test_runtime_overhead.py").write_text(
              dedent('''
                  import pytest

                  from gridsolver.abstract_grids.grid import Grid
                  from gridsolver.rules.rules import InvalidGrid
                  from gridsolver.solver import atomic_solver
                  from gridsolver.solver.atomic_solver import AtomicSolver
                  from gridsolver.solver.solver_log import lg


                  def _contradict() -> None:
                      raise InvalidGrid()


                  def test_singleton_assignment_does_not_journal_noop_candidate_change():
                      grid = Grid(1, 1, max_elem=2)
                      grid.get_candidates(0).intersection_update({1})
                      mark = grid.trail_mark()

                      grid[0] = 1

                      assert [entry[0] for entry in grid._trail_state.entries] == ["known"]
                      grid.trail_undo(mark)
                      assert grid[0] == 0
                      assert grid.get_candidates(0) == {1}


                  def test_power_statistics_are_opt_in():
                      atomic_solver.reset_power_stats()
                      atomic_solver.disable_power_stats()
                      before_tries = atomic_solver.POWER_TRIES.copy()
                      before_times = lg.time_stats.copy()

                      solver = AtomicSolver(Grid(1), [], set())
                      with pytest.raises(InvalidGrid):
                          solver._act("probe", _contradict)
                      assert atomic_solver.POWER_TRIES == before_tries
                      assert lg.time_stats == before_times

                      try:
                          atomic_solver.reset_power_stats()
                          solver = AtomicSolver(Grid(1), [], set())
                          with pytest.raises(InvalidGrid):
                              solver._act("probe", _contradict)
                          assert atomic_solver.POWER_TRIES["probe"] == 1
                          assert atomic_solver.POWER_HITS["probe"] == 1
                          assert "probe" in lg.time_stats
                      finally:
                          atomic_solver.disable_power_stats()
              ''').lstrip(),
              encoding="utf-8",
          )

          Path("tests/test_guarantee_filter_cache.py").write_text(
              dedent('''
                  from gridsolver.abstract_grids.grid import Grid
                  from gridsolver.rules.rules import Guarantee
                  from gridsolver.solver.solve_guarantees import filter_guarantees


                  def test_guarantee_filter_grouping_is_cached_and_invalidated():
                      grid = Grid(2)
                      larger = Guarantee(1, frozenset({0, 1, 2}), 2, 2)
                      smaller = Guarantee(1, frozenset({0, 1}), 2, 2)
                      grid.add_gtee_checked(larger)
                      grid.add_gtee_checked(smaller)

                      filter_guarantees(grid)
                      cache = grid._guarantee_cache
                      assert larger in grid.guarantees_ia

                      filter_guarantees(grid)
                      assert grid._guarantee_cache is cache
                      assert grid._guarantee_cache["filter_guarantees_by_value"][1] == (
                          smaller,
                      )

                      grid.add_gtee_checked(
                          Guarantee(2, frozenset({2, 3}), 2, 2)
                      )
                      assert grid._guarantee_cache is cache
                      assert not grid._guarantee_cache

                      filter_guarantees(grid)
                      assert grid._guarantee_cache is cache
                      assert set(
                          grid._guarantee_cache["filter_guarantees_by_value"]
                      ) == {1, 2}
              ''').lstrip(),
              encoding="utf-8",
          )

          development = Path("DEVELOPMENT.md")
          text = development.read_text(encoding="utf-8")
          old = dedent('''
              - **Per-technique tries/hits/time:** `atomic_solver.POWER_TRIES`,
                `POWER_HITS`, and `lg.time_stats` are reported by
                `tests/technique_stats_harness.py`. June 2026 corpus measurements found
                fish(4), finned-fish(3), fish(3), and hidden-tuples(7) had zero hits in
                roughly 900–1400 tries while consuming most forcing-chain branch time.
                Excluding them from inner branches made the corpus 6.6x faster with
                identical solutions and hit profiles.
          ''').lstrip()
          new = dedent('''
              - **Per-technique diagnostics are opt-in.** Normal solves do not update
                `POWER_TRIES`, `POWER_HITS`, or `lg.time_stats`. Call
                `atomic_solver.reset_power_stats()` to clear and enable collection in
                the current context; call `disable_power_stats()` afterwards. The
                technique-statistics harness does this explicitly. June 2026 corpus
                measurements found fish(4), finned-fish(3), fish(3), and
                hidden-tuples(7) had zero hits in roughly 900–1400 tries while consuming
                most forcing-chain branch time. Excluding them from inner branches made
                the corpus 6.6x faster with identical solutions and hit profiles.
              - **Guarantee filtering caches its value groups.** Grouping and sorting
                depend only on the live guarantee set, so repeated propagation passes
                reuse the guarantee-only cache until a guarantee is added, narrowed, or
                deactivated. Trail rollback restores the parent cache reference.
          ''').lstrip()
          if text.count(old) != 1:
              raise SystemExit("DEVELOPMENT performance marker changed")
          development.write_text(text.replace(old, new, 1), encoding="utf-8")

          benchmark = Path("benchmarks/default_hotpath_2026-08-08.md")
          with benchmark.open("a", encoding="utf-8") as output:
              output.write(
                  dedent('''

                      ## Second-stage runtime cleanup

                      Two further isolated candidates were measured against the optimized
                      baseline above, still with `depth_gate=None` and identical solution
                      fingerprints:

                      | Change | Blank 4x4 | Non-square 6x6 |
                      |---|---:|---:|
                      | Make timing/counters opt-in; skip singleton no-op journaling | 50.087 → 49.388 s (1.4%) | 23.362 → 23.212 s (0.6%) |
                      | Cache guarantee grouping/sorting during filtering | 47.004 → 46.434 s (1.2%) | 22.650 → 22.371 s (1.2%) |

                      The measurements were run independently to attribute each gain. Both
                      changes preserve the full technique hierarchy and default branching
                      behavior; depth gating remains disabled unless explicitly requested.
                  ''')
              )
          PY

      - name: Install and validate cleaned runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_runtime_overhead.py \
            tests/test_guarantee_filter_cache.py \
            tests/test_hotpath_regressions.py \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_basic.py \
            tests/test_scale.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10
          python -X dev -m pytest -q tests/test_rule_metadata.py
          git diff --check

      - name: Commit source and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "senegrom"
          git config user.email "6349874+senegrom@users.noreply.github.com"
          git rm -f \
            .github/workflows/runtime-overhead-candidate.yml \
            .github/workflows/filter-guarantees-candidate.yml
          git add \
            DEVELOPMENT.md \
            benchmarks/default_hotpath_2026-08-08.md \
            gridsolver/abstract_grids/grid.py \
            gridsolver/solver/atomic_solver.py \
            gridsolver/solver/solve_guarantees.py \
            tests/test_runtime_overhead.py \
            tests/test_guarantee_filter_cache.py
          git commit -m "Reduce default solver runtime overhead"
          git push origin HEAD:master

      - name: Dispatch permanent CI for source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref master
