name: Path guarantees and Hidato debloat

on:
  push:
    branches:
      - agent/further-solver-improvements
    paths:
      - .github/workflows/path-presence-guarantees-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: path-presence-guarantees-v2
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply visible source patches
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/path-presence-guarantees.patch
          git apply .github/patches/path-presence-guarantees.patch
          git apply --check .github/patches/hidato-rules-only-overlay.patch
          git apply .github/patches/hidato-rules-only-overlay.patch
          git diff --check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run complete bounded suite
        run: python -X dev -m pytest -q tests -m "not slow" --durations=20

      - name: Check ordinary solver equivalence and regression bound
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/path-guarantee-baseline c45a1ceadfe597d17d48148ed0d9b9a2c0beee69
          cat > /tmp/path_guarantee_benchmark.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import statistics
          import subprocess
          import sys
          from pathlib import Path

          roots = {
              "baseline": Path("/tmp/path-guarantee-baseline"),
              "candidate": Path(os.environ["GITHUB_WORKSPACE"]),
          }

          code = r'''
          import hashlib
          import json
          import sys
          import time

          from gridsolver.abstract_grids.grid_loading import create_from_file
          from gridsolver.grid_classes.path_puzzles import Numbrix
          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver
          from gridsolver.solver.propagation import propagate_basic

          case = sys.argv[1]
          started = time.perf_counter()
          if case == "numbrix_expert":
              grid = create_from_file(
                  "Examples/Numbrix/Parade/2012-10-21-Expert-S2.clp"
              )
              solutions = solver.solve(
                  grid,
                  max_sols=2,
                  log_level=-1,
                  depth_gate=None,
              )
              result = tuple(sorted(tuple(solution) for solution in solutions))
          elif case == "hidato_medium":
              grid = create_from_file(
                  "Examples/Hidato/Mebane/Mebane-III.4-W8-g2W7.clp"
              )
              solutions = solver.solve(
                  grid,
                  max_sols=2,
                  log_level=-1,
                  depth_gate=None,
              )
              result = tuple(sorted(tuple(solution) for solution in solutions))
          elif case == "loaded4":
              grid = Sudoku(2, 2, 2, 2)
              grid.load("12344321........")
              solutions = solver.solve(
                  grid,
                  max_sols=-1,
                  log_level=-1,
                  depth_gate=None,
              )
              result = tuple(sorted(tuple(solution) for solution in solutions))
          elif case == "propagate_numbrix6":
              grid = Numbrix(6, 6)
              status = propagate_basic(grid)
              result = (
                  status.value,
                  len(grid.rules),
                  len(grid.rules_ia),
                  len(grid.guarantees),
                  len(grid.guarantees_ia),
              )
          else:
              raise SystemExit(case)
          elapsed = time.perf_counter() - started
          digest = hashlib.sha256(repr(result).encode()).hexdigest()
          print(json.dumps({"elapsed": elapsed, "digest": digest, "result": result}))
          '''

          repetitions = {
              "numbrix_expert": 3,
              "hidato_medium": 5,
              "loaded4": 3,
              "propagate_numbrix6": 7,
          }
          solver_cases = {"numbrix_expert", "hidato_medium", "loaded4"}
          ratios = []
          report = {}
          for case, count in repetitions.items():
              timings = {label: [] for label in roots}
              outcomes = {label: set() for label in roots}
              for index in range(count):
                  order = tuple(roots) if index % 2 == 0 else tuple(reversed(roots))
                  for label in order:
                      root = roots[label]
                      env = os.environ.copy()
                      env["PYTHONPATH"] = str(root)
                      output = subprocess.check_output(
                          [sys.executable, "-c", code, case],
                          cwd=root,
                          env=env,
                          text=True,
                          timeout=120,
                      )
                      item = json.loads(output.strip().splitlines()[-1])
                      timings[label].append(float(item["elapsed"]))
                      outcomes[label].add(item["digest"])
              if any(len(values) != 1 for values in outcomes.values()):
                  raise SystemExit(f"{case}: nondeterministic result")
              if outcomes["baseline"] != outcomes["candidate"]:
                  raise SystemExit(f"{case}: solution/result mismatch")
              baseline = statistics.median(timings["baseline"])
              candidate = statistics.median(timings["candidate"])
              ratio = candidate / baseline
              if case in solver_cases:
                  ratios.append(ratio)
              report[case] = {
                  "baseline": baseline,
                  "candidate": candidate,
                  "change_percent": 100 * (ratio - 1),
              }

          geomean = statistics.geometric_mean(ratios)
          print(json.dumps({"cases": report, "solver_geomean": geomean}, indent=2))
          if geomean > 1.10:
              raise SystemExit(
                  f"ordinary solver regression exceeded 10%: {geomean:.3f}x"
              )
          PY
          python /tmp/path_guarantee_benchmark.py

      - name: Validate all retained Hidato solutions under rules-only profile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          from gridsolver.abstract_grids.grid import TechniqueProfile
          from gridsolver.abstract_grids.grid_loading import create_from_file
          from gridsolver.solver import solver

          expected = {
              "Mebane-III.1-S.clp": "c501eb4cd96b809e8aaeb35aaa124128bc2c3ce16c918df20e27e9af238ea859",
              "Mebane-III.10-W3.clp": "fd179ee672f7f4cbf5fbb8e8f99718257d57e2af5cfdd5e06645a3868c88033b",
              "Mebane-III.4-W8-g2W7.clp": "54b9b5a41f02861868fc32853aee43f6dfd597b31178f3d43ef0921e551fb2cf",
              "Mebane-III.7-W4.clp": "c56b23d7798c916505ca66f10378f9579c8ea7b16eee5686fcb056a8995a2ae3",
              "2012-10-11-3stars.clp": "f878549a50fac74d9361d30e979550651233d45fd226046520e0ff418afac18a",
              "2012-10-12-4stars.clp": "aaa30897ca925b1faf8291432b02b419fb46eab1bb6aa857c4938b7cb15f7bc2",
              "2012-10-14-5stars.clp": "b8bb783056d159285552fae1807184b01e658fd18b2fd810c7290e46f96505cf",
          }

          paths = sorted(Path("Examples/Hidato").rglob("*.clp"))
          if {path.name for path in paths} != set(expected):
              raise SystemExit("retained Hidato corpus changed without updating this gate")
          for path in paths:
              grid = create_from_file(path)
              if grid.technique_profile is not TechniqueProfile.RULES_ONLY:
                  raise SystemExit(f"{path}: unexpected profile {grid.technique_profile}")
              solutions = solver.solve(
                  grid,
                  max_sols=2,
                  log_level=-1,
                  depth_gate=None,
              )
              payload = repr(
                  tuple(sorted(tuple(solution) for solution in solutions))
              ).encode()
              digest = hashlib.sha256(payload).hexdigest()
              if len(solutions) != 1 or digest != expected[path.name]:
                  raise SystemExit(
                      f"{path}: expected one solution {expected[path.name]}, "
                      f"got {len(solutions)} {digest}"
                  )
          PY

      - name: Promote tested source and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/patches/path-presence-guarantees.patch \
            .github/patches/hidato-rules-only-overlay.patch \
            .github/workflows/path-presence-guarantees.yml \
            .github/workflows/path-presence-guarantees-v2.yml \
            .github/workflows/export-pr5-source.yml
          git add -A -- \
            .github/patches/path-presence-guarantees.patch \
            .github/patches/hidato-rules-only-overlay.patch \
            .github/workflows/path-presence-guarantees.yml \
            .github/workflows/path-presence-guarantees-v2.yml \
            .github/workflows/export-pr5-source.yml \
            DEVELOPMENT.md \
            Examples/README.txt \
            README.md \
            TODO.md \
            benchmarks/path_presence_guarantees_2026-08-11.md \
            gridsolver/grid_classes/path_puzzles.py \
            gridsolver/rules/topology.py \
            gridsolver/rules/unique.py \
            gridsolver/solver/validation.py \
            tests/test_new_puzzle_families.py \
            tests/test_solution_validation.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seed path guarantees and debloat path solving"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
