name: Harden new puzzle families
# Corrected path-connectivity diagnostic pass.

on:
  push:
    branches:
      - agent/add-hidato-kakuro-numbrix-slitherlink
    paths:
      - .github/workflows/new-puzzle-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: new-puzzle-hardening
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply hardening changes
        run: |
          python .github/scripts/fix_new_puzzle_harness.py
          python .github/scripts/harden_new_puzzle_families.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_new_puzzle_families.py \
            tests/test_cli_and_loading.py \
            tests/test_parser_fuzzing.py \
            tests/test_solution_validation.py \
            tests/test_extension_validation.py \
            tests/test_rule_inputs.py \
            tests/test_trail.py \
            tests/test_solver_api.py \
            tests/test_regressions.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=20

      - name: Commit hardening and remove harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/fix_new_puzzle_harness.py \
            .github/scripts/harden_new_puzzle_families.py \
            .github/workflows/new-puzzle-hardening.yml
          git add -A
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden new puzzle-family support"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
