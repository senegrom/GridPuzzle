name: Temporary logging API hardening

on:
  push:
    branches: [master]
    paths:
      - .github/scripts/apply_logging_api_hardening.py
      - .github/workflows/logging-api-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logging-api-hardening
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply logging API hardening
        run: python .github/scripts/apply_logging_api_hardening.py

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_handler_aware_logging.py \
            tests/test_cli_and_loading.py \
            tests/test_solver_api.py \
            tests/test_regressions.py \
            -m "not slow" \
            --durations=10
          python -O - <<'PY'
          import logging
          from gridsolver.solver.logger import GridLogger

          try:
              GridLogger(logging.getLogger("optimized"), True)
          except TypeError:
              pass
          else:
              raise SystemExit("optimized mode accepted a boolean log level")
          PY

      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm \
            .github/scripts/apply_logging_api_hardening.py \
            .github/workflows/logging-api-hardening.yml
          git add \
            gridsolver/solver/logger.py \
            tests/test_handler_aware_logging.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Validate log levels and stabilize coordinate sets"
          git push origin HEAD:master
