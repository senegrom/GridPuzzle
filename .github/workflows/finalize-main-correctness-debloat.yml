name: Finalize main correctness and debloat follow-up

on:
  push:
    branches:
      - agent/main-correctness-debloat-followup
    paths:
      - .github/patches/main-correctness-debloat.patch
      - .github/workflows/finalize-main-correctness-debloat.yml

permissions:
  contents: write

concurrency:
  group: finalize-main-correctness-debloat
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact audit branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply the reviewed patch and remove temporary delivery files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/main-correctness-debloat.patch
          git apply .github/patches/main-correctness-debloat.patch
          rm -f \
            .github/patches/main-correctness-debloat.patch \
            .github/workflows/finalize-main-correctness-debloat.yml
          git diff --check

      - name: Install, package, and compile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          gridpuzzle --help >/dev/null
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py

      - name: Run every bounded test
        run: >-
          python -X dev -m pytest -q
          tests
          -m "not slow"
          --durations=15

      - name: Verify and publish the tested source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          expected = {
              ".github/patches/main-correctness-debloat.patch",
              ".github/workflows/finalize-main-correctness-debloat.yml",
              "gridsolver/abstract_grids/grid.py",
              "gridsolver/solver/candidate_topology.py",
              "tests/test_rule_inputs.py",
          }
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"],
                  text=True,
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(
                  f"unexpected finalization diff: {sorted(changed ^ expected)}"
              )
          PY
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m \
            "Make rule transitions atomic and trim topology cache"
          git push origin "HEAD:$GITHUB_REF_NAME"
