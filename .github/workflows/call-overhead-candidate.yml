name: Temporary call-overhead candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/call-overhead-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: call-overhead-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply allocation and lazy-logging candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def lines(*parts: str) -> str:
              return "".join(part + "\n" for part in parts)

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one marker, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(
              path: Path,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(
                  text[:start] + replacement + text[end:],
                  encoding="utf-8",
              )

          atomic = Path("gridsolver/solver/atomic_solver.py")
          replace_once(
              atomic,
              lines(
                  "        self.stats = current_power_stats()",
                  "        self.collect_timing = self.stats is not None or _lg.on",
              ),
              lines(
                  "        self.stats = current_power_stats()",
                  "        self.collect_timing = self.stats is not None or _lg.on",
                  "        self.verbose_logging = _lg.is_enabled(_MAX_LVL)",
              ),
          )
          replace_once(
              atomic,
              lines(
                  "        _lg.logs(_MAX_LVL, \"Solving rule-based\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
              lines(
                  "        if self.verbose_logging:",
                  "            _lg.logs(_MAX_LVL, \"Solving rule-based\")",
                  "            _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
          )
          replace_once(
              atomic,
              lines(
                  "        _lg.logs(_MAX_LVL, f\"Done after {steps} steps: \\t{status}\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
                  "        return status",
              ),
              lines(
                  "        if self.verbose_logging:",
                  "            _lg.logs(_MAX_LVL, f\"Done after {steps} steps: \\t{status}\")",
                  "            _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
                  "        return status",
              ),
          )
          replace_once(
              atomic,
              lines(
                  "    def _log_step(self, steps: int, step_type: str) -> None:",
                  "        _lg.logstep(_MAX_LVL, self.upsteps, f\"{steps} ({step_type})\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
              lines(
                  "    def _log_step(self, steps: int, step_type: str) -> None:",
                  "        if not self.verbose_logging:",
                  "            return",
                  "        _lg.logstep(_MAX_LVL, self.upsteps, f\"{steps} ({step_type})\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
          )

          replace_between(
              atomic,
              "    def _act(self, label: str, action: Callable[[], None]) -> str:\n",
              "    def _hidden_tuples(self, n: int) -> None:\n",
              indent(
                  dedent('''
                      def _act(
                          self,
                          label: str,
                          action: Callable[..., None],
                          *args: object,
                      ) -> str:
                          """Run one power action without allocating a closure."""
                          try:
                              if self.stats is not None:
                                  with self.stats.time(label):
                                      action(*args)
                              elif self.collect_timing:
                                  with _lg.time_ctxt(label):
                                      action(*args)
                              else:
                                  action(*args)
                          except InvalidGrid:
                              if self.stats is not None:
                                  self.stats.tries[label] += 1
                                  self.stats.hits[label] += 1
                              raise
                          return label

                  ''').lstrip(),
                  "    ",
              ),
          )

          replace_between(
              atomic,
              "    def _solve_power_actions(self) -> Iterator[str]:\n",
              "\n\n_MAX_HIDDEN_TUPLE = 7\n",
              indent(
                  dedent('''
                      def _solve_power_actions(self) -> Iterator[str]:
                          grid = self.grid
                          # Expensive zero-hit tiers are skipped inside forcing-chain
                          # branches but retained at the outer level.
                          in_forcing_chain = bool(_solve_fc._in_forcing_chain)

                          yield self._act("locked_candidate", locked_candidate, grid)
                          yield self._act("skyscraper", skyscraper, grid)
                          yield self._act("empty_rectangle", empty_rectangle, grid)
                          yield self._act("ineq_bounds", ineq_bounds, grid)
                          yield self._act("rulehelper_atmostonce", rulehelper_atmostonce, grid)
                          yield self._act(
                              "rulehelper_sum_atmostonce",
                              rulehelper_sum_atmostonce,
                              grid,
                          )
                          yield self._act("rulehelper_house_sums", rulehelper_house_sums, grid)
                          yield self._act("naked_tuples5", remove_naked_tuples, grid, 5)

                          if (
                              self.depth_gate is not None
                              and not in_forcing_chain
                              and len(self.upsteps) > self.depth_gate
                          ):
                              return

                          yield self._act("xy_wing", xy_wing, grid)
                          yield self._act("xyz_wing", xyz_wing, grid)
                          yield self._act("w_wing", w_wing, grid)
                          yield self._act("x_chain", x_chain, grid)
                          yield self._act("xy_chain", xy_chain, grid)
                          yield self._act("als_xz", als_xz, grid)
                          yield self._act("als_xy_wing", als_xy_wing, grid)
                          yield self._act("sue_de_coq", sue_de_coq, grid)
                          yield self._act(
                              "forcing_chain",
                              forcing_chain,
                              grid,
                              self.depth_gate,
                          )
                          yield self._act("hidden_tuples3", self._hidden_tuples, 3)
                          yield self._act("fish2", fish, grid, 2)
                          yield self._act("naked_tuples10", remove_naked_tuples, grid, 10)
                          yield self._act("hidden_tuples4", self._hidden_tuples, 4)
                          if not in_forcing_chain:
                              yield self._act("fish3", fish, grid, 3)
                          yield self._act("finned-fish2", finned_fish, grid, 2)
                          yield self._act("naked_tuples", remove_naked_tuples, grid)
                          if not in_forcing_chain:
                              yield self._act("hidden_tuples", self._hidden_tuples_max)
                          yield self._act("aic", alternating_inference_chain, grid)
                          yield self._act("nishio", nishio, grid)
                          if not in_forcing_chain:
                              yield self._act("fish", fish, grid, _MAX_FISH)
                              yield self._act(
                                  "finned-fish",
                                  finned_fish,
                                  grid,
                                  _MAX_FISH - 1,
                              )
                          yield self._act("forcing_net", forcing_net, grid)
                  ''').lstrip(),
                  "    ",
              ),
          )

          solver = Path("gridsolver/solver/solver.py")
          replace_once(
              solver,
              dedent('''
                  for index, solution in enumerate(sorted(solutions, key=_solution_key)):
                      _lg.logs(0, f"Solution {index}", header=True)
                      _lg.logg(0, solution, format_args=grid.format_args, rules=grid.rules)

                  if not solutions:
                      _lg.logs(0, "No solution found.", header=True)
              ''').lstrip(),
              dedent('''
                  if _lg.is_enabled(0):
                      for index, solution in enumerate(
                          sorted(solutions, key=_solution_key)
                      ):
                          _lg.logs(0, f"Solution {index}", header=True)
                          _lg.logg(
                              0,
                              solution,
                              format_args=grid.format_args,
                              rules=grid.rules,
                          )

                      if not solutions:
                          _lg.logs(0, "No solution found.", header=True)
              ''').lstrip(),
          )
          old = dedent('''
                      if use_guarantee:
                          _lg.logstep(
                              depth,
                              steps,
                              f"Trial (guarantee) [{trial % grid.rows},{trial // grid.rows}] "
                              f"== {guarantee.val} with {len(solutions)} previous solutions",
                          )
                      else:
                          _lg.logstep(
                              depth,
                              steps,
                              f"Trial [{test_cell % grid.rows},{test_cell // grid.rows}] "
                              f"== {trial} with {len(solutions)} previous solutions",
                          )
              ''')
          new = dedent('''
                      if _lg.is_enabled(depth):
                          if use_guarantee:
                              _lg.logstep(
                                  depth,
                                  steps,
                                  f"Trial (guarantee) "
                                  f"[{trial % grid.rows},{trial // grid.rows}] "
                                  f"== {guarantee.val} with "
                                  f"{len(solutions)} previous solutions",
                              )
                          else:
                              _lg.logstep(
                                  depth,
                                  steps,
                                  f"Trial "
                                  f"[{test_cell % grid.rows},{test_cell // grid.rows}] "
                                  f"== {trial} with "
                                  f"{len(solutions)} previous solutions",
                              )
              ''')
          replace_once(solver, old, new)

          Path("tests/test_call_overhead.py").write_text(
              dedent('''
                  import ast
                  from pathlib import Path

                  from gridsolver.grid_classes.sudoku import Sudoku
                  from gridsolver.solver import solver


                  def test_power_action_pipeline_does_not_allocate_lambdas():
                      path = (
                          Path(__file__).resolve().parents[1]
                          / "gridsolver/solver/atomic_solver.py"
                      )
                      tree = ast.parse(path.read_text(encoding="utf-8"))
                      method = next(
                          node
                          for node in ast.walk(tree)
                          if isinstance(node, ast.FunctionDef)
                          and node.name == "_solve_power_actions"
                      )
                      assert not any(
                          isinstance(node, ast.Lambda) for node in ast.walk(method)
                      )


                  def test_disabled_solution_logging_does_not_sort_for_rendering(
                      monkeypatch,
                  ):
                      monkeypatch.setattr(solver._lg, "is_enabled", lambda level: False)

                      def fail_key(solution):
                          raise AssertionError("disabled logging must not sort solutions")

                      monkeypatch.setattr(solver, "_solution_key", fail_key)
                      solutions = solver.solve(
                          Sudoku(1, 1, 1, 1),
                          log_level=0,
                          max_sols=-1,
                      )
                      assert len(solutions) == 1
              ''').lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Install and test candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_call_overhead.py \
            tests/test_runtime_overhead.py \
            tests/test_hotpath_regressions.py \
            tests/test_trail.py \
            tests/test_regressions.py \
            tests/test_hardening.py \
            tests/test_solver_api.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Compare full default solver without depth gating
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/call_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import logging
          import statistics
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          logging.disable(10_000)

          def factory(case):
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load("123456654321........................", row_wise=False)
                  return grid, 20, 20
              raise SystemExit(case)

          case = sys.argv[1]
          durations = []
          digest = None
          for _ in range(2):
              gc.collect()
              grid, max_sols, expected = factory(case)
              started = time.perf_counter()
              solutions = solver.solve(
                  grid,
                  log_level=0,
                  max_sols=max_sols,
                  depth_gate=None,
              )
              durations.append(time.perf_counter() - started)
              if len(solutions) != expected:
                  raise SystemExit(
                      f"{case}: expected {expected}, got {len(solutions)}"
                  )
              payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
              current = hashlib.sha256(payload).hexdigest()
              if digest is None:
                  digest = current
              elif current != digest:
                  raise SystemExit(f"{case}: nondeterministic solution set")
          print(json.dumps({
              "case": case,
              "seconds": durations,
              "median": statistics.median(durations),
              "digest": digest,
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/call_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
