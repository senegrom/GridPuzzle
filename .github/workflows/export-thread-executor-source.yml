name: Export thread executor experiment source

on:
  push:
    branches:
      - agent/free-threaded-search-executor
    paths:
      - .github/patches/free-threaded-search-executor.b85
      - .github/workflows/export-thread-executor-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply the candidate to current master
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          encoded = Path(
              ".github/patches/free-threaded-search-executor.b85"
          ).read_text(encoding="ascii").strip()
          Path("/tmp/free-threaded-executor.patch").write_bytes(
              zlib.decompress(base64.b85decode(encoded.encode("ascii")))
          )
          PY
          git worktree add --detach /tmp/thread-candidate origin/master
          git -C /tmp/thread-candidate apply --check /tmp/free-threaded-executor.patch
          git -C /tmp/thread-candidate apply /tmp/free-threaded-executor.patch

      - name: Stabilize the fresh-grid identity test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/thread-candidate/tests/test_thread_executor.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    worker_ids: list[int] = []": "    worker_grids: list[Grid] = []",
              "        worker_ids.append(id(grid))": "        worker_grids.append(grid)",
              "    assert worker_ids[0] != worker_ids[1]": (
                  "    assert worker_grids[0] is not worker_grids[1]"
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one occurrence of {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          git -C /tmp/thread-candidate diff --check

      - name: Package source and exact patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/thread-export/tests
          git -C /tmp/thread-candidate diff --binary > /tmp/thread-export/free-threaded-executor.patch
          git -C /tmp/thread-candidate diff --name-status > /tmp/thread-export/changed-files.txt
          cp -R /tmp/thread-candidate/gridsolver /tmp/thread-export/
          cp /tmp/thread-candidate/run.py /tmp/thread-export/
          cp /tmp/thread-candidate/tests/test_thread_executor.py /tmp/thread-export/tests/
          cp /tmp/thread-candidate/tests/test_cli_and_loading.py /tmp/thread-export/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: gridpuzzle-thread-executor-source
          path: /tmp/thread-export
          retention-days: 2
