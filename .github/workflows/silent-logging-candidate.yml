name: Temporary handler-aware logging candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/silent-logging-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silent-logging-candidate
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply handler-aware silent logging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def lines(*parts: str) -> str:
              return "".join(part + "\n" for part in parts)

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected one marker, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_between(
              path: Path,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              path.write_text(
                  text[:start] + replacement + text[end:],
                  encoding="utf-8",
              )

          logger = Path("gridsolver/solver/logger.py")
          replace_once(
              logger,
              lines(
                  "        self._grid_buf: ContextVar[str | None] = ContextVar(",
                  "            f\"gridpuzzle_grid_buffer_{logger.name}_{id(self)}\",",
                  "            default=None,",
                  "        )",
              ),
              lines(
                  "        self._grid_buf: ContextVar[str | None] = ContextVar(",
                  "            f\"gridpuzzle_grid_buffer_{logger.name}_{id(self)}\",",
                  "            default=None,",
                  "        )",
                  "        # None means uncached; -1 means no non-null handler.",
                  "        self._output_threshold: ContextVar[int | None] = ContextVar(",
                  "            f\"gridpuzzle_output_threshold_{logger.name}_{id(self)}\",",
                  "            default=None,",
                  "        )",
              ),
          )
          replace_between(
              logger,
              "    def is_enabled(self, level: int) -> bool:\n",
              "    @contextmanager\n    def solve_context",
              dedent('''
                  def _configured_output_threshold(self) -> int:
                      """Lowest handler level reachable from this logger, or -1."""
                      current: logging.Logger | None = self.lg
                      threshold: int | None = None
                      while current is not None:
                          for handler in current.handlers:
                              if isinstance(handler, logging.NullHandler):
                                  continue
                              if threshold is None or handler.level < threshold:
                                  threshold = handler.level
                          if not current.propagate:
                              break
                          current = current.parent
                      return -1 if threshold is None else threshold

                  def is_enabled(self, level: int) -> bool:
                      log_level = _lvl(level)
                      if level > self.detail_level or not self.lg.isEnabledFor(log_level):
                          return False
                      threshold = self._output_threshold.get()
                      if threshold is None:
                          threshold = self._configured_output_threshold()
                      return threshold >= 0 and log_level >= threshold

              ''').lstrip().replace("\n", "\n    ").rstrip() + "\n\n",
          )
          replace_once(
              logger,
              lines(
                  "        buffer_token = self._grid_buf.set(None)",
                  "        try:",
                  "            yield",
                  "        finally:",
                  "            self._grid_buf.reset(buffer_token)",
              ),
              lines(
                  "        buffer_token = self._grid_buf.set(None)",
                  "        output_token = self._output_threshold.set(",
                  "            self._configured_output_threshold()",
                  "        )",
                  "        try:",
                  "            yield",
                  "        finally:",
                  "            self._output_threshold.reset(output_token)",
                  "            self._grid_buf.reset(buffer_token)",
              ),
          )

          atomic = Path("gridsolver/solver/atomic_solver.py")
          replace_once(
              atomic,
              lines(
                  "        self.stats = current_power_stats()",
                  "        self.collect_timing = self.stats is not None or _lg.on",
              ),
              lines(
                  "        self.stats = current_power_stats()",
                  "        self.collect_timing = self.stats is not None or _lg.on",
                  "        self.verbose_logging = _lg.is_enabled(_MAX_LVL)",
              ),
          )
          replace_once(
              atomic,
              lines(
                  "        _lg.logs(_MAX_LVL, \"Solving rule-based\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
              lines(
                  "        if self.verbose_logging:",
                  "            _lg.logs(_MAX_LVL, \"Solving rule-based\")",
                  "            _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
          )
          replace_once(
              atomic,
              lines(
                  "        _lg.logs(_MAX_LVL, f\"Done after {steps} steps: \\t{status}\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
                  "        return status",
              ),
              lines(
                  "        if self.verbose_logging:",
                  "            _lg.logs(_MAX_LVL, f\"Done after {steps} steps: \\t{status}\")",
                  "            _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
                  "        return status",
              ),
          )
          replace_once(
              atomic,
              lines(
                  "    def _log_step(self, steps: int, step_type: str) -> None:",
                  "        _lg.logstep(_MAX_LVL, self.upsteps, f\"{steps} ({step_type})\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
              lines(
                  "    def _log_step(self, steps: int, step_type: str) -> None:",
                  "        if not self.verbose_logging:",
                  "            return",
                  "        _lg.logstep(_MAX_LVL, self.upsteps, f\"{steps} ({step_type})\")",
                  "        _lg.logg(_MAX_LVL, self.grid, print_candidates=True)",
              ),
          )

          solver = Path("gridsolver/solver/solver.py")
          solution_lines = [
              "    if _lg.is_enabled(0):",
              "        for index, solution in enumerate(",
              "            sorted(solutions, key=_solution_key)",
              "        ):",
              "            _lg.logs(0, f\"Solution {index}\", header=True)",
              "            _lg.logg(",
              "                0,",
              "                solution,",
              "                format_args=grid.format_args,",
              "                rules=grid.rules,",
              "            )",
              "",
              "        if not solutions:",
              "            _lg.logs(0, \"No solution found.\", header=True)",
              "",
          ]
          replace_between(
              solver,
              "    for index, solution in enumerate(sorted(solutions, key=_solution_key)):\n",
              "    return solutions\n",
              lines(*solution_lines),
          )

          trial_lines = [
              "        for trial in trials:",
              "            depth = len(steps)",
              "            if _lg.is_enabled(depth):",
              "                if use_guarantee:",
              "                    _lg.logstep(",
              "                        depth,",
              "                        steps,",
              "                        f\"Trial (guarantee) \"",
              "                        f\"[{trial % grid.rows},{trial // grid.rows}] \"",
              "                        f\"== {guarantee.val} with \"",
              "                        f\"{len(solutions)} previous solutions\",",
              "                    )",
              "                else:",
              "                    _lg.logstep(",
              "                        depth,",
              "                        steps,",
              "                        f\"Trial \"",
              "                        f\"[{test_cell % grid.rows},\"",
              "                        f\"{test_cell // grid.rows}] \"",
              "                        f\"== {trial} with \"",
              "                        f\"{len(solutions)} previous solutions\",",
              "                    )",
              "",
          ]
          replace_between(
              solver,
              "        for trial in trials:\n",
              (
                  "            # Reuse the current grid for every branch. "
                  "The journal restores\n"
              ),
              lines(*trial_lines),
          )

          Path("tests/test_handler_aware_logging.py").write_text(
              dedent('''
                  import io
                  import logging

                  from gridsolver.grid_classes.sudoku import Sudoku
                  from gridsolver.solver import solver
                  from gridsolver.solver.logger import GridLogger


                  def test_null_handler_is_not_treated_as_visible_output(monkeypatch):
                      raw = logging.getLogger("gridpuzzle-null-handler-test")
                      raw.handlers[:] = [logging.NullHandler()]
                      raw.propagate = False
                      logger = GridLogger(raw, 0)

                      with logger.solve_context(0):
                          assert not logger.is_enabled(0)


                  def test_real_handler_remains_visible():
                      raw = logging.getLogger("gridpuzzle-real-handler-test")
                      stream = io.StringIO()
                      handler = logging.StreamHandler(stream)
                      raw.handlers[:] = [handler]
                      raw.propagate = False
                      logger = GridLogger(raw, 0)

                      with logger.solve_context(0):
                          assert logger.is_enabled(0)
                          logger.logs(0, "visible")
                      assert "visible" in stream.getvalue()


                  def test_silent_solver_does_not_sort_solutions_for_rendering(
                      monkeypatch,
                  ):
                      raw = solver._lg.lg
                      old_handlers = list(raw.handlers)
                      old_propagate = raw.propagate
                      raw.handlers[:] = [logging.NullHandler()]
                      raw.propagate = False

                      def fail_key(solution):
                          raise AssertionError("silent logging must not sort for display")

                      monkeypatch.setattr(solver, "_solution_key", fail_key)
                      try:
                          solutions = solver.solve(
                              Sudoku(1, 1, 1, 1),
                              log_level=0,
                              max_sols=-1,
                          )
                      finally:
                          raw.handlers[:] = old_handlers
                          raw.propagate = old_propagate
                      assert len(solutions) == 1
              ''').lstrip(),
              encoding="utf-8",
          )
          PY

      - name: Install and test candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_handler_aware_logging.py \
            tests/test_runtime_overhead.py \
            tests/test_hotpath_regressions.py \
            tests/test_trail.py \
            tests/test_regressions.py \
            tests/test_solver_api.py \
            tests/test_differential.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=10

      - name: Compare ordinary silent API use without depth gating
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline HEAD^
          cat > /tmp/silent_bench.py <<'PY'
          import gc
          import hashlib
          import json
          import statistics
          import sys
          import time

          from gridsolver.grid_classes.sudoku import Sudoku
          from gridsolver.solver import solver

          def factory(case):
              if case == "blank4_all":
                  return Sudoku(2, 2, 2, 2), -1, 288
              if case == "nonsquare6_cap20":
                  grid = Sudoku(3, 2, 2, 3)
                  grid.load("123456654321........................", row_wise=False)
                  return grid, 20, 20
              raise SystemExit(case)

          case = sys.argv[1]
          durations = []
          digest = None
          for _ in range(2):
              gc.collect()
              grid, max_sols, expected = factory(case)
              started = time.perf_counter()
              solutions = solver.solve(
                  grid,
                  log_level=0,
                  max_sols=max_sols,
                  depth_gate=None,
              )
              durations.append(time.perf_counter() - started)
              if len(solutions) != expected:
                  raise SystemExit(
                      f"{case}: expected {expected}, got {len(solutions)}"
                  )
              payload = repr(sorted(tuple(solution) for solution in solutions)).encode()
              current = hashlib.sha256(payload).hexdigest()
              if digest is None:
                  digest = current
              elif current != digest:
                  raise SystemExit(f"{case}: nondeterministic solution set")
          print(json.dumps({
              "case": case,
              "seconds": durations,
              "median": statistics.median(durations),
              "digest": digest,
          }, sort_keys=True))
          PY

          run_case() {
            local label="$1"
            local directory="$2"
            local case="$3"
            echo "BENCH ${label} ${case}"
            (cd "$directory" && PYTHONPATH="$directory" python /tmp/silent_bench.py "$case")
          }

          for case in blank4_all nonsquare6_cap20; do
            run_case baseline /tmp/baseline "$case"
            run_case candidate "$GITHUB_WORKSPACE" "$case"
          done
