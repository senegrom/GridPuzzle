name: Apply Str8ts integration
on:
  push:
    branches: [scanner-str8ts-newspaper]
    paths: ['.github/workflows/apply-str8ts.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Apply and verify normal source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/_apply_str8ts_web.py
          python -m compileall -q gridsolver
          pip install -e '.[dev]'
          pytest -q tests/test_str8ts.py tests/test_web_api.py
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --test web/tests/*.test.js
          git add gridsolver/web_api.py web/model.js web/scanner.js web/scan-analysis.js web/app.js web/style.css scripts/browser_smoke.cjs tests/test_web_api.py web/tests/model.test.js web/README.md
          git diff --cached --check
          git commit -m 'Add Str8ts browser support and harden newspaper OCR'
          git push origin HEAD:scanner-str8ts-newspaper
