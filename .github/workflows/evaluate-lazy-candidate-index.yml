name: Evaluate lazy candidate index

on:
  push:
    branches:
      - agent/per-value-candidate-bitmasks
    paths:
      - .github/workflows/evaluate-lazy-candidate-index.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluate-lazy-candidate-index
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply lazy candidate index
        run: python .github/scripts/apply_lazy_candidate_index.py

      - name: Install and validate candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_candidate_mask_index.py \
            tests/test_trail.py \
            tests/test_regressions.py \
            tests/test_hardening.py \
            tests/test_solver_api.py \
            tests/test_differential.py \
            tests/test_new_puzzle_families.py \
            tests/test_new_family_corpus_runner.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=20

      - name: Benchmark against post-feature master
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/baseline origin/master
          python .github/scripts/benchmark_lazy_candidate_index.py \
            --baseline /tmp/baseline \
            --candidate "$GITHUB_WORKSPACE" \
            --report benchmarks/lazy_candidate_index_2026-08-10.md \
            --json-report benchmarks/lazy_candidate_index_2026-08-10.json \
            --promote-marker /tmp/promote-candidate-index

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazy-candidate-index-evidence
          path: |
            benchmarks/lazy_candidate_index_2026-08-10.md
            benchmarks/lazy_candidate_index_2026-08-10.json
          if-no-files-found: warn
          retention-days: 30

      - name: Promote only if every gate passed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/promote-candidate-index ]]; then
            echo "Candidate did not clear the regression gate; leaving source uncommitted."
            exit 0
          fi

          rm -f \
            .github/scripts/apply_lazy_candidate_index.py \
            .github/scripts/benchmark_lazy_candidate_index.py \
            .github/workflows/evaluate-lazy-candidate-index.yml
          git add -A -- \
            .github/scripts/apply_lazy_candidate_index.py \
            .github/scripts/benchmark_lazy_candidate_index.py \
            .github/workflows/evaluate-lazy-candidate-index.yml \
            gridsolver/abstract_grids/trail.py \
            gridsolver/abstract_grids/grid.py \
            gridsolver/solver/candidate_topology.py \
            tests/test_candidate_mask_index.py \
            benchmarks/lazy_candidate_index_2026-08-10.md \
            benchmarks/lazy_candidate_index_2026-08-10.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add lazy dirty-cell candidate masks"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
