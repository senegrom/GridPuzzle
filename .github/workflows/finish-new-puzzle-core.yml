name: Finish new puzzle integration

on:
  push:
    branches:
      - agent/add-hidato-kakuro-numbrix-slitherlink
    paths:
      - .github/workflows/finish-new-puzzle-core.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-new-puzzle-integration
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply measured profile choice
        run: python .github/scripts/apply_profile_choice.py

      - name: Install and run complete bounded suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q tests -m "not slow" --durations=20

      - name: Smoke each retained corpus family in isolated children
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus-smoke
          for family in hidato numbrix kakuro slitherlink
          do
            python scripts/run_new_family_corpus.py \
              --family "$family" \
              --case-timeout 30 \
              --max-cases 1 \
              --output "/tmp/corpus-smoke/${family}.json"
          done

      - name: Commit tested profile test
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_profile_choice.py
          git add -A -- \
            .github/scripts/apply_profile_choice.py \
            tests/test_new_puzzle_families.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use measured solver profiles for graph puzzles"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
