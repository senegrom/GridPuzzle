name: Finish new puzzle integration

on:
  push:
    branches:
      - agent/add-hidato-kakuro-numbrix-slitherlink
    paths:
      - .github/workflows/finish-new-puzzle-core.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-new-puzzle-integration
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply measured profile and safe format detection
        run: |
          python .github/scripts/apply_profile_choice.py
          python .github/scripts/fix_csp_autodetection.py

      - name: Install and run the bounded CI-equivalent suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_cli_and_loading.py \
            tests/test_hardening.py \
            tests/test_iterable_loading.py \
            tests/test_parser_fuzzing.py \
            tests/test_new_puzzle_families.py \
            tests/test_new_family_corpus_runner.py \
            tests/test_depth_gate.py \
            tests/test_action_dispatch.py \
            tests/test_rule_hash_cache.py \
            tests/test_rule_only_cache.py \
            tests/test_topology_cache_lifecycle.py \
            tests/test_atmostonce_memo.py \
            tests/test_aic_extra_visibility.py \
            tests/test_extension_validation.py \
            tests/test_hotpath_regressions.py \
            tests/test_runtime_overhead.py \
            tests/test_handler_aware_logging.py \
            tests/test_guarantee_filter_cache.py \
            tests/test_rule_inputs.py \
            tests/test_regressions.py \
            tests/test_solution_validation.py \
            tests/test_solver_api.py \
            tests/test_trail.py \
            tests/test_differential.py \
            tests/test_basic.py \
            tests/test_scale.py \
            tests/test_examples_2.py \
            -m "not slow" \
            --durations=20
          python -X dev -m pytest -q tests/test_rule_metadata.py

      - name: Smoke each retained corpus family in isolated children
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/corpus-smoke
          for family in hidato numbrix kakuro slitherlink
          do
            python scripts/run_new_family_corpus.py \
              --family "$family" \
              --case-timeout 30 \
              --max-cases 2 \
              --output "/tmp/corpus-smoke/${family}.json"
          done

      - name: Commit tested compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/apply_profile_choice.py \
            .github/scripts/fix_csp_autodetection.py
          git add -A -- \
            .github/scripts/apply_profile_choice.py \
            .github/scripts/fix_csp_autodetection.py \
            gridsolver/abstract_grids/csp_rules_loading.py \
            gridsolver/abstract_grids/grid_loading.py \
            tests/test_cli_and_loading.py \
            tests/test_new_puzzle_families.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve legacy files while auto-detecting CSP-Rules inputs"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
