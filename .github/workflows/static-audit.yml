name: Temporary static audit cleanup

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/static-audit.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-audit-cleanup
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  clean-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff
          python -m pip check

      - name: Apply verified fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff check gridsolver run.py examples2.py tests \
            --select F401,F541 \
            --fix
          ruff check gridsolver run.py examples2.py tests \
            --select F,E9

      - name: Validate affected paths
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q gridsolver tests run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_regressions.py \
            tests/test_basic.py \
            tests/test_hotpath_regressions.py \
            -m "not slow" \
            --durations=10

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/static-audit.yml
          git add gridsolver tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove verified static-analysis cruft"
          git push origin HEAD:master
