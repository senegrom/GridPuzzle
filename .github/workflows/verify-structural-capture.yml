name: Verify structural and capture fixes
on:
  push:
    branches: [verify/structural-capture-20260913]
permissions:
  contents: read
concurrency:
  group: verify-structural-capture
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - name: Complete Node suite
        run: node --test web/tests/*.test.js
      - name: Build self-hosted app
        run: python scripts/build_web.py
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Live camera, structure and two-tab picture regressions
        run: node scripts/live_camera_regressions.cjs
      - name: All remaining permanent browser suites
        run: |
          node scripts/ocr_latency_regressions.cjs
          node scripts/solver_update_regressions.cjs
          node scripts/browser_smoke.cjs
          node scripts/scanner_settings_regressions.cjs
          node scripts/scanner_repair_regressions.cjs
          node scripts/photo_read_regressions.cjs
          node scripts/play_regressions.cjs
          node scripts/play_safety_regressions.cjs
          node scripts/browser_regressions.cjs
          node scripts/newspaper_regressions.cjs
      - name: Archive tested sources
        if: always()
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD > verification-artifacts/commit.txt
          git ls-tree -r HEAD > verification-artifacts/tree.txt
          git archive --format=zip HEAD web scripts .github/workflows pyproject.toml > verification-artifacts/tested-sources.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: structural-capture-browser
          path: |
            browser-artifacts
            verification-artifacts
          retention-days: 7
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: random
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: |
          python -m pip install -e '.[dev]'
          python -m pip check
          python -m pip wheel --no-deps . --wheel-dir dist
          python scripts/smoke_wheel.py --wheel-dir dist
          python -m ruff check .
          python -m compileall -q gridsolver tests scripts Examples run.py examples2.py
      - run: python -X dev -m pytest -q tests -m 'not slow' --durations=10
