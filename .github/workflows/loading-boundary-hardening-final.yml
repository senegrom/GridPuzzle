name: Finalize loader boundary hardening

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/loading-boundary-hardening-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-loader-boundary-hardening
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Apply loader hardening when not already promoted
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gridsolver/validation.py ]] \
             && grep -q 'row_wise = require_bool' gridsolver/abstract_grids/grid_loading.py \
             && [[ -f tests/test_loading_boundaries.py ]]; then
            echo "Loader hardening is already present."
          else
            python .github/scripts/run_loading_boundary_hardening.py
          fi

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          python -m compileall -q gridsolver tests Examples run.py examples2.py
          python -X dev -m pytest -q \
            tests/test_loading_boundaries.py \
            tests/test_cli_and_loading.py \
            tests/test_iterable_loading.py \
            tests/test_regressions.py \
            tests/test_hardening.py \
            tests/test_solver_api.py \
            tests/test_examples_2.py \
            -m "not slow" \
            -k "not test_parallel_trials_match_sequential" \
            --durations=15
          python -O -m pytest -q \
            tests/test_loading_boundaries.py \
            tests/test_cli_and_loading.py \
            tests/test_iterable_loading.py

      - name: Remove migration scaffolding and promote
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_dir = Path('.github/workflows')
          permanent = {'ci.yml', 'extended.yml', 'benchmarks.yml'}
          for path in workflow_dir.glob('*'):
              if path.is_file() and path.name not in permanent:
                  path.unlink()

          script_dir = Path('.github/scripts')
          if script_dir.exists():
              permanent_text = '\n'.join(
                  (workflow_dir / name).read_text(encoding='utf-8')
                  for name in permanent
                  if (workflow_dir / name).exists()
              )
              for path in script_dir.rglob('*'):
                  if path.is_file() and path.as_posix() not in permanent_text:
                      path.unlink()
              for path in sorted(script_dir.rglob('*'), reverse=True):
                  if path.is_dir() and not any(path.iterdir()):
                      path.rmdir()
              if script_dir.exists() and not any(script_dir.iterdir()):
                  script_dir.rmdir()
          PY
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source or cleanup changes remain."
            exit 0
          fi
          git commit -m "Harden loader boundaries and nested inputs"
          git pull --rebase origin master
          git push origin HEAD:master
