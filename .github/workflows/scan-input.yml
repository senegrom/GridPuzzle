name: Scan input quality
on:
  push:
    branches: ['improve/scan-input-*']
  pull_request:
    paths: ['web/**', 'scripts/scan_input_regressions.cjs', '.github/workflows/scan-input.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Retain exact tested source
        run: |
          mkdir -p scan-input-artifacts
          git archive HEAD > scan-input-artifacts/source.tar
          git rev-parse HEAD > scan-input-artifacts/commit.txt
      - name: Unit regressions
        run: node --test web/tests/*.test.js > scan-input-artifacts/unit-tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-input-report
          path: scan-input-artifacts
          retention-days: 3
