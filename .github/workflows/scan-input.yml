name: Scan input quality
on:
  push:
    branches: ['improve/scan-input-*']
  pull_request:
    paths: ['web/**', 'scripts/scan_input_regressions.cjs', '.github/workflows/scan-input.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan-input:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Retain exact tested source
        run: |
          mkdir -p scan-input-artifacts
          git archive HEAD > scan-input-artifacts/source.tar
          git rev-parse HEAD > scan-input-artifacts/commit.txt
      - name: Unit regressions and syntax checks
        run: |
          node --test --test-concurrency=1 web/tests/*.test.js > scan-input-artifacts/unit-tests.log
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
          node --check scripts/scan_input_regressions.cjs
      - name: Build pinned self-hosted runtime
        run: python scripts/build_web.py
      - name: Install repository browser test versions
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Existing newspaper, font and degraded-image quality checks
        run: node scripts/ocr_quality_regressions.cjs
      - name: Existing damaged-clue checks
        run: node scripts/recognition_fragments_regressions.cjs
      - name: Existing multi-digit paired recognition checks
        run: node scripts/recognition_segments_regressions.cjs
      - name: Original-detail decoding, cell alignment and end-to-end photo scans
        run: node scripts/scan_input_regressions.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-input-report
          path: |
            scan-input-artifacts
            browser-artifacts
          retention-days: 7
