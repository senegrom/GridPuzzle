name: Scanner quality
on:
  pull_request:
    paths:
      - 'web/**'
      - 'scripts/*regressions.cjs'
      - 'scripts/build_web.py'
      - 'scripts/fetch_live_fixtures.py'
      - 'Examples/BrowserScanner/**'
      - '.github/workflows/scan-input.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scan-input-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan-input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Record the tested commit
        run: |
          mkdir -p scan-input-artifacts
          git rev-parse HEAD > scan-input-artifacts/commit.txt
      - name: Unit regressions and syntax checks
        run: |
          node --test web/tests/*.test.js | tee scan-input-artifacts/unit-tests.log
          find web -name '*.js' -not -path '*/vendor/*' -exec node --check {} \;
      - name: Build pinned self-hosted runtime
        run: python scripts/build_web.py
      - name: Install repository browser test versions
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Newspaper, font and degraded-image quality checks
        run: node scripts/ocr_quality_regressions.cjs
      - name: Damaged-clue checks
        run: node scripts/recognition_fragments_regressions.cjs
      - name: Multi-digit paired recognition checks
        run: node scripts/recognition_segments_regressions.cjs
      - name: Original-detail decoding, cell alignment and end-to-end photo scans
        run: node scripts/scan_input_regressions.cjs
      - name: Fetch bounded external picture tests
        run: python scripts/fetch_live_fixtures.py
      - name: Real moving-video scanning and external picture tracking
        run: node scripts/live_motion_regressions.cjs
      - name: Camera capture and solver integration
        run: node scripts/live_camera_regressions.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-input-report
          path: |
            scan-input-artifacts
            browser-artifacts
          retention-days: 7
