name: Verify live feature refinements
on:
  push:
    branches: ['improve/live-worker-recovery-diagnostics-20260919']
    paths: ['.github/workflows/live-feature-refinement.yml']
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify and apply tested content-only refinement
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          own='.github/workflows/live-feature-refinement.yml'
          names=subprocess.check_output(['git','diff','--name-only','dd75bde458955a954414b2bde0a39f910447fbe6','HEAD'],text=True).splitlines()
          assert set(names)=={own},'Branch changed; do not overwrite it'
          payload=''
          patch=gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a3385b48f9255e0011de2441467d11da1a4bb41d1ebe8486ed1e15b641ae7d69'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          keep=pathlib.Path(own).read_bytes();pathlib.Path(own).unlink()
          subprocess.run(['git','add','-A'],check=True)
          assert subprocess.check_output(['git','write-tree'],text=True).strip()=='3f01dae03f0ae4e1d02adafdd7d4da20de7db268'
          pathlib.Path(own).write_bytes(keep)
          subprocess.run(['git','add',own],check=True)
          PY
      - name: Verify and update only the feature branch
        run: |
          node --test --test-concurrency=1 web/tests/*.test.js
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Pair accelerated browser tests with real worker completion and keep diagnostic evidence current'
          git push origin HEAD:refs/heads/improve/live-worker-recovery-diagnostics-20260919
