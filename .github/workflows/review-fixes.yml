name: Review fixes validation
on:
  push:
    branches: [fix/review-20260905]
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/review-20260905'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/review-20260905
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install supported runtime dependencies
        run: python -m pip install -e ".[dev]"
      - name: Reproduce the original target corruption
        run: |
          python - <<'PY'
          from gridsolver.abstract_grids.grid_loading import create_from_str
          grid = create_from_str("Kenken::aaaa:a+0.6")
          assert [rule.sum for rule in grid.rules if hasattr(rule, "sum")] == [6]
          print("Confirmed: 0.6 was silently accepted as integer target 6")
          PY
      - name: Apply source-anchored fixes
        run: python .review_apply.py
      - name: Compile and validate dependencies
        run: |
          python -m compileall -q gridsolver tests scripts
          python -m pip check
          git diff --check
      - name: Run every bounded test, including new regressions
        run: python -X dev -m pytest -q tests -m "not slow" --durations=10 --junitxml=review-results.xml
      - name: Measure branching and verify complete solution equivalence
        run: python scripts/benchmark_branch_pressure.py
      - name: Exercise the built wheel in a clean environment
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python scripts/smoke_wheel.py --wheel-dir dist
      - name: Commit validated source changes
        run: |
          git restore .github/workflows/ci.yml
          git add gridsolver DEVELOPMENT.md benchmarks/global_branch_pressure_2026-09-05.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix cage target parsing, global branch memory, pool cleanup and wheel validation"
          git push origin HEAD:fix/review-20260905
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-fixes-results
          path: |
            review-results.xml
            benchmarks/global_branch_pressure_2026-09-05.json
