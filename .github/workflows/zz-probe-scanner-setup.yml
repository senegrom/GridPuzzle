name: Probe scanner setup (temporary)
# Temporary, for the scanner-setup pull request only: the old setup-scanner
# (master's, apt and --with-deps) against the new one (the Playwright image)
# on Ubuntu 24.04 and 26.04 runners, with what the browsers draw for the font
# families the suites name. Removed before the pull request is ready.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: probe-scanner-setup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  old-2404:
    name: old setup on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 536ccf8368936900b6f5e3b88b64a430c0742cc7
          path: old
      - uses: ./old/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  old-2604:
    name: old setup on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 536ccf8368936900b6f5e3b88b64a430c0742cc7
          path: old
      - uses: ./old/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  new-2404:
    name: new setup, noble image on ubuntu-24.04
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Python modules the scripts use
        run: python -c "import ssl, sqlite3, zlib, lzma, bz2, hashlib, json, urllib.request; print(ssl.OPENSSL_VERSION)"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  new-2604-noble:
    name: new setup, noble image on ubuntu-26.04
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Python modules the scripts use
        run: python -c "import ssl, sqlite3, zlib, lzma, bz2, hashlib, json, urllib.request; print(ssl.OPENSSL_VERSION)"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  new-2604-resolute:
    name: new setup, resolute image on ubuntu-26.04
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
      options: --ipc=host --init
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Python modules the scripts use
        run: python -c "import ssl, sqlite3, zlib, lzma, bz2, hashlib, json, urllib.request; print(ssl.OPENSSL_VERSION)"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
