name: Probe scanner setup (temporary)
# Temporary, for the scanner-setup pull request only, removed again before it
# is ready: what the browsers draw under the old setup-scanner (master's, apt
# and --with-deps) and the new one (the Playwright image), with and without
# Lato, and whether setup-scanner stops a job whose image and runner are of
# different Ubuntu releases before setup-python runs.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: probe3-scanner-setup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  old-2404:
    name: old setup on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 536ccf8368936900b6f5e3b88b64a430c0742cc7
          path: old
      - uses: ./old/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  new-2404:
    name: new setup, noble image on ubuntu-24.04
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init --user 1001
      volumes:
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
        - /usr/share/fonts/truetype/lato:/usr/share/fonts/truetype/lato:ro
        - /etc/os-release:/run/host/os-release:ro
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  new-2404-nolato:
    name: new setup without Lato, noble image on ubuntu-24.04
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init --user 1001
      volumes:
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
        - /etc/os-release:/run/host/os-release:ro
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: Fonts the browsers draw
        run: node .github/probe/fontprobe.cjs
  noble-on-2604:
    name: release check, noble image on ubuntu-26.04
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host --init --user 1001
      volumes:
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
        - /usr/share/fonts/truetype/lato:/usr/share/fonts/truetype/lato:ro
        - /etc/os-release:/run/host/os-release:ro
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - id: setup
        continue-on-error: true
        uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: setup-scanner must stop before setup-python
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "setup-scanner: $OUTCOME; pythonLocation: ${pythonLocation:-unset}"
          [ "$OUTCOME" = failure ] && [ -z "${pythonLocation:-}" ]
  resolute-on-2404:
    name: release check, resolute image on ubuntu-24.04
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
      options: --ipc=host --init --user 1001
      volumes:
        - /usr/share/fonts/truetype/dejavu:/usr/share/fonts/truetype/dejavu:ro
        - /usr/share/fonts/truetype/lato:/usr/share/fonts/truetype/lato:ro
        - /etc/os-release:/run/host/os-release:ro
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: new
      - id: setup
        continue-on-error: true
        uses: ./new/.github/actions/setup-scanner
        with:
          build: "false"
      - name: setup-scanner must stop before setup-python
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "setup-scanner: $OUTCOME; pythonLocation: ${pythonLocation:-unset}"
          [ "$OUTCOME" = failure ] && [ -z "${pythonLocation:-}" ]
