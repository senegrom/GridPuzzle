# Keep the GitHub Actions SHA pins and the Python lower bounds current. Each
# ecosystem is grouped into one weekly pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns:
          - "*"
    open-pull-requests-limit: 3
