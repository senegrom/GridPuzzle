name: Set up the project
description: >-
  Python 3.14 with pip caching, the project installed in editable mode with
  the requested extras, and pip check. Every Python workflow used to repeat
  these lines.
inputs:
  extras:
    description: Extras to install, in pip's bracket syntax
    default: dev
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.14"
        cache: pip
        cache-dependency-path: pyproject.toml
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[${{ inputs.extras }}]"
        python -m pip check
